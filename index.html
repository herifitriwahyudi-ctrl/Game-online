<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Dragons Hunter - Tebak Hewan atau Naga/Harimau</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: 
                radial-gradient(ellipse at bottom, rgba(40, 80, 50, 0.8), transparent),
                linear-gradient(180deg, #0a1f14 0%, #143a20 50%, #1a4527 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* Background Hutan */
        .forest-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 120px; height: 200px;
            background: linear-gradient(180deg, #2d5a27, #1a3d15);
            border-radius: 10px 10px 0 0;
            animation: sway 5s ease-in-out infinite;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: -40px; left: -20px;
            width: 160px; height: 80px;
            background: linear-gradient(135deg, #3a7d30, #2d5a27);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .tree:nth-child(1) { left: 10px; }
        .tree:nth-child(2) { left: 15%; height: 240px; animation-delay: 1s; }
        .tree:nth-child(3) { right: 10%; height: 180px; animation-delay: 2s; }
        .tree:nth-child(4) { right: 20px; height: 260px; animation-delay: 3s; }
        .tree:nth-child(5) { left: 40%; height: 220px; animation-delay: 4s; }
        .tree:nth-child(6) { right: 40%; height: 200px; animation-delay: 5s; }

        .fireflies {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffe066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066;
            animation: fly 8s infinite;
        }

        .fireflies:nth-child(7) { top: 30%; left: 20%; animation-delay: 0s; }
        .fireflies:nth-child(8) { top: 50%; left: 80%; animation-delay: 2s; }
        .fireflies:nth-child(9) { top: 70%; left: 50%; animation-delay: 4s; }
        .fireflies:nth-child(10) { top: 40%; left: 70%; animation-delay: 6s; }
        .fireflies:nth-child(11) { top: 60%; left: 30%; animation-delay: 1s; }
        .fireflies:nth-child(12) { top: 20%; left: 60%; animation-delay: 3s; }
        .fireflies:nth-child(13) { top: 80%; left: 90%; animation-delay: 5s; }
        .fireflies:nth-child(14) { top: 45%; left: 10%; animation-delay: 7s; }

        .moon {
            position: absolute;
            top: 50px; right: 100px;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f, 0 0 80px rgba(241,196,15,0.3);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            25% { transform: translate(15px, -20px); opacity: 1; }
            50% { transform: translate(-10px, -35px); opacity: 0.6; }
            75% { transform: translate(20px, -15px); opacity: 0.8; }
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 40px #f1c40f; }
            to { box-shadow: 0 0 60px #f1c40f, 0 0 100px rgba(241,196,15,0.5); }
        }

        /* Container Utama */
        .game-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            position: relative;
            z-index: 10;
        }

        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
            border-radius: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-header h1 {
            font-size: 2.5em;
            color: #3d1e00;
            font-family: 'Papyrus', 'Georgia', serif;
            letter-spacing: 3px;
        }

        .game-header p {
            font-size: 1.2em;
            color: #3d1e00;
            margin-top: 10px;
        }

        /* Info Panel */
        .info-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-box {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .info-box label {
            display: block;
            font-size: 0.9em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .info-box span {
            font-size: 1.8em;
            font-weight: bold;
            color: #fff;
        }

        /* Mode Taruhan */
        .bet-mode {
            text-align: center;
            margin: 20px 0;
        }

        .bet-mode h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .mode-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border: 2px solid #8b6914;
            border-radius: 15px;
            padding: 15px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
        }

        .mode-btn:hover {
            background: linear-gradient(145deg, #5a4f45, #3a2f25);
            transform: translateY(-3px);
            border-color: #ffd700;
        }

        .mode-btn.selected {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        /* Pilihan Jawaban */
        .answer-section {
            margin: 20px 0;
        }

        .answer-section h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .animal-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .animal-btn {
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border: 2px solid #8b6914;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }

        .animal-btn:hover {
            background: linear-gradient(145deg, #5a4f45, #3a2f25);
            transform: translateY(-3px);
            border-color: #ffd700;
        }

        .animal-btn.selected {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .animal-btn img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .animal-btn .animal-name {
            font-size: 0.9em;
            font-weight: bold;
        }

        /* Tombol Naga/Harimau */
        .bonus-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .bonus-btn {
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border: 2px solid #ff4444;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 1.5em;
            font-weight: bold;
        }

        .bonus-btn:hover {
            background: linear-gradient(145deg, #5a4f45, #3a2f25);
            transform: translateY(-3px);
            border-color: #ffd700;
        }

        .bonus-btn.selected {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        /* Tombol Spin */
        .spin-btn {
            display: block;
            margin: 20px auto;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 15px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Papan Permainan */
        .game-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            border: 3px solid #8b6914;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-size: 1.5em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .cell img, .cell video {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .cell.revealed {
            background: rgba(255,255,255,0.1);
        }

        .cell.hidden {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            color: #ffd700;
            cursor: pointer;
        }

        .cell.win {
            border: 3px solid #00ff88;
            animation: winPulse 0.5s infinite;
        }

        .cell.lose {
            border: 3px solid #ff4444;
            animation: losePulse 0.5s infinite;
        }

        @keyframes winPulse {
            0%, 100% { box-shadow: 0 0 10px #00ff88; }
            50% { box-shadow: 0 0 20px #00ff88; }
        }

        @keyframes losePulse {
            0%, 100% { box-shadow: 0 0 10px #ff4444; }
            50% { box-shadow: 0 0 20px #ff4444; }
        }

        /* Hasil */
        .result-display {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            font-size: 1.2em;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-display.win {
            color: #00ff88;
        }

        .result-display.lose {
            color: #ff4444;
        }

        /* Sound Toggle */
        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        /* Responsif */
        @media (max-width: 768px) {
            .game-container {
                margin: 10px;
                padding: 10px;
            }

            .game-header h1 {
                font-size: 1.8em;
            }

            .game-board {
                grid-template-columns: repeat(5, 1fr);
            }

            .animal-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="forest-bg">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="moon"></div>
    </div>

    <!-- Sound Toggle -->
    <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">🔊</button>

    <!-- Game Container -->
    <div class="game-container">
        <div class="game-header">
            <h1>🐉 DRAGONS HUNTER 🐉</h1>
            <p>Tebak Hewan atau Naga/Harimau!</p>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <div class="info-box">
                <label>Ronde</label>
                <span id="round">1</span>
                <span>/20</span>
            </div>
            <div class="info-box">
                <label>Benar</label>
                <span id="correct">0</span>
            </div>
            <div class="info-box">
                <label>Salah</label>
                <span id="wrong">0</span>
            </div>
        </div>

        <!-- Mode Taruhan -->
        <div class="bet-mode">
            <h3>🎯 Pilih Mode Taruhan</h3>
            <div class="mode-buttons">
                <button class="mode-btn" id="modeHewan" onclick="selectMode('hewan')">
                    🐾 Tebak Hewan
                </button>
                <button class="mode-btn" id="modeBonus" onclick="selectMode('bonus')">
                    🐉 Tebak Naga/Harimau
                </button>
            </div>
        </div>

        <!-- Pilihan Hewan (10 tombol) -->
        <div class="answer-section" id="animalSection">
            <h3>🐾 Pilih Hewan yang Akan Keluar!</h3>
            <div class="animal-options" id="animalOptions">
                <!-- Akan digenerate oleh JS -->
            </div>
        </div>

        <!-- Pilihan Naga/Harimau (2 tombol) -->
        <div class="answer-section" id="bonusSection" style="display: none;">
            <h3>🐉 Pilih Naga atau Harimau!</h3>
            <div class="bonus-options" id="bonusOptions">
                <button class="bonus-btn" id="btnNaga" onclick="selectBonus('Naga')">
                    🐉 NAGA
                </button>
                <button class="bonus-btn" id="btnHarimau" onclick="selectBonus('Harimau')">
                    🐯 HARIMAU
                </button>
            </div>
        </div>

        <!-- Tombol Spin -->
        <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 SPIN!</button>

        <!-- Papan Permainan -->
        <h3 style="text-align: center; color: #ffd700; margin: 20px 0 10px;">📊 Hasil Permainan</h3>
        <div class="game-board" id="gameBoard"></div>

        <!-- Hasil -->
        <div class="result-display" id="result"></div>
    </div>

    <script>
        // ========== DATA HEWAN ==========
        const normalAnimals = [
            { name: "Rubah",    icon: "rubah.png" },
            { name: "Serigala", icon: "serigala.png" },
            { name: "Panda",    icon: "panda.png" },
            { name: "Beruang",  icon: "beruang.png" },
            { name: "Gajah",    icon: "gajah.png" },
            { name: "Singa",    icon: "singa.png" },
            { name: "Rusa",     icon: "rusa.png" },
            { name: "Kucing",   icon: "kucing.png" },
            { name: "Burung",   icon: "burung.png" },
            { name: "Kelinci",  icon: "kelinci.png" }
        ];

        const bonusAnimals = [
            { name: "Naga",    icon: "naga.mp4",    type: "Naga" },
            { name: "Harimau", icon: "harimau.mp4", type: "Harimau" }
        ];

        // Gabungan semua untuk hasil acak
        const allAnimals = [...normalAnimals, ...bonusAnimals];

        // ========== STATE GAME ==========
        let currentRound = 1;
        const totalRounds = 20;
        let correctCount = 0;
        let wrongCount = 0;
        let selectedMode = null;
        let selectedAnimal = null;
        let selectedBonus = null;
        let isSpinning = false;
        let soundEnabled = true;
        let audioCtx = null;
        let history = [];

        // ========== AUDIO ==========
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playCorrectSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWrongSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) initAudio();
        }

        // ========== GENERATE ANIMAL OPTIONS ==========
        function generateAnimalOptions() {
            const container = document.getElementById('animalOptions');
            container.innerHTML = '';
            
            normalAnimals.forEach(animal => {
                const btn = document.createElement('button');
                btn.className = 'animal-btn';
                btn.innerHTML = `
                    <img src="${animal.icon}" alt="${animal.name}">
                    <div class="animal-name">${animal.name}</div>
                `;
                btn.dataset.animal = animal.name;
                btn.onclick = () => selectAnimal(animal.name, btn);
                container.appendChild(btn);
            });
        }

        // ========== PILIH MODE ==========
        function selectMode(mode) {
            selectedMode = mode;
            selectedAnimal = null;
            selectedBonus = null;
            
            // Update UI mode
            const modeHewan = document.getElementById('modeHewan');
            const modeBonus = document.getElementById('modeBonus');
            
            if (mode === 'hewan') {
                modeHewan.classList.add('selected');
                modeBonus.classList.remove('selected');
                document.getElementById('animalSection').style.display = 'block';
                document.getElementById('bonusSection').style.display = 'none';
            } else {
                modeBonus.classList.add('selected');
                modeHewan.classList.remove('selected');
                document.getElementById('animalSection').style.display = 'none';
                document.getElementById('bonusSection').style.display = 'block';
            }
            
            // Reset pilihan
            document.querySelectorAll('.animal-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btnNaga').classList.remove('selected');
            document.getElementById('btnHarimau').classList.remove('selected');
        }

        // ========== PILIH HEWAN ==========
        function selectAnimal(animalName, btn) {
            if (selectedMode !== 'hewan') return;
            
            selectedAnimal = animalName;
            
            // Update UI
            document.querySelectorAll('.animal-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        // ========== PILIH NAGA/HARIMAU ==========
        function selectBonus(bonus) {
            if (selectedMode !== 'bonus') return;
            
            selectedBonus = bonus;
            
            // Update UI
            const btnNaga = document.getElementById('btnNaga');
            const btnHarimau = document.getElementById('btnHarimau');
            
            if (bonus === 'Naga') {
                btnNaga.classList.add('selected');
                btnHarimau.classList.remove('selected');
            } else {
                btnHarimau.classList.add('selected');
                btnNaga.classList.remove('selected');
            }
        }

        // ========== GENERATE BOARD ==========
        function generateBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            for (let i = 0; i < totalRounds; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell hidden';
                cell.id = `cell-${i}`;
                cell.textContent = '?';
                board.appendChild(cell);
            }
        }

        // ========== SPIN ==========
        function spin() {
            if (isSpinning) return;
            
            if (!selectedMode) {
                alert('Pilih mode taruhan terlebih dahulu!');
                return;
            }
            
            if (selectedMode === 'hewan' && !selectedAnimal) {
                alert('Pilih hewan yang akan ditebak!');
                return;
            }
            
            if (selectedMode === 'bonus' && !selectedBonus) {
                alert('Pilih Naga atau Harimau!');
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            // Tentukan hasil acak
            const randomIndex = Math.floor(Math.random() * allAnimals.length);
            const result = allAnimals[randomIndex];
            
            // Reveal cell
            const cell = document.getElementById(`cell-${currentRound - 1}`);
            
            // Tampilkan hasil
            if (result.name === 'Naga' || result.name === 'Harimau') {
                cell.innerHTML = `<video src="${result.icon}" autoplay loop muted playsinline></video>`;
            } else {
                cell.innerHTML = `<img src="${result.icon}" alt="${result.name}">`;
            }
            
            cell.classList.remove('hidden');
            cell.classList.add('revealed');

            // Cek kemenangan
            let isWin = false;
            
            if (selectedMode === 'hewan') {
                // Mode hewan: menang jika hewan yang keluar sama dengan tebakan
                isWin = result.name === selectedAnimal;
            } else {
                // Mode bonus: menang jika Naga/Harimau keluar sesuai tebakan
                isWin = result.name === selectedBonus;
            }
            
            if (isWin) {
                cell.classList.add('win');
                correctCount++;
                playCorrectSound();
                document.getElementById('result').textContent = `✅ BENAR! ${result.name} keluar!`;
                document.getElementById('result').className = 'result-display win';
            } else {
                cell.classList.add('lose');
                wrongCount++;
                playWrongSound();
                document.getElementById('result').textContent = `❌ SALAH! ${result.name} keluar!`;
                document.getElementById('result').className = 'result-display lose';
            }

            // Update info
            document.getElementById('round').textContent = currentRound;
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('wrong').textContent = wrongCount;

            // Simpan history
            history.push({
                result: result.name,
                selectedMode: selectedMode,
                selected: selectedMode === 'hewan' ? selectedAnimal : selectedBonus,
                isWin: isWin
            });

            // Reset pilihan untuk ronde berikutnya
            selectedAnimal = null;
            selectedBonus = null;
            document.querySelectorAll('.animal-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btnNaga').classList.remove('selected');
            document.getElementById('btnHarimau').classList.remove('selected');

            // Lanjut ke ronde berikutnya
            currentRound++;
            
            if (currentRound <= totalRounds) {
                spinBtn.disabled = false;
                isSpinning = false;
            } else {
                // Game selesai
                document.getElementById('result').textContent = `🏆 GAME SELESAI! Benar: ${correctCount}, Salah: ${wrongCount}`;
                document.getElementById('result').className = 'result-display';
                spinBtn.textContent = 'Main Lagi 🔄';
                spinBtn.onclick = resetGame;
                spinBtn.disabled = false;
                isSpinning = false;
            }
        }

        // ========== RESET GAME ==========
        function resetGame() {
            currentRound = 1;
            correctCount = 0;
            wrongCount = 0;
            selectedMode = null;
            selectedAnimal = null;
            selectedBonus = null;
            history = [];
            
            document.getElementById('round').textContent = 1;
            document.getElementById('correct').textContent = 0;
            document.getElementById('wrong').textContent = 0;
            
            document.getElementById('spinBtn').textContent = '🎰 SPIN!';
            document.getElementById('spinBtn').onclick = spin;
            document.getElementById('spinBtn').disabled = false;
            
            // Reset mode
            document.getElementById('modeHewan').classList.remove('selected');
            document.getElementById('modeBonus').classList.remove('selected');
            document.getElementById('animalSection').style.display = 'block';
            document.getElementById('bonusSection').style.display = 'none';
            
            // Reset pilihan
            document.querySelectorAll('.animal-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btnNaga').classList.remove('selected');
            document.getElementById('btnHarimau').classList.remove('selected');
            
            // Generate board baru
            generateBoard();
            
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = 'result-display';
        }

        // ========== INISIALISASI ==========
        function init() {
            document.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.removeEventListener('click', initAudioOnce);
            });

            generateAnimalOptions();
            generateBoard();
        }

        init();
    </script>
</body>
                  </html>
