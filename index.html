<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Hutan Rimba Ultimate - 12 Gulungan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: 
                radial-gradient(ellipse at bottom, rgba(40, 80, 50, 0.8), transparent),
                linear-gradient(180deg, #0a1f14 0%, #143a20 50%, #1a4527 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }

        /* Background Hutan Animasi */
        .forest-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 120px;
            height: 200px;
            background: linear-gradient(180deg, #2d5a27, #1a3d15);
            border-radius: 10px 10px 0 0;
            animation: sway 5s ease-in-out infinite;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -20px;
            width: 160px;
            height: 80px;
            background: linear-gradient(135deg, #3a7d30, #2d5a27);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .tree:nth-child(1) { left: 10px; }
        .tree:nth-child(2) { left: 15%; height: 240px; animation-delay: 1s; }
        .tree:nth-child(3) { right: 10%; height: 180px; animation-delay: 2s; }
        .tree:nth-child(4) { right: 20px; height: 260px; animation-delay: 3s; }
        .tree:nth-child(5) { left: 40%; height: 220px; animation-delay: 4s; }
        .tree:nth-child(6) { right: 40%; height: 200px; animation-delay: 5s; }

        .fireflies {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffe066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066;
            animation: fly 8s infinite;
        }

        .fireflies:nth-child(7) { top: 30%; left: 20%; animation-delay: 0s; }
        .fireflies:nth-child(8) { top: 50%; left: 80%; animation-delay: 2s; }
        .fireflies:nth-child(9) { top: 70%; left: 50%; animation-delay: 4s; }
        .fireflies:nth-child(10) { top: 40%; left: 70%; animation-delay: 6s; }
        .fireflies:nth-child(11) { top: 60%; left: 30%; animation-delay: 1s; }
        .fireflies:nth-child(12) { top: 20%; left: 60%; animation-delay: 3s; }
        .fireflies:nth-child(13) { top: 80%; left: 90%; animation-delay: 5s; }
        .fireflies:nth-child(14) { top: 45%; left: 10%; animation-delay: 7s; }

        .fog {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.1));
            animation: fogMove 10s ease-in-out infinite alternate;
            z-index: -0.5;
        }

        .moon {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f, 0 0 80px rgba(241,196,15,0.3);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            25% { transform: translate(15px, -20px); opacity: 1; }
            50% { transform: translate(-10px, -35px); opacity: 0.6; }
            75% { transform: translate(20px, -15px); opacity: 0.8; }
        }

        @keyframes fogMove {
            from { transform: translateX(0); }
            to { transform: translateX(-50px); }
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 40px #f1c40f; }
            to { box-shadow: 0 0 60px #f1c40f, 0 0 100px rgba(241,196,15,0.5); }
        }

        /* Container utama */
        .game-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            position: relative;
            z-index: 10;
        }

        /* Header game */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
            border-radius: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '🐉';
            position: absolute;
            left: 20px;
            font-size: 40px;
            animation: floatDragon 3s ease-in-out infinite;
        }

        .game-header::after {
            content: '🐉';
            position: absolute;
            right: 20px;
            font-size: 40px;
            animation: floatDragon 3s ease-in-out infinite reverse;
        }

        @keyframes floatDragon {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .game-header h1 {
            font-size: 2.8em;
            color: #3d1e00;
            font-family: 'Papyrus', 'Georgia', serif;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.3);
        }

        .game-header p {
            font-size: 1.2em;
            color: #3d1e00;
        }

        /* Grid 12 Gulungan */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            background: radial-gradient(ellipse at center, #3d5a3d, #1a2a1a);
            border-radius: 20px;
            border: 3px solid #8b6914;
            margin-bottom: 20px;
            position: relative;
        }

        .slot-grid::before {
            content: '🏆';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255,215,0,0.5);
            z-index: 2;
        }

        .reel {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 
                inset 0 4px 15px rgba(0,0,0,0.6),
                0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            overflow: hidden;
            min-height: 100px;
        }

        .reel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, #ffd700, transparent);
            opacity: 0.5;
        }

        .reel svg {
            width: 60%;
            height: 60%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .reel:hover svg {
            transform: scale(1.1);
        }

        .reel.spinning {
            animation: spinReel 0.8s ease-in-out;
        }

        @keyframes spinReel {
            0% { transform: scale(1.2) rotate(0deg); }
            25% { transform: scale(0.8) rotate(180deg); }
            50% { transform: scale(1.3) rotate(360deg); }
            75% { transform: scale(0.9) rotate(540deg); }
            100% { transform: scale(1) rotate(720deg); }
        }

        .reel.win {
            border: 3px solid #00ff88;
            box-shadow: 0 0 30px #00ff88, inset 0 0 20px rgba(0,255,136,0.3);
            animation: winPulse 1s infinite;
        }

        .reel.dragon-win {
            border: 3px solid #ff4444;
            box-shadow: 0 0 40px #ff4444, inset 0 0 30px rgba(255,68,68,0.4);
            animation: dragonPulse 0.5s infinite;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes dragonPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px #ff4444; }
            50% { transform: scale(1.1); box-shadow: 0 0 50px #ff6666; }
        }

        /* Panel Kontrol */
        .control-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 15px;
            border: 2px solid #8b6914;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-box {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            min-width: 120px;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            background: rgba(255,255,255,0.2);
        }

        .stat-box label {
            display: block;
            font-size: 0.9em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .stat-box span {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        .spin-btn {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
            position: relative;
            overflow: hidden;
        }

        .spin-btn::before {
            content: '🎰';
            margin-right: 8px;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .auto-btn {
            background: linear-gradient(145deg, #4a9d4a, #2d7a2d);
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 15px rgba(74,157,74,0.4);
            transition: all 0.3s ease;
            color: #fff;
        }

        .auto-btn:hover {
            transform: translateY(-2px);
        }

        .bet-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .bet-btn {
            background: #8b6914;
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .bet-btn:hover {
            background: #a07818;
        }

        /* Hasil */
        .result-display {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            font-size: 1.2em;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .result-display.win {
            background: rgba(0,255,136,0.2);
            border: 2px solid #00ff88;
        }

        .result-display.lose {
            background: rgba(255,102,102,0.2);
            border: 2px solid #ff6666;
        }

        .result-display.jackpot {
            background: rgba(255,68,68,0.3);
            border: 3px solid #ff4444;
            animation: jackpotGlow 0.5s infinite;
        }

        @keyframes jackpotGlow {
            0%, 100% { box-shadow: 0 0 20px #ff4444; }
            50% { box-shadow: 0 0 40px #ff6666; }
        }

        /* Paytable */
        .paytable {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
        }

        .paytable h3 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .pay-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .pay-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .pay-item .animal-icon {
            font-size: 1.2em;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Leaderboard */
        .leaderboard {
            margin-top: 20px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #8b6914;
        }

        .leaderboard h3 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.15);
        }

        .leaderboard-item.rank-1 {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #3d1e00;
            font-weight: bold;
        }

        .leaderboard-item.rank-2 {
            background: linear-gradient(145deg, #c0c0c0, #a8a8a8);
            color: #333;
        }

        .leaderboard-item.rank-3 {
            background: linear-gradient(145deg, #cd7f32, #b8860b);
            color: #333;
        }

        .leaderboard-name {
            font-weight: bold;
        }

        .leaderboard-score {
            font-size: 1.2em;
            font-weight: bold;
        }

        .name-input {
            padding: 8px;
            border-radius: 5px;
            border: 2px solid #8b6914;
            background: #1a1208;
            color: #fff;
            font-size: 1em;
            margin-right: 10px;
            width: 150px;
        }

        .save-btn {
            background: #ffd700;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #3d1e00;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: #ffaa00;
        }

        /* Efek suara */
        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        /* Partikel Emas */
        .gold-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #ffd700, #ffaa00);
            border-radius: 50%;
            animation: particleFall 3s ease-in-out infinite;
        }

        @keyframes particleFall {
            0% { transform: translateY(-100px) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        }

        /* Responsif */
        @media (max-width: 768px) {
            .game-container {
                margin: 10px;
                padding: 10px;
            }

            .game-header h1 {
                font-size: 1.8em;
            }

            .slot-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .control-panel {
                flex-direction: column;
            }

            .reel {
                min-height: 80px;
            }

            .reel svg {
                width: 50%;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <!-- Background Hutan -->
    <div class="forest-bg">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="moon"></div>
        <div class="fog"></div>
    </div>

    <!-- Partikel Emas -->
    <div class="gold-particles" id="goldParticles"></div>

    <!-- Tombol Suara -->
    <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">🔊</button>

    <!-- Game Container -->
    <div class="game-container">
        <div class="game-header">
            <h1>🐉 HUTAN RIMBA DONGENG 🐉</h1>
            <p style="font-size: 1.2em; color: #3d1e00;">Petualangan 12 Gulungan di Jantung Hutan</p>
        </div>

        <!-- Grid 12 Gulungan (3x4) -->
        <div class="slot-grid" id="slotGrid">
            <!-- Gulungan akan digenerate oleh JS -->
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="stat-box">
                <label>💰 Saldo</label>
                <span id="balance">5000</span>
            </div>
            <div class="stat-box">
                <label>🎲 Taruhan</label>
                <div class="bet-controls">
                    <button class="bet-btn" onclick="changeBet(-10)">-</button>
                    <span id="bet">100</span>
                    <button class="bet-btn" onclick="changeBet(10)">+</button>
                </div>
            </div>
            <div class="stat-box">
                <label>🏆 Jackpot</label>
                <span id="jackpot">50000</span>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN!</button>
            <button class="auto-btn" id="autoBtn" onclick="toggleAutoSpin()">🔄 Auto</button>
        </div>

        <!-- Hasil -->
        <div class="result-display" id="result">
            Selamat datang di Hutan Rimba! Klik SPIN untuk mulai!
        </div>

        <!-- Input Nama untuk Leaderboard -->
        <div style="text-align: center; margin: 10px 0;">
            <input type="text" class="name-input" id="playerName" placeholder="Masukkan nama Anda" maxlength="20">
            <button class="save-btn" onclick="saveScore()">💾 Simpan Skor</button>
        </div>

        <!-- Leaderboard -->
        <div class="leaderboard">
            <h3>🏆 Leaderboard Pemain</h3>
            <div class="leaderboard-list" id="leaderboardList">
                <!-- Akan diisi JS -->
            </div>
        </div>

        <!-- Paytable -->
        <div class="paytable">
            <h3>📜 Tabel Pembayaran Hewan</h3>
            <div class="paytable-grid" id="paytableGrid">
                <!-- Akan diisi JS -->
            </div>
        </div>
    </div>

    <script>
        // Data hewan realistis (SVG)
        const animals = [
            {

                pay5: 4000, pay4: 800, pay3: 150, pay2: 30
            },
            {
                name: "Serigala",
                icon: `
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="40" r="28" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="3"/>
                    <path d="M25,35 L15,20 L35,30" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="2"/>
                    <path d="M75,35 L85,20 L65,30" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="2"/>
                    <circle cx="38" cy="35" r="5" fill="#f39c12"/>

                    <circle cx="62" cy="35" r="5" fill="#f39c12"/>
                    <circle cx="62" cy="35" r="2" fill="#000"/>
                    <path d="M30,55 Q50,65 70,55" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                </svg>`,
                pay5: 3500, pay4: 700, pay3: 120, pay2: 20
            },
            {
                name: "Elang",
                icon: `
                <svg viewBox="0 0 100 100">

            },
            {

                icon: `

                pay5: 600, pay4: 100, pay3: 10, pay2: 0
            },
            {
                name: "Ular",
                icon: `
                <svg viewBox="0 0 100 100">
                    <path d="M20,50 Q50,20 80,50 Q95,70 80,85 Q65,95 50,80" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>

                </svg>`,
                pay5: 500, pay4: 80, pay3: 5, pay2: 0
            },
            {
                name: "Naga",
                icon: `
                <svg viewBox="0 0 100 100">
                    <path d="M20,50 Q40,20 60,50 Q80,70 70,85" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
                    <path d="M15,45 L5,30 L20,35 M15,55 L5,70 L20,65" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                    <circle cx="45" cy="45" r="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                    <circle cx="45" cy="45" r="4" fill="#f1c40f"/>
                    <circle cx="45" cy="45" r="2" fill="#000"/>
                    <path d="M55,50 Q70,40 80,50" fill="none" stroke="#e74c3c" stroke-width="2"/>
                    <path d="M60,55 Q75,65 85,55" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
                    <circle cx="65" cy="80" r="15" fill="#f1c40f" stroke="#e67e22" stroke-width="2" opacity="0.5"/>
                </svg>`,
                pay5: 50000, pay4: 10000, pay3: 1000, pay2: 100
            }
        ];

        // State game
        let balance = 5000;
        let currentBet = 100;
        let isSpinning = false;
        let isAutoSpin = false;
        let autoSpinInterval = null;
        let soundEnabled = true;
        let gameResult = {
            totalWin: 0,
            isJackpot: false,
            timestamp: null
        };

        // Audio Context untuk efek suara
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Efek suara spin
        function playSpinSound() {
            if (!soundEnabled || !audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        // Efek suara menang
        function playWinSound() {
            if (!soundEnabled || !audioCtx) return;
            
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3);
                }, index * 100);
            });
        }

        // Efek suara jackpot
        function playJackpotSound() {
            if (!soundEnabled || !audioCtx) return;
            
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    oscillator.type = 'triangle';
                    
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.5);
                }, index * 150);
            });
        }

        // Efek suara kalah
        function playLoseSound() {
            if (!soundEnabled || !audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.4);
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4);
        }

        // Suara burung hutan
        function playBirdSound() {
            if (!soundEnabled || !audioCtx) return;
            
            // Suara burung acak
            const randomBird = Math.floor(Math.random() * 3);
            const freqs = [[880, 1100], [660, 880], [990, 1320]];
            
            const [freq1, freq2] = freqs[randomBird];
            
            setTimeout(() => {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            }, Math.random() * 3000);
        }

        // Toggle suara
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const soundBtn = document.getElementById('soundBtn');
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) {
                initAudio();
                playBirdSound();
            }
        }

        // Generate partikel emas
        function generateGoldParticles() {
            const container = document.getElementById('goldParticles');
            container.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 15 + 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (Math.random() * 2 + 1) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }

        // Generate 12 gulungan (3 baris x 4 kolom)
        function generateReels() {
            const grid = document.getElementById('slotGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 12; i++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${i}`;
                reel.innerHTML = animals[Math.floor(Math.random() * animals.length)].icon;
                grid.appendChild(reel);
            }
        }

        // Generate paytable
        function generatePaytable() {
            const paytable = document.getElementById('paytableGrid');
            paytable.innerHTML = '';
            
            animals.forEach(animal => {
                const payItem = document.createElement('div');
                payItem.className = 'pay-item';
                payItem.innerHTML = `
                    <div class="animal-icon">${animal.name}</div>
                    <div style="font-size: 0.8em;">x5: ${animal.pay5}</div>
                    <div style="font-size: 0.8em;">x4: ${animal.pay4}</div>
                    <div style="font-size: 0.8em;">x3: ${animal.pay3}</div>
                `;
                paytable.appendChild(payItem);
            });
        }

        // Load leaderboard dari localStorage
        function loadLeaderboard() {
            const saved = localStorage.getItem('forestLeaderboard');
            return saved ? JSON.parse(saved) : [];
        }

        // Save leaderboard ke localStorage
        function saveLeaderboard(data) {
            localStorage.setItem('forestLeaderboard', JSON.stringify(data));
        }

        // Display leaderboard
        function displayLeaderboard() {
            const leaderboard = loadLeaderboard();
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';
            
            if (leaderboard.length === 0) {
                listEl.innerHTML = '<p style="text-align: center;">Belum ada pemain. Jadilah yang pertama!</p>';
                return;
            }

            leaderboard.slice(0, 10).forEach((player, index) => {
                const item = document.createElement('div');
                item.className = `leaderboard-item rank-${index + 1}`;
                item.innerHTML = `
                    <span class="leaderboard-name">${index + 1}. ${player.name}</span>
                    <span class="leaderboard-score">💰 ${player.score}</span>
                `;
                listEl.appendChild(item);
            });
        }

        // Save skor pemain
        function saveScore() {
            const nameInput = document.getElementById('playerName');
            const playerName = nameInput.value.trim();
            
            if (!playerName) {
                alert('Mohon masukkan nama Anda!');
                return;
            }

            const leaderboard = loadLeaderboard();
            
            // Tambah skor baru
            leaderboard.push({
                name: playerName,
                score: balance,
                timestamp: Date.now()
            });

            // Sort berdasarkan skor tertinggi
            leaderboard.sort((a, b) => b.score - a.score);

            // Ambil top 10 saja
            const top10 = leaderboard.slice(0, 10);

            // Simpan
            saveLeaderboard(top10);
            displayLeaderboard();
            
            // Reset input
            nameInput.value = '';
            alert('Skor Anda berhasil disimpan! 🎉');
        }

        // Ubah taruhan
        function changeBet(delta) {
            const newBet = Math.max(10, Math.min(1000, currentBet + delta));
            currentBet = newBet;
            document.getElementById('bet').textContent = currentBet;
        }

        // Auto spin toggle
        function toggleAutoSpin() {
            isAutoSpin = !isAutoSpin;
            const autoBtn = document.getElementById('autoBtn');
            autoBtn.style.background = isAutoSpin ? 'linear-gradient(145deg, #ff4444, #cc0000)' : 'linear-gradient(145deg, #4a9d4a, #2d7a2d)';
            
            if (isAutoSpin) {
                autoBtn.textContent = '⏹ Stop';
                startAutoSpin();
            } else {
                autoBtn.textContent = '🔄 Auto';
                stopAutoSpin();
            }
        }

        function startAutoSpin() {
            if (balance < currentBet) {
                alert('Saldo tidak cukup untuk autospin!');
                toggleAutoSpin();
                return;
            }
            spin();
            autoSpinInterval = setInterval(() => {
                if (!isAutoSpin || balance < currentBet) {
                    toggleAutoSpin();
                    return;
                }
                spin();
            }, 2000);
        }

        function stopAutoSpin() {
            if (autoSpinInterval) {
                clearInterval(autoSpinInterval);
                autoSpinInterval = null;
            }
        }

        // Fungsi spin
        function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                document.getElementById('result').innerHTML = '❌ Saldo tidak cukup!';
                return;
            }

            isSpinning = true;
            balance -= currentBet;
            document.getElementById('balance').textContent = balance;
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            // Play sound
            playSpinSound();

            // Animasi semua gulungan
            const reels = document.querySelectorAll('.reel');
            const intervals = [];

            // Reset hasil
            document.getElementById('result').className = 'result-display';

            reels.forEach((reel, index) => {
                reel.classList.add('spinning');
                reel.classList.remove('win', 'dragon-win');

                // Interval untuk mengganti simbol acak
                const interval = setInterval(() => {
                    const randomAnimal = animals[Math.floor(Math.random() * animals.length)];
                    reel.innerHTML = randomAnimal.icon;
                }, 80);

                intervals.push(interval);

                // Setelah animasi selesai, set hasil akhir
                setTimeout(() => {
                    clearInterval(interval);
                    reel.classList.remove('spinning');

                    // Generate hasil akhir untuk reel ini
                    const finalAnimal = animals[Math.floor(Math.random() * animals.length)];
                    reel.innerHTML = finalAnimal.icon;
                    reel.dataset.animal = finalAnimal.name;

                    // Jika ini gulungan terakhir, cek hasil
                    if (index === reels.length - 1) {
                        checkWin();
                    }
                }, 800 + (index * 100));
            });

            setTimeout(() => {
                spinBtn.disabled = false;
                isSpinning = false;
            }, 800 + (reels.length * 100));
        }

        // Cek kemenangan
        function checkWin() {
            const resultDiv = document.getElementById('result');
            const reels = document.querySelectorAll('.reel');
            
            // Hitung semua hewan
            const counts = {};
            reels.forEach(reel => {
                const animal = reel.dataset.animal;
                counts[animal] = (counts[animal] || 0) + 1;
            });

            let totalWin = 0;
            let winMessages = [];
            let isJackpot = false;

            // Cek setiap hewan
            Object.keys(counts).forEach(animalName => {
                const count = counts[animalName];
                const animalData = animals.find(a => a.name === animalName);

                if (count >= 5 && animalData.pay5 > 0) {
                    totalWin += animalData.pay5;
                    winMessages.push(`${animalName} x${count} = ${animalData.pay5}`);
                    
                    // Highlight reel dengan hewan ini
                    reels.forEach((reel, index) => {
                        if (reel.dataset.animal === animalName) {
                            if (animalName === 'Naga') {
                                reel.classList.add('dragon-win');
                                isJackpot = true;
                            } else {
                                reel.classList.add('win');
                            }
                        }
                    });
                } else if (count === 4 && animalData.pay4 > 0) {
                    totalWin += animalData.pay4;
                    winMessages.push(`${animalName} x4 = ${animalData.pay4}`);
                    
                    reels.forEach((reel) => {
                        if (reel.dataset.animal === animalName) {
                            reel.classList.add('win');
                        }
                    });
                } else if (count === 3 && animalData.pay3 > 0) {
                    totalWin += animalData.pay3;
                    winMessages.push(`${animalName} x3 = ${animalData.pay3}`);
                    
                    reels.forEach((reel) => {
                        if (reel.dataset.animal === animalName) {
                            reel.classList.add('win');
                        }
                    });
                }
            });

            if (totalWin > 0) {
                balance += totalWin;
                document.getElementById('balance').textContent = balance;
                
                gameResult = {
                    totalWin: totalWin,
                    isJackpot: isJackpot,
                    timestamp: Date.now()
                };

                // Cek apakah Naga menang
                if (isJackpot) {
                    resultDiv.innerHTML = `🐉🎉 JACKPOT NAGA! Menang ${totalWin}!`;
                    resultDiv.className = 'result-display jackpot';
                    playJackpotSound();
                    generateGoldParticles();
                } else {
                    resultDiv.innerHTML = `🎉 Menang ${totalWin}!<br><small>${winMessages.join(' | ')}</small>`;
                    resultDiv.className = 'result-display win';
                    playWinSound();
                }
            } else {
                resultDiv.innerHTML = "Belum beruntung, coba lagi!";
                resultDiv.className = 'result-display lose';
                playLoseSound();
            }
        }

        // Inisialisasi
        function init() {
            // Init audio pada interaksi pertama
            document.addEventListener('click', function initAudioOnce() {
                initAudio();
                playBirdSound();
                document.removeEventListener('click', initAudioOnce);
            });

            generateReels();
            generatePaytable();
            displayLeaderboard();
            
            // Suara burung berkala
            setInterval(playBirdSound, 5000);
        }

        // Jalankan inisialisasi
        init();
    </script>
