<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Hutan Rimba - Slot Horizontal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: 
                radial-gradient(ellipse at bottom, rgba(40, 80, 50, 0.8), transparent),
                linear-gradient(180deg, #0a1f14 0%, #143a20 50%, #1a4527 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* Background Hutan */
        .forest-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 120px;
            height: 200px;
            background: linear-gradient(180deg, #2d5a27, #1a3d15);
            border-radius: 10px 10px 0 0;
            animation: sway 5s ease-in-out infinite;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -20px;
            width: 160px;
            height: 80px;
            background: linear-gradient(135deg, #3a7d30, #2d5a27);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .tree:nth-child(1) { left: 10px; }
        .tree:nth-child(2) { left: 15%; height: 240px; animation-delay: 1s; }
        .tree:nth-child(3) { right: 10%; height: 180px; animation-delay: 2s; }
        .tree:nth-child(4) { right: 20px; height: 260px; animation-delay: 3s; }
        .tree:nth-child(5) { left: 40%; height: 220px; animation-delay: 4s; }
        .tree:nth-child(6) { right: 40%; height: 200px; animation-delay: 5s; }

        .fireflies {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffe066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066;
            animation: fly 8s infinite;
        }

        .fireflies:nth-child(7) { top: 30%; left: 20%; animation-delay: 0s; }
        .fireflies:nth-child(8) { top: 50%; left: 80%; animation-delay: 2s; }
        .fireflies:nth-child(9) { top: 70%; left: 50%; animation-delay: 4s; }
        .fireflies:nth-child(10) { top: 40%; left: 70%; animation-delay: 6s; }
        .fireflies:nth-child(11) { top: 60%; left: 30%; animation-delay: 1s; }
        .fireflies:nth-child(12) { top: 20%; left: 60%; animation-delay: 3s; }
        .fireflies:nth-child(13) { top: 80%; left: 90%; animation-delay: 5s; }
        .fireflies:nth-child(14) { top: 45%; left: 10%; animation-delay: 7s; }

        .moon {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f, 0 0 80px rgba(241,196,15,0.3);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            25% { transform: translate(15px, -20px); opacity: 1; }
            50% { transform: translate(-10px, -35px); opacity: 0.6; }
            75% { transform: translate(20px, -15px); opacity: 0.8; }
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 40px #f1c40f; }
            to { box-shadow: 0 0 60px #f1c40f, 0 0 100px rgba(241,196,15,0.5); }
        }

        /* Container Utama */
        .game-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            position: relative;
            z-index: 10;
        }

        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
            border-radius: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '🐉';
            position: absolute;
            left: 20px;
            font-size: 40px;
            animation: floatDragon 3s ease-in-out infinite;
        }

        .game-header::after {
            content: '🐉';
            position: absolute;
            right: 20px;
            font-size: 40px;
            animation: floatDragon 3s ease-in-out infinite reverse;
        }

        @keyframes floatDragon {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .game-header h1 {
            font-size: 2.5em;
            color: #3d1e00;
            font-family: 'Papyrus', 'Georgia', serif;
            letter-spacing: 3px;
        }

        /* Grid Horizontal (4 baris x 3 kolom) */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 30px;
            background: radial-gradient(ellipse at center, #3d5a3d, #1a2a1a);
            border-radius: 20px;
            border: 3px solid #8b6914;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .slot-grid::before {
            content: '🎰';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 35px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255,215,0,0.5);
            z-index: 2;
        }

        /* Reel dengan animasi horizontal */
        .reel {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 
                inset 0 4px 15px rgba(0,0,0,0.6),
                0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            overflow: hidden;
            min-height: 120px;
            cursor: pointer;
        }

        .reel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, transparent);
            opacity: 0.5;
        }

        .reel svg {
            width: 60%;
            height: 60%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .reel:hover svg {
            transform: scale(1.1);
        }

        /* Animasi putaran horizontal */
        .reel.spinning-horizontal {
            animation: spinHorizontal 1.2s ease-in-out;
        }

        @keyframes spinHorizontal {
            0% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-40px) rotate(360deg); }
            40% { transform: translateX(40px) rotate(720deg); }
            60% { transform: translateX(-30px) rotate(1080deg); }
            80% { transform: translateX(30px) rotate(1440deg); }
            100% { transform: translateX(0) rotate(1800deg); }
        }

        /* Animasi blur saat berputar */
        .reel.spinning-horizontal::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: blurPass 0.3s infinite;
        }

        @keyframes blurPass {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .reel.win {
            border: 3px solid #00ff88;
            box-shadow: 0 0 30px #00ff88, inset 0 0 20px rgba(0,255,136,0.3);
            animation: winPulse 1s infinite;
        }

        .reel.dragon-win {
            border: 3px solid #ff4444;
            box-shadow: 0 0 40px #ff4444, inset 0 0 30px rgba(255,68,68,0.4);
            animation: dragonPulse 0.5s infinite;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes dragonPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px #ff4444; }
            50% { transform: scale(1.1); box-shadow: 0 0 50px #ff6666; }
        }

        /* Panel Kontrol */
        .control-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 15px;
            border: 2px solid #8b6914;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-box {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            min-width: 120px;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            background: rgba(255,255,255,0.2);
        }

        .stat-box label {
            display: block;
            font-size: 0.9em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .stat-box span {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        .spin-btn {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
            position: relative;
            overflow: hidden;
        }

        .spin-btn::before {
            content: '🎰';
            margin-right: 8px;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .auto-btn {
            background: linear-gradient(145deg, #4a9d4a, #2d7a2d);
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 15px rgba(74,157,74,0.4);
            transition: all 0.3s ease;
            color: #fff;
        }

        .auto-btn:hover {
            transform: translateY(-2px);
        }

        .bet-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .bet-btn {
            background: #8b6914;
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .bet-btn:hover {
            background: #a07818;
        }

        /* Hasil */
        .result-display {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            font-size: 1.2em;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .result-display.win {
            background: rgba(0,255,136,0.2);
            border: 2px solid #00ff88;
        }

        .result-display.lose {
            background: rgba(255,102,102,0.2);
            border: 2px solid #ff6666;
        }

        .result-display.jackpot {
            background: rgba(255,68,68,0.3);
            border: 3px solid #ff4444;
            animation: jackpotGlow 0.5s infinite;
        }

        @keyframes jackpotGlow {
            0%, 100% { box-shadow: 0 0 20px #ff4444; }
            50% { box-shadow: 0 0 40px #ff6666; }
        }

        /* Paytable */
        .paytable {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
        }

        .paytable h3 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .pay-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .pay-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .pay-item .animal-icon {
            font-size: 1.2em;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Leaderboard */
        .leaderboard {
            margin-top: 20px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #8b6914;
        }

        .leaderboard h3 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.15);
        }

        .leaderboard-item.rank-1 {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #3d1e00;
            font-weight: bold;
        }

        .leaderboard-item.rank-2 {
            background: linear-gradient(145deg, #c0c0c0, #a8a8a8);
            color: #333;
        }

        .leaderboard-item.rank-3 {
            background: linear-gradient(145deg, #cd7f32, #b8860b);
            color: #333;
        }

        .leaderboard-name {
            font-weight: bold;
        }

        .leaderboard-score {
            font-size: 1.2em;
            font-weight: bold;
        }

        .name-input {
            padding: 8px;
            border-radius: 5px;
            border: 2px solid #8b6914;
            background: #1a1208;
            color: #fff;
            font-size: 1em;
            margin-right: 10px;
            width: 150px;
        }

        .save-btn {
            background: #ffd700;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #3d1e00;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: #ffaa00;
        }

        /* Probabilitas */
        .probability-display {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .probability-display h4 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .prob-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
        }

        .prob-bar {
            flex: 1;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        /* Sound Toggle */
        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        /* Partikel */
        .gold-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #ffd700, #ffaa00);
            border-radius: 50%;
            animation: particleFall 3s ease-in-out infinite;
        }

        @keyframes particleFall {
            0% { transform: translateY(-100px) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        }

        /* Responsif */
        @media (max-width: 768px) {
            .game-container {
                margin: 10px;
                padding: 10px;
            }

            .game-header h1 {
                font-size: 1.5em;
            }

            .slot-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .reel {
                min-height: 80px;
            }

            .control-panel {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="forest-bg">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="moon"></div>
    </div>

    <!-- Partikel -->
    <div class="gold-particles" id="goldParticles"></div>

    <!-- Sound Toggle -->
    <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">🔊</button>

    <!-- Game Container -->
    <div class="game-container">
        <div class="game-header">
            <h1>🐉 HUTAN RIMBA HORIZONTAL 🐉</h1>
            <p>12 Gulungan Putaran Horizontal</p>
        </div>

        <!-- Grid 12 Gulungan (4 baris x 3 kolom) -->
        <div class="slot-grid" id="slotGrid">
            <!-- Gulungan akan digenerate oleh JS -->
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="stat-box">
                <label>💰 Saldo</label>
                <span id="balance">5000</span>
            </div>
            <div class="stat-box">
                <label>🎲 Taruhan</label>
                <div class="bet-controls">
                    <button class="bet-btn" onclick="changeBet(-10)">-</button>
                    <span id="bet">100</span>
                    <button class="bet-btn" onclick="changeBet(10)">+</button>
                </div>
            </div>
            <div class="stat-box">
                <label>🏆 Jackpot</label>
                <span id="jackpot">50000</span>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN!</button>
            <button class="auto-btn" id="autoBtn" onclick="toggleAutoSpin()">🔄 Auto</button>
        </div>

        <!-- Hasil -->
        <div class="result-display" id="result">
            Selamat datang di Hutan Rimba! Klik SPIN untuk mulai!
        </div>

        <!-- Leaderboard -->
        <div style="text-align: center; margin: 10px 0;">
            <input type="text" class="name-input" id="playerName" placeholder="Masukkan nama Anda" maxlength="20">
            <button class="save-btn" onclick="saveScore()">💾 Simpan Skor</button>
        </div>

        <div class="leaderboard">
            <h3>🏆 Leaderboard Pemain</h3>
            <div class="leaderboard-list" id="leaderboardList"></div>
        </div>

        <!-- Probabilitas -->
        <div class="probability-display">
            <h4>📊 Peluang Menang</h4>
            <div class="prob-row">
                <span>🎯 Kecil (3 simbol)</span>
                <div class="prob-bar">
                    <div class="prob-fill" style="width: 2%; background: #00ff88;"></div>
                </div>
                <span>1/50</span>
            </div>
            <div class="prob-row">
                <span>🎯 Sedang (4 simbol)</span>
                <div class="prob-bar">
                    <div class="prob-fill" style="width: 0.2%; background: #ffd700;"></div>
                </div>
                <span>1/500</span>
            </div>
            <div class="prob-row">
                <span>🎯 Besar (5 simbol)</span>
                <div class="prob-bar">
                    <div class="prob-fill" style="width: 0.02%; background: #ff8c00;"></div>
                </div>
                <span>1/5000</span>
            </div>
            <div class="prob-row">
                <span>🐉 Jackpot Naga</span>
                <div class="prob-bar">
                    <div class="prob-fill" style="width: 0.01%; background: #ff4444;"></div>
                </div>
                <span>1/10000</span>
            </div>
        </div>

        <!-- Paytable -->
        <div class="paytable">
            <h3>📜 Tabel Pembayaran</h3>
            <div class="paytable-grid" id="paytableGrid"></div>
        </div>
    </div>

    <script>
        // Data hewan (SVG)
        const animals = [
            { name: "Harimau", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="30" fill="#ff8c00" stroke="#d35400" stroke-width="3"/><ellipse cx="30" cy="30" rx="8" ry="6" fill="#fff"/><ellipse cx="70" cy="30" rx="8" ry="6" fill="#fff"/><circle cx="30" cy="28" r="3" fill="#000"/><circle cx="70" cy="28" r="3" fill="#000"/><circle cx="50" cy="40" r="6" fill="#ff69b4"/><path d="M20,40 L10,30 M20,42 L5,42 M80,40 L90,30 M80,42 L95,42" stroke="#000" stroke-width="3"/><path d="M20,60 Q50,80 80,60" fill="#ff8c00" stroke="#d35400" stroke-width="3"/></svg>`, pay5: 5000, pay4: 1000, pay3: 200, pay2: 50 },
            { name: "Rusa", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#8b6914" stroke="#6b4f12" stroke-width="3"/><circle cx="42" cy="45" r="4" fill="#000"/><circle cx="58" cy="45" r="4" fill="#000"/><path d="M20,40 L5,25 L15,25 L5,15" stroke="#6b4f12" stroke-width="4" fill="none"/><path d="M80,40 L95,25 L85,25 L95,15" stroke="#6b4f12" stroke-width="4" fill="none"/></svg>`, pay5: 4000, pay4: 800, pay3: 150, pay2: 30 },
            { name: "Serigala", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="28" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="3"/><path d="M25,35 L15,20 L35,30" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="2"/><path d="M75,35 L85,20 L65,30" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="2"/><circle cx="38" cy="35" r="5" fill="#f39c12"/><circle cx="38" cy="35" r="2" fill="#000"/><circle cx="62" cy="35" r="5" fill="#f39c12"/><circle cx="62" cy="35" r="2" fill="#000"/></svg>`, pay5: 3500, pay4: 700, pay3: 120, pay2: 20 },
            { name: "Elang", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="35" r="20" fill="#f39c12" stroke="#e67e22" stroke-width="3"/><path d="M25,35 Q10,20 5,40 Q20,35 30,45" fill="#e67e22" stroke="#d35400" stroke-width="2"/><path d="M75,35 Q90,20 95,40 Q80,35 70,45" fill="#e67e22" stroke="#d35400" stroke-width="2"/><circle cx="42" cy="30" r="4" fill="#000"/><circle cx="58" cy="30" r="4" fill="#000"/></svg>`, pay5: 3000, pay4: 600, pay3: 100, pay2: 15 },
            { name: "Beruang", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="45" r="30" fill="#5d4037" stroke="#3e2723" stroke-width="3"/><circle cx="35" cy="30" r="15" fill="#5d4037" stroke="#3e2723" stroke-width="2"/><circle cx="65" cy="30" r="15" fill="#5d4037" stroke="#3e2723" stroke-width="2"/><circle cx="42" cy="40" r="5" fill="#000"/><circle cx="58" cy="40" r="5" fill="#000"/></svg>`, pay5: 2500, pay4: 500, pay3: 80, pay2: 10 },
            { name: "Rubah", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="42" r="25" fill="#e67e22" stroke="#d35400" stroke-width="3"/><path d="M25,35 L12,15 L35,28" fill="#e67e22" stroke="#d35400" stroke-width="2"/><path d="M75,35 L88,15 L65,28" fill="#e67e22" stroke="#d35400" stroke-width="2"/><circle cx="42" cy="38" r="4" fill="#000"/><circle cx="58" cy="38" r="4" fill="#000"/></svg>`, pay5: 2000, pay4: 400, pay3: 60, pay2: 5 },
            { name: "Singa", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="45" r="30" fill="#f1c40f" stroke="#d4ac0d" stroke-width="3"/><path d="M20,35 L5,25 M20,45 L3,45 M20,55 L5,65" stroke="#d4ac0d" stroke-width="4" fill="none"/><path d="M80,35 L95,25 M80,45 L97,45 M80,55 L95,65" stroke="#d4ac0d" stroke-width="4" fill="none"/><circle cx="42" cy="40" r="5" fill="#000"/><circle cx="58" cy="40" r="5" fill="#000"/></svg>`, pay5: 1500, pay4: 300, pay3: 40, pay2: 0 },
            { name: "Kelinci", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3"/><ellipse cx="40" cy="25" rx="8" ry="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3"/><ellipse cx="60" cy="25" rx="8" ry="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3"/><circle cx="45" cy="52" r="4" fill="#e74c3c"/><circle cx="55" cy="52" r="4" fill="#e74c3c"/></svg>`, pay5: 1000, pay4: 200, pay3: 25, pay2: 0 },
            { name: "Landak", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3"/><path d="M20,50 L10,40 L20,45 M15,55 L5,55 M20,60 L10,70" stroke="#7f8c8d" stroke-width="4" fill="none"/><path d="M80,50 L90,40 L80,45 M85,55 L95,55 M80,60 L90,70" stroke="#7f8c8d" stroke-width="4" fill="none"/><circle cx="45" cy="52" r="3" fill="#000"/><circle cx="55" cy="52" r="3" fill="#000"/></svg>`, pay5: 800, pay4: 150, pay3: 15, pay2: 0 },
            { name: "Burung Hantu", icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="45" r="25" fill="#8e44ad" stroke="#6c3483" stroke-width="3"/><circle cx="40" cy="38" r="8" fill="#f39c12" stroke="#d4ac0d" stroke-width="2"/><circle cx="60" cy="38" r="8" fill="#f39c12" stroke="#d4ac0d" stroke-width="2"/><circle cx="40" cy="38" r="4" fill="#000"/><circle cx="60" cy="38" r="4" fill="#000"/></svg>`, pay5: 600, pay4: 100, pay3: 10, pay2: 0 },
            { name: "Ular", icon: `<svg viewBox="0 0 100 100"><path d="M20,50 Q50,20 80,50 Q95,70 80,85 Q65,95 50,80" fill="#27ae60" stroke="#1e8449" stroke-width="3"/><circle cx="20" cy="50" r="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/><circle cx="20" cy="50" r="3" fill="#000"/></svg>`, pay5: 500, pay4: 80, pay3: 5, pay2: 0 },
            { name: "Naga", icon: `<svg viewBox="0 0 100 100"><path d="M20,50 Q40,20 60,50 Q80,70 70,85" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/><path d="M15,45 L5,30 L20,35 M15,55 L5,70 L20,65" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/><circle cx="45" cy="45" r="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/><circle cx="45" cy="45" r="4" fill="#f1c40f"/><circle cx="45" cy="45" r="2" fill="#000"/></svg>`, pay5: 50000, pay4: 10000, pay3: 1000, pay2: 100 }
        ];

        // Probabilitas bertingkat
        const winConfig = {
            "Kecil (3 simbol)": { probability: 1/50, payout: "pay3" },
            "Sedang (4 simbol)": { probability: 1/500, payout: "pay4" },
            "Besar (5 simbol)": { probability: 1/5000, payout: "pay5" },
            "Jackpot Naga": { probability: 1/10000, payout: "jackpot" }
        };

        const symbolWeights = {
            "Naga": 1, "Harimau": 2, "Rusa": 3, "Serigala": 4, "Elang": 5, "Beruang": 6,
            "Rubah": 7, "Singa": 8, "Kelinci": 9, "Landak": 10, "Burung Hantu": 11, "Ular": 12
        };

        const totalWeight = Object.values(symbolWeights).reduce((a, b) => a + b, 0);

        // State
        let balance = 5000;
        let currentBet = 100;
        let isSpinning = false;
        let isAutoSpin = false;
        let autoSpinInterval = null;
        let soundEnabled = true;
        let audioCtx = null;

        // Audio
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSpinSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function playWinSound() {
            if (!soundEnabled || !audioCtx) return;
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }, i * 100);
            });
        }

        function playJackpotSound() {
            if (!soundEnabled || !audioCtx) return;
            [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }, i * 150);
            });
        }

        function playLoseSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) initAudio();
        }

        // Generate 12 gulungan horizontal (4 baris x 3 kolom)
        function generateReels() {
            const grid = document.getElementById('slotGrid');
            grid.innerHTML = '';
            
            // Layout: 4 baris x 3 kolom
            for (let i = 0; i < 12; i++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${i}`;
                reel.innerHTML = animals[Math.floor(Math.random() * animals.length)].icon;
                grid.appendChild(reel);
            }
        }

        // Fungsi pilih simbol berbobot
        function getWeightedSymbol() {
            let random = Math.random() * totalWeight;
            for (const [name, weight] of Object.entries(symbolWeights)) {
                if (random < weight) return name;
                random -= weight;
            }
            return "Ular";
        }

        // Generate hasil dengan probabilitas bertingkat
        function generateResult() {
            const MAX_RETRY = 100;
            let retries = 0;
            
            while (retries < MAX_RETRY) {
                const reels = [];
                for (let i = 0; i < 12; i++) {
                    const symbolName = getWeightedSymbol();
                    reels.push(animals.find(a => a.name === symbolName));
                }
                
                // Cek JACKPOT NAGA
                const nagaCount = reels.filter(r => r.name === 'Naga').length;
                if (nagaCount >= 5) {
                    return { reels, winLevel: "jackpot", winAmount: 50000, isJackpot: true };
                }
                
                // Hitung kombinasi
                const counts = {};
                reels.forEach(r => counts[r.name] = (counts[r.name] || 0) + 1);
                
                let maxCount = 0;
                let maxSymbol = "";
                Object.keys(counts).forEach(symbolName => {
                    if (counts[symbolName] > maxCount) {
                        maxCount = counts[symbolName];
                        maxSymbol = symbolName;
                    }
                });
                
                const animalData = animals.find(a => a.name === maxSymbol);
                
                // Tentukan level
                let winLevel = "none";
                let winAmount = 0;
                
                if (maxCount >= 5 && animalData) {
                    winLevel = "besar";
                    winAmount = animalData.pay5;
                } else if (maxCount === 4 && animalData) {
                    winLevel = "sedang";
                    winAmount = animalData.pay4;
                } else if (maxCount === 3 && animalData) {
                    winLevel = "kecil";
                    winAmount = animalData.pay3;
                }
                
                // Cek probabilitas
                const winProb = winLevel !== "none" ? 1/Math.pow(10, winLevel === "kecil" ? 2 : winLevel === "sedang" ? 3 : 4) : 0;
                
                // Jika peluang terlalu tinggi, regenerate
                if (winLevel !== "none" && winProb > winConfig[winLevel.charAt(0).toUpperCase() + winLevel.slice(1) + " (3 simbol)"].probability) {
                    retries++;
                    continue;
                }
                
                return { reels, winLevel, winAmount, isJackpot: false };
            }
            
            // Fallback
            const reels = [];
            for (let i = 0; i < 12; i++) {
                const symbolName = getWeightedSymbol();
                reels.push(animals.find(a => a.name === symbolName));
            }
            return { reels, winLevel: "none", winAmount: 0, isJackpot: false };
        }

        // Ubah taruhan
        function changeBet(delta) {
            currentBet = Math.max(10, Math.min(1000, currentBet + delta));
            document.getElementById('bet').textContent = currentBet;
        }

        // Auto spin
        function toggleAutoSpin() {
            isAutoSpin = !isAutoSpin;
            const btn = document.getElementById('autoBtn');
            btn.style.background = isAutoSpin ? 'linear-gradient(145deg, #ff4444, #cc0000)' : 'linear-gradient(145deg, #4a9d4a, #2d7a2d)';
            btn.textContent = isAutoSpin ? '⏹ Stop' : '🔄 Auto';
            
            if (isAutoSpin) {
                startAutoSpin();
            } else {
                stopAutoSpin();
            }
        }

        function startAutoSpin() {
            if (balance < currentBet) {
                alert('Saldo tidak cukup!');
                toggleAutoSpin();
                return;
            }
            spin();
            autoSpinInterval = setInterval(() => {
                if (!isAutoSpin || balance < currentBet) {
                    toggleAutoSpin();
                    return;
                }
                spin();
            }, 3000);
        }

        function stopAutoSpin() {
            if (autoSpinInterval) {
                clearInterval(autoSpinInterval);
                autoSpinInterval = null;
            }
        }

        // Fungsi spin utama
        function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                document.getElementById('result').innerHTML = '❌ Saldo tidak cukup!';
                return;
            }

            isSpinning = true;
            balance -= currentBet;
            document.getElementById('balance').textContent = balance;
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            // Generate hasil
            const result = generateResult();
            
            // Play sound
            playSpinSound();

            // Animasi horizontal
            const reels = document.querySelectorAll('.reel');
            reels.forEach(reel => {
                reel.classList.remove('win', 'dragon-win', 'spinning-horizontal');
            });

            // Animasi berputar horizontal dengan hasil akhir
            reels.forEach((reel, index) => {
                reel.classList.add('spinning-horizontal');
                
                // Animasi acak
                const interval = setInterval(() => {
                    const randomSymbol = animals[Math.floor(Math.random() * animals.length)];
                    reel.innerHTML = randomSymbol.icon;
                }, 60);

                // Setelah animasi, set hasil final
                setTimeout(() => {
                    clearInterval(interval);
                    reel.classList.remove('spinning-horizontal');
                    
                    reel.innerHTML = result.reels[index].icon;
                    reel.dataset.animal = result.reels[index].name;
                    
                    // Highlight jika menang
                    if (result.winLevel !== "none") {
                        const counts = {};
                        result.reels.forEach(r => counts[r.name] = (counts[r.name] || 0) + 1);
                        const winningSymbol = result.reels[index].name;
                        
                        if (counts[winningSymbol] >= 3) {
                            if (winningSymbol === 'Naga') {
                                reel.classList.add('dragon-win');
                            } else {
                                reel.classList.add('win');
                            }
                        }
                    }
                    
                    // Cek hasil setelah semua berhenti
                    if (index === reels.length - 1) {
                        checkWin(result);
                        spinBtn.disabled = false;
                        isSpinning = false;
                    }
                }, 800 + (index * 150));
            });
        }

        // Cek kemenangan
        function checkWin(result) {
            const resultDiv = document.getElementById('result');
            
            if (result.winAmount > 0) {
                balance += result.winAmount;
                document.getElementById('balance').textContent = balance;
                
                let message = "";
                switch(result.winLevel) {
                    case "jackpot":
                        message = `🐉🎉 JACKPOT NAGA! Menang ${result.winAmount}!`;
                        resultDiv.className = 'result-display jackpot';
                        playJackpotSound();
                        generateGoldParticles();
                        break;
                    case "besar":
                        message = `🌟 Kemenangan Besar! Menang ${result.winAmount}!`;
                        resultDiv.className = 'result-display win';
                        playWinSound();
                        break;
                    case "sedang":
                        message = `✨ Kemenangan Sedang! Menang ${result.winAmount}!`;
                        resultDiv.className = 'result-display win';
                        playWinSound();
                        break;
                    case "kecil":
                        message = `🎉 Kemenangan Kecil! Menang ${result.winAmount}!`;
                        resultDiv.className = 'result-display win';
                        playWinSound();
                        break;
                    default:
                        message = `🎉 Menang ${result.winAmount}!`;
                        resultDiv.className = 'result-display win';
                        playWinSound();
                }
                resultDiv.innerHTML = message;
            } else {
                resultDiv.innerHTML = "Belum beruntung, coba lagi!";
                resultDiv.className = 'result-display lose';
                playLoseSound();
            }
        }

        // Generate partikel emas
        function generateGoldParticles() {
            const container = document.getElementById('goldParticles');
            container.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 15 + 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (Math.random() * 2 + 1) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }

        // Leaderboard
        function loadLeaderboard() {
            const saved = localStorage.getItem('forestLeaderboard');
            return saved ? JSON.parse(saved) : [];
        }

        function saveLeaderboard(data) {
            localStorage.setItem('forestLeaderboard', JSON.stringify(data));
        }

        function displayLeaderboard() {
            const leaderboard = loadLeaderboard();
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';
            
            if (leaderboard.length === 0) {
                listEl.innerHTML = '<p style="text-align: center;">Belum ada pemain. Jadilah yang pertama!</p>';
                return;
            }

            leaderboard.slice(0, 10).forEach((player, index) => {
                const item = document.createElement('div');
                item.className = `leaderboard-item rank-${index + 1}`;
                item.innerHTML = `
                    <span class="leaderboard-name">${index + 1}. ${player.name}</span>
                    <span class="leaderboard-score">💰 ${player.score}</span>
                `;
                listEl.appendChild(item);
            });
        }

        function saveScore() {
            const nameInput = document.getElementById('playerName');
            const playerName = nameInput.value.trim();
            
            if (!playerName) {
                alert('Mohon masukkan nama Anda!');
                return;
            }

            const leaderboard = loadLeaderboard();
            leaderboard.push({
                name: playerName,
                score: balance,
                timestamp: Date.now()
            });

            leaderboard.sort((a, b) => b.score - a.score);
            const top10 = leaderboard.slice(0, 10);

            saveLeaderboard(top10);
            displayLeaderboard();
            
            nameInput.value = '';
            alert('Skor Anda berhasil disimpan! 🎉');
        }

        // Paytable
        function generatePaytable() {
            const paytable = document.getElementById('paytableGrid');
            paytable.innerHTML = '';
            
            animals.forEach(animal => {
                const payItem = document.createElement('div');
                payItem.className = 'pay-item';
                payItem.innerHTML = `
                    <div class="animal-icon">${animal.name}</div>
                    <div style="font-size: 0.8em;">x5: ${animal.pay5}</div>
                    <div style="font-size: 0.8em;">x4: ${animal.pay4}</div>
                    <div style="font-size: 0.8em;">x3: ${animal.pay3}</div>
                `;
                paytable.appendChild(payItem);
            });
        }

        // Inisialisasi
        function init() {
            document.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.removeEventListener('click', initAudioOnce);
            });

            generateReels();
            generatePaytable();
            displayLeaderboard();
        }

        init();
    </script>
</body>
</html>
