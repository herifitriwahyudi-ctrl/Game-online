<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>🐉 Dragons Hunter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: url('background-dragon.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #0a1f14;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 31, 20, 0.6);
            z-index: -1;
            pointer-events: none;
        }

        /* Background Hutan */
        .forest-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 120px; height: 200px;
            background: linear-gradient(180deg, #2d5a27, #1a3d15);
            border-radius: 10px 10px 0 0;
            animation: sway 5s ease-in-out infinite;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: -40px; left: -20px;
            width: 160px; height: 80px;
            background: linear-gradient(135deg, #3a7d30, #2d5a27);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .tree:nth-child(1) { left: 10px; }
        .tree:nth-child(2) { left: 15%; height: 240px; animation-delay: 1s; }
        .tree:nth-child(3) { right: 10%; height: 180px; animation-delay: 2s; }
        .tree:nth-child(4) { right: 20px; height: 260px; animation-delay: 3s; }
        .tree:nth-child(5) { left: 40%; height: 220px; animation-delay: 4s; }
        .tree:nth-child(6) { right: 40%; height: 200px; animation-delay: 5s; }

        .fireflies {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffe066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066;
            animation: fly 8s infinite;
        }

        .fireflies:nth-child(7) { top: 30%; left: 20%; animation-delay: 0s; }
        .fireflies:nth-child(8) { top: 50%; left: 80%; animation-delay: 2s; }
        .fireflies:nth-child(9) { top: 70%; left: 50%; animation-delay: 4s; }
        .fireflies:nth-child(10) { top: 40%; left: 70%; animation-delay: 6s; }
        .fireflies:nth-child(11) { top: 60%; left: 30%; animation-delay: 1s; }
        .fireflies:nth-child(12) { top: 20%; left: 60%; animation-delay: 3s; }
        .fireflies:nth-child(13) { top: 80%; left: 90%; animation-delay: 5s; }
        .fireflies:nth-child(14) { top: 45%; left: 10%; animation-delay: 7s; }

        .moon {
            position: absolute;
            top: 50px; right: 100px;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f, 0 0 80px rgba(241,196,15,0.3);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            25% { transform: translate(15px, -20px); opacity: 1; }
            50% { transform: translate(-10px, -35px); opacity: 0.6; }
            75% { transform: translate(20px, -15px); opacity: 0.8; }
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 40px #f1c40f; }
            to { box-shadow: 0 0 60px #f1c40f, 0 0 100px rgba(241,196,15,0.5); }
        }

        /* Container Utama */
        .game-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            position: relative;
            z-index: 10;
        }

        /* Banner */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 0;
            background: transparent;
            border-radius: 0;
            margin-left: -20px;
            margin-right: -20px;
        }

        .game-header img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            border-radius: 26px 26px 0 0;
            border-bottom: 4px solid #8b6914;
            display: block;
            margin: 0 auto;
        }

        /* Info Panel */
        .info-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 15px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 50px;
            border: 2px solid #8b6914;
            margin: 10px auto 20px;
            max-width: 550px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-box {
            text-align: center;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-box label {
            font-size: 0.85em;
            color: #ffd700;
            margin-bottom: 0;
        }

        .info-box span {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        /* Tombol Top Up */
        .topup-btn {
            background: linear-gradient(145deg, #00ff88, #00cc66);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,255,136,0.4);
            transition: all 0.3s ease;
            color: #1a1a1a;
        }

        .topup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,136,0.6);
        }

        /* Tombol Penarikan */
        .withdraw-btn {
            background: linear-gradient(145deg, #00bfff, #0080ff);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,191,255,0.4);
            transition: all 0.3s ease;
            color: #fff;
        }

        .withdraw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,191,255,0.6);
        }

        /* Tombol Buat Akun */
        .register-btn {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,215,0,0.6);
        }

        /* Tombol Logout */
        .logout-btn {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255,68,68,0.4);
            transition: all 0.3s ease;
            color: #fff;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,68,68,0.6);
        }

        /* Papan Roll - KARTU HEWAN YANG SUDAH MUNCUL */
        .roll-section {
            margin-bottom: 20px;
        }

        .roll-section h3 {
            display: none;
        }

        .roll-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            border: 3px solid #8b6914;
        }

        .roll-item {
            aspect-ratio: 1;
            border-radius: 10px;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border: 2px solid #8b6914;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .roll-item img,
        .roll-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .roll-item.win {
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }

        .roll-item.lose {
            border-color: #ff4444;
            box-shadow: 0 0 15px #ff4444;
        }

        .roll-item.hidden-item {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            color: #ffd700;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roll-item.new-item {
            animation: slideInFromLeft 0.5s ease;
        }

        @keyframes slideInFromLeft {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .roll-item.removed-item {
            animation: slideOutToRight 0.5s ease;
        }

        @keyframes slideOutToRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(50px); opacity: 0; }
        }

        /* Kartu Utama */
        .main-card-area {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .main-card {
            width: 200px;
            height: 260px;
            margin: 0 auto;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border-radius: 20px;
            border: 4px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .main-card.hidden-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            cursor: pointer;
        }

        .main-card.hidden-card::after {
            content: '?';
            font-size: 80px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            animation: pulseQuestion 1s infinite alternate;
        }

        @keyframes pulseQuestion {
            from { transform: scale(0.9); opacity: 0.7; }
            to { transform: scale(1.1); opacity: 1; }
        }

        .main-card.shuffling {
            animation: cardShuffle 0.8s ease-in-out;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        }

        .main-card.shuffling::after {
            content: '🔄';
            font-size: 60px;
            animation: spinIcon 0.8s linear infinite;
        }

        @keyframes cardShuffle {
            0% { transform: scale(1) rotateY(0deg); opacity: 1; }
            25% { transform: scale(0.8) rotateY(90deg); opacity: 0.5; }
            50% { transform: scale(0.6) rotateY(180deg); opacity: 0.3; }
            75% { transform: scale(0.8) rotateY(270deg); opacity: 0.5; }
            100% { transform: scale(1) rotateY(360deg); opacity: 1; }
        }

        @keyframes spinIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-card.revealing {
            animation: cardReveal 0.5s ease-out;
        }

        @keyframes cardReveal {
            0% { transform: scale(0.5) rotateY(180deg); opacity: 0; }
            50% { transform: scale(1.2) rotateY(90deg); opacity: 0.7; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        .main-card.win {
            border-color: #00ff88;
            box-shadow: 0 0 30px #00ff88, 0 0 60px rgba(0,255,136,0.5);
            animation: winGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes winGlow {
            from { box-shadow: 0 0 30px #00ff88, 0 0 60px rgba(0,255,136,0.3); }
            to { box-shadow: 0 0 50px #00ff88, 0 0 100px rgba(0,255,136,0.7), 0 0 150px rgba(0,255,136,0.3); }
        }

        .main-card.lose {
            border-color: #ff4444;
            box-shadow: 0 0 20px #ff4444, 0 0 40px rgba(255,68,68,0.3);
            animation: losePulse 1s ease-in-out infinite alternate;
        }

        @keyframes losePulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.95); opacity: 0.8; }
        }

        .main-card.revealed-card img,
        .main-card.revealed-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .result-message {
            min-height: 50px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .result-message.win {
            color: #00ff88;
            font-size: 1.4em;
            text-shadow: 0 0 15px rgba(0,255,136,0.6);
            animation: blinkEffect 0.8s infinite;
        }

        .result-message.lose {
            color: #ff6666;
            font-size: 1.2em;
        }

        @keyframes blinkEffect {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Count Up Animation */
        .count-up {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            animation: countUpPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes countUpPulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.1); opacity: 0.9; }
        }

        .win-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0,255,136,0.8);
            margin-bottom: 10px;
            animation: titlePulse 0.5s ease-in-out infinite alternate;
        }

        .win-title.big-win {
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0,255,136,1);
        }

        .win-title.super-win {
            color: #00bfff;
            text-shadow: 0 0 30px rgba(0,191,255,1);
        }

        .win-title.epic-win {
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,1);
        }

        .win-title.ultimate-win {
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255,68,68,1);
            animation: ultimatePulse 0.3s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @keyframes ultimatePulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* Tombol Buka Kartu di bawah kartu utama */
        .open-card-btn {
            display: block;
            margin: 20px auto 0;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 12px 50px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
            text-align: center;
        }

        .open-card-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.6);
        }

        .open-card-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Form Taruhan */
        .bet-form {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .bet-form h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .bet-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: start;
        }

        .bet-column {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
        }

        .bet-column h4 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .form-row label {
            font-size: 0.85em;
            color: #ffd700;
            min-width: 60px;
        }

        .form-row select {
            flex: 1;
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-size: 0.9em;
        }

        .form-row select:focus {
            outline: none;
            border-color: #ffd700;
        }

        .form-row select option {
            background: #1a1208;
            color: #fff;
        }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        .bet-btn {
            width: auto;
            min-width: 45px;
            height: 32px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 8px;
            color: #3d1e00;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 10px;
        }

        .bet-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(255,215,0,0.5);
        }

        .bet-btn-large {
            width: auto;
            min-width: 70px;
            height: 32px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 8px;
            color: #3d1e00;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 10px;
        }

        .bet-btn-large:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(255,215,0,0.5);
        }

        .bet-input {
            width: 90px;
            text-align: center;
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 8px;
            padding: 6px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
        }

        .bet-input:focus {
            outline: none;
            border-color: #ffd700;
        }

        .quick-bet-container {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-bet-btn {
            flex: 1;
            padding: 5px;
            background: #8b6914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .quick-bet-btn:hover {
            background: #ffd700;
            color: #3d1e00;
        }

        .max-bet-btn {
            width: 100%;
            margin-top: 5px;
            padding: 5px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .max-bet-btn:hover {
            background: #ff6666;
        }

        /* Fireworks */
        .fireworks-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explosion 1.5s ease-out forwards;
        }

        @keyframes explosion {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        /* Modal Top Up */
        .topup-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .topup-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .topup-content {
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 20px;
            border: 3px solid #8b6914;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .topup-content h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .topup-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .topup-option {
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .topup-option:hover {
            border-color: #ffd700;
            background: rgba(255,215,0,0.1);
        }

        .topup-option.selected {
            border-color: #00ff88;
            background: rgba(0,255,136,0.1);
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .topup-option .amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .topup-option .bonus {
            font-size: 0.8em;
            color: #ffd700;
        }

        .custom-amount {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .custom-amount input {
            flex: 1;
            background: #1a1208;
            border: 2px solid #8b6914;

        .win-details {

        @media (max-width: 768px) {

                    <div class="amount">Rp 200.000</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // ========== DATA HEWAN ==========
        const normalAnimals = [
            { name: "Rubah", icon: "rubah.png" },
            { name: "Serigala", icon: "serigala.png" },
            { name: "Panda", icon: "panda.png" },
            { name: "Beruang", icon: "beruang.png" },
            { name: "Gajah", icon: "gajah.png" },
            { name: "Singa", icon: "singa.png" },
            { name: "Rusa", icon: "rusa.png" },
            { name: "Kucing", icon: "kucing.png" },
            { name: "Burung", icon: "burung.png" },
            { name: "Kelinci", icon: "kelinci.png" }
        ];

        const bonusAnimals = [
            { name: "Naga", icon: "naga.mp4", type: "Naga", multiplier: 100 },
            { name: "Harimau", icon: "harimau.mp4", type: "Harimau", multiplier: 50 }
        ];

        const allAnimals = [...normalAnimals, ...bonusAnimals];

        // ========== STATE GAME ==========
        let balance = 0;
        let history = [];
        let selectedTopUp = 0;
        let selectedWithdraw = 0;
        let soundEnabled = true;
        let audioCtx = null;
        let isAnimating = false;
        let currentUserId = null;
        let currentUserData = null;
        let isTopUpProcessing = false;
        let isWithdrawProcessing = false;
        let rtpConfig = {
            global: 50,
            hewan: 50,
            naga: 50,
            harimau: 50,
            mode: 'normal',
            maxWin: 500000
        };

        // ========== RTP CONFIG - REALTIME LISTENER ==========
        async function loadRTP() {
            try {
                const snapshot = await db.ref('config/rtp').once('value');
                if (snapshot.exists()) {
                    rtpConfig = snapshot.val();
                    console.log('RTP Config loaded:', rtpConfig);
                } else {
                    // Setup default jika belum ada
                    await db.ref('config/rtp').set({
                        global: 50,
                        hewan: 50,
                        naga: 50,
                        harimau: 50,
                        mode: 'normal',
                        maxWin: 500000
                    });
                    console.log('RTP Config default dibuat');
                }
            } catch (error) {
                console.error('Error loading RTP:', error);
            }
        }

        // ========== AUDIO ==========
        function initAudio() {
            if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        }

        function playCorrectSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWrongSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) initAudio();
        }

        // ========== FUNGSI LOGOUT ==========
        async function logout() {
            if (currentUserId) {
                await db.ref('users/' + currentUserId + '/online').set(false);
            }
            localStorage.removeItem('dragonsHunterSession');
            sessionStorage.removeItem('dragonsHunterSession');
            window.location.href = 'login.html';
        }

        // ========== GENERATE DROPDOWNS ==========
        function generateDropdowns() {
            const animalSelect = document.getElementById('animalSelect');
            animalSelect.innerHTML = '<option value="">-- Pilih --</option>';
            normalAnimals.forEach(animal => {
                const opt = document.createElement('option');
                opt.value = animal.name;
                opt.textContent = animal.name;
                animalSelect.appendChild(opt);
            });
        }

        // ========== FUNGSI UBAH NOMINAL ==========
        function changeAnimalBet(delta) {
            const animalBet = document.getElementById('animalBet');
            let currentValue = parseInt(animalBet.value) || 100;
            let newValue = currentValue + delta;
            
            if (newValue < 100) newValue = 100;
            if (newValue > balance) newValue = balance;
            
            animalBet.value = newValue;
        }

        function changeBonusBet(delta) {
            const bonusBet = document.getElementById('bonusBet');
            let currentValue = parseInt(bonusBet.value) || 2000;
            
            let newValue = currentValue + delta;
            
            if (newValue < 2000) newValue = 2000;
            if (newValue > balance) newValue = balance;
            
            bonusBet.value = newValue;
        }

        // ========== FUNGSI SET NOMINAL MANUAL ==========
        function setAnimalBetManual(value) {
            const animalBet = document.getElementById('animalBet');
            let newValue = parseInt(value) || 0;
            
            if (newValue < 100) newValue = 100;
            if (newValue > balance) newValue = balance;
            
            animalBet.value = newValue;
        }

        function setBonusBetManual(value) {
            const bonusBet = document.getElementById('bonusBet');
            let newValue = parseInt(value) || 0;
            
            if (newValue < 2000) newValue = 2000;
            if (newValue > balance) newValue = balance;
            
            bonusBet.value = newValue;
        }

        // ========== SIMPAN SALDO KE FIREBASE ==========
        function saveBalance() {
            if (currentUserId) {
                db.ref('users/' + currentUserId + '/balance').set(balance);
            } else {
                db.ref('saldo').set(balance);
            }
        }

        // ========== GET SESSION ==========
        async function getSession() {
            try {
                const session = sessionStorage.getItem('dragonsHunterSession');
                if (session) return JSON.parse(session);
                
                const localSession = localStorage.getItem('dragonsHunterSession');
                if (localSession) return JSON.parse(localSession);
                
                return null;
            } catch (error) {
                console.error('Get session error:', error);
                return null;
            }
        }

        // ========== GET USER DATA ==========
        async function getUserData() {
            const session = await getSession();
            if (session && session.userId) {
                return session;
            }
            return null;
        }

        // ========== TOP UP (DEPOSIT) ==========
        function openTopUp() {
            selectedTopUp = 0;
            document.getElementById('customTopUp').value = '';
            
            const options = document.querySelectorAll('#topUpOptions .topup-option');
            options.forEach(option => option.classList.remove('selected'));
            
            document.getElementById('topUpModal').classList.add('show');
        }

        function closeTopUp() {
            document.getElementById('topUpModal').classList.remove('show');
        }

        function selectTopUp(amount) {
            selectedTopUp = amount;
            document.getElementById('customTopUp').value = '';
            
            const options = document.querySelectorAll('#topUpOptions .topup-option');
            options.forEach(option => {
                option.classList.remove('selected');
                if (option.querySelector('.amount').textContent.includes((amount/1000).toString() + 'K')) {
                    option.classList.add('selected');
                }
            });
        }

        function selectCustomTopUp() {
            const customValue = parseInt(document.getElementById('customTopUp').value);
            if (customValue >= 20000) {
                selectedTopUp = customValue;
                const options = document.querySelectorAll('#topUpOptions .topup-option');
                options.forEach(option => option.classList.remove('selected'));
            } else {
                alert('Nominal minimal Rp 20.000!');
            }
        }

        async function processTopUp() {
            // Prevent double submit
            if (isTopUpProcessing) return;
            isTopUpProcessing = true;
            
            if (selectedTopUp === 0) {
                const customValue = parseInt(document.getElementById('customTopUp').value);
                if (customValue >= 20000) {
                    selectedTopUp = customValue;
                } else {
                    alert('Pilih nominal top up atau masukkan minimal Rp 20.000!');
                    isTopUpProcessing = false;
                    return;
                }
            }

            if (selectedTopUp < 20000) {
                alert('Nominal minimal Rp 20.000!');
                isTopUpProcessing = false;
                return;
            }

            document.getElementById('loadingOverlay').classList.add('show');

            try {
                const userData = await getUserData();
                currentUserData = userData;

                const transactionId = generateId('topup_');
                
                sessionStorage.setItem('pendingTopUpAmount', selectedTopUp);
                sessionStorage.setItem('pendingTopUpBaseAmount', selectedTopUp);
                sessionStorage.setItem('pendingTransactionId', transactionId);
                
                const topUpData = {
                    transactionId: transactionId,
                    userId: currentUserId || 'guest',
                    username: currentUserData?.username || 'guest',
                    amount: selectedTopUp,
                    type: 'topup',
                    method: 'QRIS',
                    status: 'pending',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };
                
                await db.ref('transactions/' + (currentUserId || 'guest') + '/' + transactionId).set(topUpData);
                
                window.location.href = 'pembayaran.html';
                
            } catch (error) {
                console.error('Error processing top up:', error);
                alert('❌ Gagal mengirim permintaan top up. Silakan coba lagi.');
                document.getElementById('loadingOverlay').classList.remove('show');
                isTopUpProcessing = false;
            }
        }

        // ========== WITHDRAW (PENARIKAN) ==========
        function openWithdraw() {
            selectedWithdraw = 0;
            
            const options = document.querySelectorAll('#withdrawOptions .topup-option');
            options.forEach(option => option.classList.remove('selected'));
            
            document.getElementById('withdrawModal').classList.add('show');
        }

        function closeWithdraw() {
            document.getElementById('withdrawModal').classList.remove('show');
        }

        function selectWithdraw(amount) {
            selectedWithdraw = amount;
            const options = document.querySelectorAll('#withdrawOptions .topup-option');
            options.forEach(option => {
                option.classList.remove('selected');
                if (option.querySelector('.amount').textContent.includes(amount.toLocaleString('id-ID'))) {
                    option.classList.add('selected');
                }
            });
        }

        async function processWithdraw() {
            // Prevent double submit
            if (isWithdrawProcessing) return;
            isWithdrawProcessing = true;
            
            if (selectedWithdraw === 0) {
                alert('Pilih nominal penarikan terlebih dahulu!');
                isWithdrawProcessing = false;
                return;
            }

            if (selectedWithdraw > balance) {
                alert('Saldo tidak mencukupi untuk penarikan!');
                isWithdrawProcessing = false;
                return;
            }

            // Cek apakah user sudah punya metode withdraw
            if (!currentUserData?.withdrawMethod || !currentUserData?.withdrawAccount) {
                alert('⚠️ Anda belum memiliki metode penarikan!\n\nSilakan hubungi admin untuk mengatur metode penarikan.');
                isWithdrawProcessing = false;
                return;
            }

            const transactionId = generateId('withdraw_');
            
            const withdrawData = {
                transactionId: transactionId,
                userId: currentUserId || 'guest',
                username: currentUserData?.username || 'guest',
                amount: selectedWithdraw,
                type: 'withdraw',
                method: currentUserData?.withdrawMethod || 'Transfer Bank',
                withdrawAccount: currentUserData?.withdrawAccount || '',
                withdrawName: currentUserData?.withdrawName || '',
                status: 'pending',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            
            try {
                await db.ref('transactions/' + (currentUserId || 'guest') + '/' + transactionId).set(withdrawData);
                
                alert(`✅ Permintaan Penarikan Rp ${selectedWithdraw.toLocaleString('id-ID')} telah dikirim!\n\n` +
                      `Nomor Transaksi: ${transactionId}\n` +
                      `Status: Menunggu Verifikasi Admin\n\n` +
                      `Dana akan dikirim setelah admin memverifikasi permintaan Anda.`);
                
                closeWithdraw();
                isWithdrawProcessing = false;
            } catch (error) {
                console.error('Error processing withdraw:', error);
                alert('❌ Gagal mengirim permintaan penarikan. Silakan coba lagi.');
                isWithdrawProcessing = false;
            }
        }

        // ========== BUAT DATA AWAL (20 GAMBAR) ==========
        function generateInitialHistory() {
            const shuffledAnimals = [...normalAnimals].sort(() => Math.random() - 0.5);
            
            const randomBonus = bonusAnimals[Math.floor(Math.random() * bonusAnimals.length)];
            shuffledAnimals.splice(Math.floor(Math.random() * (shuffledAnimals.length + 1)), 0, randomBonus);
            
            while (shuffledAnimals.length < 20) {
                shuffledAnimals.push(normalAnimals[Math.floor(Math.random() * normalAnimals.length)]);
            }
            
            return shuffledAnimals;
        }

        // ========== GENERATE PAPAN HASIL ==========
        function generateBoard() {
            const rollContainer = document.getElementById('rollContainer');
            rollContainer.innerHTML = '';
            
            if (history.length === 0) {
                history = generateInitialHistory();
                db.ref('history').set(history);
            }
            
            for (let i = 0; i < 20; i++) {
                const item = document.createElement('div');
                item.className = 'roll-item';
                item.id = `roll-${i}`;
                
                const animal = history[i];
                if (animal.name === 'Naga' || animal.name === 'Harimau') {
                    item.innerHTML = `<video src="${animal.icon}" autoplay loop muted playsinline></video>`;
                } else {
                    item.innerHTML = `<img src="${animal.icon}" alt="${animal.name}">`;
                }
                
                rollContainer.appendChild(item);
            }
        }

        // ========== FUNGSI GESER GAMBAR (ROLLING) ==========
        function shiftHistory(newAnimal) {
            const lastItem = document.getElementById('roll-19');
            if (lastItem) {
                lastItem.classList.add('removed-item');
                setTimeout(() => lastItem.remove(), 500);
            }
            
            for (let i = 18; i >= 0; i--) {
                const currentItem = document.getElementById(`roll-${i}`);
                const nextItem = document.getElementById(`roll-${i + 1}`);
                
                if (currentItem && nextItem) {
                    nextItem.innerHTML = currentItem.innerHTML;
                    nextItem.className = currentItem.className;
                    nextItem.id = `roll-${i + 1}`;
                }
            }
            
            const firstItem = document.getElementById('roll-0');
            if (firstItem) {
                if (newAnimal.name === 'Naga' || newAnimal.name === 'Harimau') {
                    firstItem.innerHTML = `<video src="${newAnimal.icon}" autoplay loop muted playsinline></video>`;
                } else {
                    firstItem.innerHTML = `<img src="${newAnimal.icon}" alt="${newAnimal.name}">`;
                }
                firstItem.className = 'roll-item new-item';
                firstItem.id = 'roll-0';
            }
            
            history.unshift(newAnimal);
            history = history.slice(0, 20);
            db.ref('history').set(history);
        }

        // ========== FUNGSI KEMBANG API ==========
        function showFireworks() {
            const container = document.createElement('div');
            container.className = 'fireworks-container';
            document.body.appendChild(container);
            
            const colors = ['#ff4444', '#ffd700', '#00ff88', '#ff69b4', '#00bfff', '#ff8c00'];
            
            for (let i = 0; i < 30; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = Math.random() * 100 + '%';
                firework.style.top = Math.random() * 100 + '%';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                firework.style.animationDelay = Math.random() * 0.5 + 's';
                firework.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
                container.appendChild(firework);
            }
            
            setTimeout(() => container.remove(), 2000);
        }

        // ========== FUNGSI COUNT UP ANIMATION ==========
        function animateCountUp(element, targetValue, duration = 2000) {
            const startTime = performance.now();
            const startValue = 0;
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easedProgress = 1 - Math.pow(1 - progress, 3);
                
                const currentValue = Math.floor(easedProgress * targetValue);
                element.textContent = `Rp ${currentValue.toLocaleString('id-ID')}`;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = `Rp ${targetValue.toLocaleString('id-ID')}`;
                }
            }
            
            requestAnimationFrame(update);
        }

        // ========== FUNGSI GET WIN TITLE ==========
        function getWinTitle(winAmount) {
            if (winAmount > 500000) {
                return { title: "🔥 ULTIMATE WIN! 🔥", class: "ultimate-win" };
            } else if (winAmount > 200000) {
                return { title: "⚡ EPIC WIN! ⚡", class: "epic-win" };
            } else if (winAmount > 100000) {
                return { title: "🌟 SUPER WIN! 🌟", class: "super-win" };
            } else if (winAmount > 50000) {
                return { title: "💎 BIG WIN! 💎", class: "big-win" };
            } else {
                return { title: "✨ MENANG! ✨", class: "" };
            }
        }

        // ========== FUNGSI FASE ANIMASI KARTU ==========
        function runCardAnimation(result, isWin, winAmount, winningDetails = []) {
            const mainCard = document.getElementById('mainCard');
            const resultMessage = document.getElementById('resultMessage');
            
            mainCard.classList.remove('revealed-card', 'win', 'lose', 'shuffling', 'revealing');
            mainCard.classList.add('hidden-card');
            mainCard.innerHTML = '';
            resultMessage.textContent = '';
            resultMessage.className = 'result-message';
            
            setTimeout(() => {
                mainCard.classList.remove('hidden-card');
                mainCard.classList.add('shuffling');
                
                setTimeout(() => {
                    mainCard.classList.remove('shuffling');
                    mainCard.classList.add('revealing', 'revealed-card');
                    
                    if (result.name === 'Naga' || result.name === 'Harimau') {
                        mainCard.innerHTML = `<video src="${result.icon}" autoplay loop muted playsinline></video>`;
                    } else {
                        mainCard.innerHTML = `<img src="${result.icon}" alt="${result.name}">`;
                    }
                    
                    setTimeout(() => {
                        mainCard.classList.remove('revealing');
                        
                        if (isWin) {
                            mainCard.classList.add('win');
                            playCorrectSound();
                            
                            const winInfo = getWinTitle(winAmount);
                            
                            let detailsHTML = '';
                            if (winningDetails.length > 0) {
                                detailsHTML = '<div class="win-details">';
                                winningDetails.forEach(detail => {
                                    detailsHTML += `<div class="win-detail-item">✅ ${detail.animalName} (${detail.type}) - Rp ${detail.winAmount.toLocaleString('id-ID')}</div>`;
                                });
                                detailsHTML += '</div>';
                            }
                            
                            resultMessage.innerHTML = `
                                <div class="win-title ${winInfo.class}">${winInfo.title}</div>
                                <div class="count-up" id="countUpAmount"></div>
                                ${detailsHTML}
                            `;
                            resultMessage.className = 'result-message win';
                            
                            const countUpElement = document.getElementById('countUpAmount');
                            animateCountUp(countUpElement, winAmount, 2000);
                            
                            showFireworks();
                        } else {
                            mainCard.classList.add('lose');
                            playWrongSound();
                            resultMessage.textContent = "❌ Anda belum beruntung silahkan coba lagi";
                            resultMessage.className = 'result-message lose';
                        }
                        
                        shiftHistory(result);
                        
                        document.getElementById('animalSelect').value = '';
                        document.getElementById('bonusSelect').value = '';
                        document.getElementById('animalBet').value = 100;
                        document.getElementById('bonusBet').value = 2000;
                        
                        setTimeout(() => {
                            mainCard.classList.remove('revealed-card', 'win', 'lose', 'shuffling', 'revealing');
                            mainCard.classList.add('hidden-card');
                            mainCard.innerHTML = '';
                            resultMessage.textContent = '';
                            resultMessage.className = 'result-message';
                            isAnimating = false;
                        }, 4000);
                    }, 500);
                }, 800);
            }, 100);
        }

        // ========== FUNGSI PASANG (BUKA KARTU) ==========
        async function placeBet() {
            if (isAnimating) {
                alert('Tunggu animasi selesai!');
                return;
            }

            const animalSelect = document.getElementById('animalSelect');
            const bonusSelect = document.getElementById('bonusSelect');
            const animalBetInput = document.getElementById('animalBet');
            const bonusBetInput = document.getElementById('bonusBet');
            
            const selectedAnimal = animalSelect.value;
            const selectedBonus = bonusSelect.value;
            const animalBetAmount = parseInt(animalBetInput.value) || 0;
            const bonusBetAmount = parseInt(bonusBetInput.value) || 0;

            if (!selectedAnimal && !selectedBonus) {
                alert('Pilih hewan atau Naga/Harimau terlebih dahulu!');
                return;
            }

            if (balance < 100) {
                alert('⚠️ Saldo Anda tidak mencukupi!\n\n' +
                      'Saldo Anda: Rp ' + balance.toLocaleString('id-ID') + '\n' +
                      'Minimal taruhan: Rp 100\n\n' +
                      'Silakan melakukan Top Up terlebih dahulu!');
                openTopUp();
                return;
            }

            let totalBetAmount = 0;
            let bets = [];

            if (selectedAnimal) {
                if (animalBetAmount < 100) {
                    alert('Jumlah taruhan hewan tidak valid! Minimal 100.');
                    return;
                }
                bets.push({
                    type: 'hewan',
                    animalName: selectedAnimal,
                    amount: animalBetAmount
                });
                totalBetAmount += animalBetAmount;
            }

            if (selectedBonus) {
                if (bonusBetAmount < 2000) {
                    alert('Jumlah taruhan Naga/Harimau tidak valid! Minimal 2000.');
                    return;
                }
                bets.push({
                    type: selectedBonus === 'Naga' ? 'naga' : 'harimau',
                    animalName: selectedBonus,
                    amount: bonusBetAmount
                });
                totalBetAmount += bonusBetAmount;
            }

            if (totalBetAmount > balance) {
                alert('⚠️ Saldo tidak mencukupi!\n\n' +
                      'Saldo Anda: Rp ' + balance.toLocaleString('id-ID') + '\n' +
                      'Total Taruhan: Rp ' + totalBetAmount.toLocaleString('id-ID') + '\n\n' +
                      'Silakan Top Up terlebih dahulu!');
                openTopUp();
                return;
            }

            balance -= totalBetAmount;
            document.getElementById('balance').textContent = balance;
            saveBalance();

            // ====== TENTUKAN HASIL KARTU ======
            let resultAnimal;

            // Hitung peluang kartu keluar sesuai pilihan user
            let winChance = 0;
            
            if (selectedBonus === 'Naga') {
                winChance = rtpConfig.naga / 100;
            } else if (selectedBonus === 'Harimau') {
                winChance = rtpConfig.harimau / 100;
            } else if (selectedAnimal) {
                winChance = rtpConfig.hewan / 100;
            }

            // Batasi maksimal 95%
            winChance = Math.min(winChance, 0.95);
            
            const random = Math.random();
            
            if (random < winChance) {
                // KARTU KELUAR SESUAI PILIHAN USER -> USER MENANG
                if (selectedBonus === 'Naga') {
                    resultAnimal = bonusAnimals.find(a => a.name === 'Naga');
                } else if (selectedBonus === 'Harimau') {
                    resultAnimal = bonusAnimals.find(a => a.name === 'Harimau');
                } else if (selectedAnimal) {
                    resultAnimal = normalAnimals.find(a => a.name === selectedAnimal);
                }
            } else {
                // KARTU KELUAR ACAK -> USER KALAH
                const randomChance = Math.random();
                if (randomChance < 0.001) {
                    resultAnimal = bonusAnimals[Math.floor(Math.random() * bonusAnimals.length)];
                } else {
                    // Pilih hewan acak yang BUKAN pilihan user
                    const otherAnimals = normalAnimals.filter(a => a.name !== selectedAnimal);
                    resultAnimal = otherAnimals[Math.floor(Math.random() * otherAnimals.length)];
                }
            }

            // ====== CEK KEMENANGAN ======
            let totalWinAmount = 0;
            let winningDetails = [];

            for (const bet of bets) {
                let isMatch = false;
                
                if (bet.type === 'hewan') {
                    isMatch = resultAnimal.name === bet.animalName;
                } else if (bet.type === 'naga' || bet.type === 'harimau') {
                    isMatch = resultAnimal.name === bet.animalName;
                }
                
                if (isMatch) {
                    // Hitung kemenangan berdasarkan multiplier
                    let multiplier = 0;
                    if (bet.type === 'naga') {
                        multiplier = 100;
                    } else if (bet.type === 'harimau') {
                        multiplier = 50;
                    } else {
                        multiplier = 2;
                    }
                    
                    const winAmount = bet.amount * multiplier;
                    totalWinAmount += winAmount;
                    winningDetails.push({
                        type: bet.type,
                        animalName: bet.animalName,
                        amount: bet.amount,
                        winAmount: winAmount
                    });
                }
            }

            // Batasi max win
            if (totalWinAmount > rtpConfig.maxWin) {
                totalWinAmount = rtpConfig.maxWin;
            }

            if (totalWinAmount > 0) {
                balance += totalWinAmount;
                saveBalance();
                document.getElementById('balance').textContent = balance;
            }

            isAnimating = true;

            runCardAnimation(resultAnimal, totalWinAmount > 0, totalWinAmount, winningDetails);

            if (currentUserId) {
                const gameId = generateId('game_');
                await db.ref('gameHistory/' + currentUserId + '/' + gameId).set({
                    gameId: gameId,
                    betAmount: totalBetAmount,
                    winAmount: totalWinAmount,
                    isWin: totalWinAmount > 0,
                    bets: bets.map(b => ({ type: b.type, animalName: b.animalName, amount: b.amount })),
                    resultAnimal: resultAnimal.name,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        // ========== GENERATE ID ==========
        function generateId(prefix) {
            return prefix + Date.now() + Math.random().toString(36).substr(2, 9);
        }

        // ========== CEK SALDO RENDAH ==========
        function checkLowBalance() {
            if (balance < 100) {
                alert('⚠️ Peringatan!\n\n' +
                      'Saldo Anda: Rp ' + balance.toLocaleString('id-ID') + '\n' +
                      'Saldo terlalu rendah untuk bermain!\n\n' +
                      'Silakan Top Up untuk melanjutkan permainan.');
            }
        }

        // ========== INISIALISASI ==========
        async function init() {
            document.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.removeEventListener('click', initAudioOnce);
            });

            await loadRTP();

            const session = await getSession();
            if (session && session.userId) {
                currentUserId = session.userId;
                currentUserData = session;
                
                // Listener real-time untuk balance
                db.ref('users/' + currentUserId + '/balance').on('value', (snapshot) => {
                    balance = snapshot.val() || 10000;
                    document.getElementById('balance').textContent = balance;
                    
                    // Update session
                    const currentSession = getSession();
                    if (currentSession) {
                        currentSession.balance = balance;
                        sessionStorage.setItem('dragonsHunterSession', JSON.stringify(currentSession));
                        localStorage.setItem('dragonsHunterSession', JSON.stringify(currentSession));
                    }
                    
                    if (balance < 100) {
                        setTimeout(checkLowBalance, 1000);
                    }
                });
            } else {
                db.ref('saldo').on('value', (snapshot) => {
                    balance = snapshot.val() || 10000;
                    document.getElementById('balance').textContent = balance;
                });
            }

            db.ref('history').on('value', (snapshot) => {
                history = snapshot.val() || [];
                if (history.length === 0) {
                    history = generateInitialHistory();
                    db.ref('history').set(history);
                }
                generateBoard();
            });

            generateDropdowns();
        }

        init();
    </script>
