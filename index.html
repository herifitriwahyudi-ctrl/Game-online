<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Roulette Hewan Hutan Rimba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: 
                radial-gradient(ellipse at bottom, rgba(40, 80, 50, 0.8), transparent),
                linear-gradient(180deg, #0a1f14 0%, #143a20 50%, #1a4527 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* Background Hutan */
        .forest-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 120px; height: 200px;
            background: linear-gradient(180deg, #2d5a27, #1a3d15);
            border-radius: 10px 10px 0 0;
            animation: sway 5s ease-in-out infinite;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: -40px; left: -20px;
            width: 160px; height: 80px;
            background: linear-gradient(135deg, #3a7d30, #2d5a27);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .tree:nth-child(1) { left: 10px; }
        .tree:nth-child(2) { left: 15%; height: 240px; animation-delay: 1s; }
        .tree:nth-child(3) { right: 10%; height: 180px; animation-delay: 2s; }
        .tree:nth-child(4) { right: 20px; height: 260px; animation-delay: 3s; }
        .tree:nth-child(5) { left: 40%; height: 220px; animation-delay: 4s; }
        .tree:nth-child(6) { right: 40%; height: 200px; animation-delay: 5s; }

        .fireflies {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffe066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066;
            animation: fly 8s infinite;
        }

        .fireflies:nth-child(7) { top: 30%; left: 20%; animation-delay: 0s; }
        .fireflies:nth-child(8) { top: 50%; left: 80%; animation-delay: 2s; }
        .fireflies:nth-child(9) { top: 70%; left: 50%; animation-delay: 4s; }
        .fireflies:nth-child(10) { top: 40%; left: 70%; animation-delay: 6s; }
        .fireflies:nth-child(11) { top: 60%; left: 30%; animation-delay: 1s; }
        .fireflies:nth-child(12) { top: 20%; left: 60%; animation-delay: 3s; }
        .fireflies:nth-child(13) { top: 80%; left: 90%; animation-delay: 5s; }
        .fireflies:nth-child(14) { top: 45%; left: 10%; animation-delay: 7s; }

        .moon {
            position: absolute;
            top: 50px; right: 100px;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f, 0 0 80px rgba(241,196,15,0.3);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            25% { transform: translate(15px, -20px); opacity: 1; }
            50% { transform: translate(-10px, -35px); opacity: 0.6; }
            75% { transform: translate(20px, -15px); opacity: 0.8; }
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 40px #f1c40f; }
            to { box-shadow: 0 0 60px #f1c40f, 0 0 100px rgba(241,196,15,0.5); }
        }

        /* Container Utama */
        .game-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            position: relative;
            z-index: 10;
        }

        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
            border-radius: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '🎡';
            position: absolute;
            left: 20px;
            font-size: 40px;
            animation: floatDragon 3s ease-in-out infinite;
        }

        .game-header::after {
            content: '🐉';
            position: absolute;
            right: 20px;
            font-size: 40px;
            animation: floatDragon 3s ease-in-out infinite reverse;
        }

        @keyframes floatDragon {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .game-header h1 {
            font-size: 2.5em;
            color: #3d1e00;
            font-family: 'Papyrus', 'Georgia', serif;
            letter-spacing: 3px;
        }

        /* Roulette Wheel */
        .roulette-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 20px;
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.6), inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, #2a1f0e, #1a1208);
            transform: rotate(0deg);
            transition: none;
        }

        .roulette-wheel.spinning {
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .segment {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 50%;
            transform-origin: 0% 100%;
            border-left: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 15px;
        }

        .segment-content {
            font-size: 30px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
            transform: rotate(0deg);
        }

        .segment-content img, .segment-content video {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 5px;
        }

        /* Pointer */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ffd700;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -10px;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
        }

        /* Tombol Spin */
        .spin-btn {
            display: block;
            margin: 20px auto;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 15px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Panel Taruhan */
        .betting-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 15px;
            border: 2px solid #8b6914;
            flex-wrap: wrap;
        }

        .stat-box {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            min-width: 120px;
        }

        .stat-box label {
            display: block;
            font-size: 0.9em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .stat-box span {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        .bet-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .bet-btn {
            background: #8b6914;
            border: none;
            color: #fff;
            width: 30px; height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .bet-btn:hover {
            background: #a07818;
        }

        /* Pilihan Hewan untuk Taruhan */
        .animal-selection {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            margin: 20px 0;
        }

        .animal-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .animal-option:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .animal-option.selected {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .animal-option img, .animal-option video {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .animal-option .animal-name {
            font-size: 0.9em;
            color: #fff;
        }

        /* Hasil */
        .result-display {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            font-size: 1.2em;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .result-display.win {
            background: rgba(0,255,136,0.2);
            border: 2px solid #00ff88;
        }

        .result-display.lose {
            background: rgba(255,102,102,0.2);
            border: 2px solid #ff6666;
        }

        .result-display.jackpot {
            background: rgba(255,68,68,0.3);
            border: 3px solid #ff4444;
            animation: jackpotGlow 0.5s infinite;
        }

        @keyframes jackpotGlow {
            0%, 100% { box-shadow: 0 0 20px #ff4444; }
            50% { box-shadow: 0 0 40px #ff6666; }
        }

        /* Leaderboard */
        .leaderboard {
            margin-top: 20px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #8b6914;
        }

        .leaderboard h3 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.15);
        }

        .leaderboard-item.rank-1 {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #3d1e00;
            font-weight: bold;
        }

        .leaderboard-item.rank-2 {
            background: linear-gradient(145deg, #c0c0c0, #a8a8a8);
            color: #333;
        }

        .leaderboard-item.rank-3 {
            background: linear-gradient(145deg, #cd7f32, #b8860b);
            color: #333;
        }

        .leaderboard-name { font-weight: bold; }
        .leaderboard-score { font-size: 1.2em; font-weight: bold; }

        .name-input {
            padding: 8px;
            border-radius: 5px;
            border: 2px solid #8b6914;
            background: #1a1208;
            color: #fff;
            font-size: 1em;
            margin-right: 10px;
            width: 150px;
        }

        .save-btn {
            background: #ffd700;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #3d1e00;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: #ffaa00;
        }

        /* Sound Toggle */
        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        /* Partikel */
        .gold-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #ffd700, #ffaa00);
            border-radius: 50%;
            animation: particleFall 3s ease-in-out infinite;
        }

        @keyframes particleFall {
            0% { transform: translateY(-100px) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        }

        /* Responsif */
        @media (max-width: 768px) {
            .roulette-container {
                width: 300px;
                height: 300px;
            }

            .animal-selection {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="forest-bg">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="fireflies"></div>
        <div class="moon"></div>
    </div>

    <!-- Partikel -->
    <div class="gold-particles" id="goldParticles"></div>

    <!-- Sound Toggle -->
    <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">🔊</button>

    <!-- Game Container -->
    <div class="game-container">
        <div class="game-header">
            <h1>🎡 ROULETTE HEWAN HUTAN 🎡</h1>
            <p>Putar Roda & Menangkan Hewan Pilihan Anda!</p>
        </div>

        <!-- Roulette Wheel -->
        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="roulette-wheel" id="rouletteWheel">
                <!-- Segmen akan digenerate oleh JS -->
            </div>
        </div>

        <!-- Tombol Spin -->
        <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 SPIN!</button>

        <!-- Panel Taruhan -->
        <div class="betting-panel">
            <div class="stat-box">
                <label>💰 Saldo</label>
                <span id="balance">5000</span>
            </div>
            <div class="stat-box">
                <label>🎲 Taruhan</label>
                <div class="bet-controls">
                    <button class="bet-btn" onclick="changeBet(-10)">-</button>
                    <span id="bet">100</span>
                    <button class="bet-btn" onclick="changeBet(10)">+</button>
                </div>
            </div>
        </div>

        <!-- Pilihan Hewan -->
        <h3 style="text-align: center; color: #ffd700; margin: 20px 0 10px;">🐾 Pilih Hewan Taruhan Anda</h3>
        <div class="animal-selection" id="animalSelection">
            <!-- Akan digenerate oleh JS -->
        </div>

        <!-- Hasil -->
        <div class="result-display" id="result">
            Pilih hewan, lalu tekan SPIN!
        </div>

        <!-- Leaderboard -->
        <div style="text-align: center; margin: 10px 0;">
            <input type="text" class="name-input" id="playerName" placeholder="Masukkan nama Anda" maxlength="20">
            <button class="save-btn" onclick="saveScore()">💾 Simpan Skor</button>
        </div>

        <div class="leaderboard">
            <h3>🏆 Leaderboard Pemain</h3>
            <div class="leaderboard-list" id="leaderboardList"></div>
        </div>
    </div>

    <script>
        // ========== DATA HEWAN ==========
        // 10 hewan dari gambar + 2 hewan video (Harimau & Naga)
        const animals = [
            { name: "Rubah",    icon: "rubah.png",    multiplier: 5 },
            { name: "Serigala", icon: "serigala.png", multiplier: 8 },
            { name: "Panda",    icon: "panda.png",    multiplier: 10 },
            { name: "Beruang",  icon: "beruang.png",  multiplier: 12 },
            { name: "Gajah",    icon: "gajah.png",    multiplier: 15 },
            { name: "Singa",    icon: "singa.png",    multiplier: 20 },
            { name: "Rusa",     icon: "rusa.png",     multiplier: 25 },
            { name: "Kucing",   icon: "kucing.png",   multiplier: 30 },
            { name: "Burung",   icon: "burung.png",   multiplier: 40 },
            { name: "Kelinci",  icon: "kelinci.png",  multiplier: 50 },
            { name: "Harimau",  icon: "harimau.mp4",  multiplier: 100, isVideo: true },
            { name: "Naga",     icon: "naga.mp4",     multiplier: 500, isVideo: true }
        ];

        // ========== STATE GAME ==========
        let balance = 5000;
        let currentBet = 100;
        let selectedAnimal = null;
        let isSpinning = false;
        let soundEnabled = true;
        let audioCtx = null;
        let totalSegments = animals.length;

        // ========== AUDIO ==========
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSpinSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function playWinSound() {
            if (!soundEnabled || !audioCtx) return;
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }, i * 100);
            });
        }

        function playLoseSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        function playJackpotSound() {
            if (!soundEnabled || !audioCtx) return;
            [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }, i * 150);
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) initAudio();
        }

        // ========== GENERATE WHEEL ==========
        function generateWheel() {
            const wheel = document.getElementById('rouletteWheel');
            wheel.innerHTML = '';
            
            const segmentAngle = 360 / totalSegments;
            
            animals.forEach((animal, index) => {
                const segment = document.createElement('div');
                segment.className = 'segment';
                segment.style.transform = `rotate(${index * segmentAngle}deg)`;
                segment.style.backgroundColor = `hsl(${index * 30}, 50%, 30%)`;
                
                let content = '';
                if (animal.isVideo) {
                    content = `<video src="${animal.icon}" autoplay loop muted playsinline></video>`;
                } else {
                    content = `<img src="${animal.icon}" alt="${animal.name}">`;
                }
                
                segment.innerHTML = `<div class="segment-content">${content}</div>`;
                segment.dataset.animal = animal.name;
                segment.dataset.index = index;
                
                wheel.appendChild(segment);
            });
        }

        // ========== GENERATE ANIMAL SELECTION ==========
        function generateAnimalSelection() {
            const selection = document.getElementById('animalSelection');
            selection.innerHTML = '';
            
            animals.forEach((animal, index) => {
                const option = document.createElement('div');
                option.className = 'animal-option';
                option.dataset.animal = animal.name;
                option.onclick = () => selectAnimal(animal.name);
                
                let content = '';
                if (animal.isVideo) {
                    content = `<video src="${animal.icon}" muted playsinline></video>`;
                } else {
                    content = `<img src="${animal.icon}" alt="${animal.name}">`;
                }
                
                option.innerHTML = `
                    ${content}
                    <div class="animal-name">${animal.name}</div>
                    <div style="font-size: 0.8em; color: #ffd700;">x${animal.multiplier}</div>
                `;
                
                selection.appendChild(option);
            });
        }

        // ========== PILIH HEWAN ==========
        function selectAnimal(animalName) {
            selectedAnimal = animalName;
            
            // Update UI
            const options = document.querySelectorAll('.animal-option');
            options.forEach(option => {
                option.classList.remove('selected');
                if (option.dataset.animal === animalName) {
                    option.classList.add('selected');
                }
            });
            
            document.getElementById('result').innerHTML = `Anda memilih <strong>${animalName}</strong>!`;
        }

        // ========== SPIN ==========
        function spin() {
            if (isSpinning) return;
            
            if (!selectedAnimal) {
                alert('Pilih hewan terlebih dahulu!');
                return;
            }
            
            if (balance < currentBet) {
                document.getElementById('result').innerHTML = '❌ Saldo tidak cukup!';
                return;
            }

            isSpinning = true;
            balance -= currentBet;
            document.getElementById('balance').textContent = balance;
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            // Play sound
            playSpinSound();

            // Tentukan hewan pemenang (berdasarkan probabilitas)
            const winnerAnimal = determineWinner();
            
            // Hitung rotasi
            const winnerIndex = animals.findIndex(a => a.name === winnerAnimal.name);
            const segmentAngle = 360 / totalSegments;
            
            // Rotasi acak + rotasi ke pemenang
            const randomRotation = 360 * 5 + (Math.random() * 360);
            const targetRotation = (360 - (winnerIndex * segmentAngle)) - 90; // 90 = offset pointer
            
            const wheel = document.getElementById('rouletteWheel');
            
            // Reset rotasi untuk animasi yang mulus
            wheel.style.transform = 'rotate(0deg)';
            
            // Trigger reflow
            void wheel.offsetWidth;
            
            // Set rotasi final
            wheel.style.transform = `rotate(${randomRotation + targetRotation}deg)`;
            wheel.classList.add('spinning');

            // Setelah 5 detik (durasi animasi), cek hasil
            setTimeout(() => {
                wheel.classList.remove('spinning');
                isSpinning = false;
                spinBtn.disabled = false;
                
                // Cek kemenangan
                checkWin(winnerAnimal);
            }, 5200);
        }

        // ========== TENTUKAN PEMENANG ==========
        function determineWinner() {
            // Probabilitas berdasarkan multiplier
            const totalMultiplier = animals.reduce((sum, animal) => sum + animal.multiplier, 0);
            
            const random = Math.random() * totalMultiplier;
            let cumulative = 0;
            
            for (const animal of animals) {
                cumulative += animal.multiplier;
                if (random < cumulative) {
                    return animal;
                }
            }
            
            // Fallback
            return animals[animals.length - 1]; // Naga
        }

        // ========== CEK KEMENANGAN ==========
        function checkWin(winnerAnimal) {
            const resultDiv = document.getElementById('result');
            
            if (winnerAnimal.name === selectedAnimal) {
                // MENANG!
                const winAmount = currentBet * winnerAnimal.multiplier;
                balance += winAmount;
                document.getElementById('balance').textContent = balance;
                
                resultDiv.innerHTML = `
                    <h2>🎉 KAMU MENANG! 🎉</h2>
                    <p>${winnerAnimal.name} keluar!</p>
                    <p class="win-amount">+${winAmount}</p>
                    <small>Taruhan ${currentBet} x ${winnerAnimal.multiplier}</small>
                `;
                resultDiv.className = 'result-display win';
                playWinSound();
                
                // Cek jackpot
                if (winnerAnimal.name === 'Naga' || winnerAnimal.name === 'Harimau') {
                    resultDiv.className = 'result-display jackpot';
                    playJackpotSound();
                    generateGoldParticles();
                }
            } else {
                // KALAH
                resultDiv.innerHTML = `
                    <p>❌ Kalah!</p>
                    <p>${winnerAnimal.name} keluar, bukan ${selectedAnimal}.</p>
                    <small>Taruhan ${currentBet} hilang</small>
                `;
                resultDiv.className = 'result-display lose';
                playLoseSound();
            }
        }

        // ========== GENERATE PARTIKEL EMAS ==========
        function generateGoldParticles() {
            const container = document.getElementById('goldParticles');
            container.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 15 + 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (Math.random() * 2 + 1) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }

        // ========== UBAT TARUHAN ==========
        function changeBet(delta) {
            currentBet = Math.max(10, Math.min(5000, currentBet + delta));
            document.getElementById('bet').textContent = currentBet;
        }

        // ========== LEADERBOARD ==========
        function loadLeaderboard() {
            const saved = localStorage.getItem('rouletteLeaderboard');
            return saved ? JSON.parse(saved) : [];
        }

        function saveLeaderboard(data) {
            localStorage.setItem('rouletteLeaderboard', JSON.stringify(data));
        }

        function displayLeaderboard() {
            const leaderboard = loadLeaderboard();
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';
            
            if (leaderboard.length === 0) {
                listEl.innerHTML = '<p style="text-align: center;">Belum ada pemain. Jadilah yang pertama!</p>';
                return;
            }

            leaderboard.slice(0, 10).forEach((player, index) => {
                const item = document.createElement('div');
                item.className = `leaderboard-item rank-${index + 1}`;
                item.innerHTML = `
                    <span class="leaderboard-name">${index + 1}. ${player.name}</span>
                    <span class="leaderboard-score">💰 ${player.score}</span>
                `;
                listEl.appendChild(item);
            });
        }

        function saveScore() {
            const nameInput = document.getElementById('playerName');
            const playerName = nameInput.value.trim();
            
            if (!playerName) {
                alert('Mohon masukkan nama Anda!');
                return;
            }

            const leaderboard = loadLeaderboard();
            leaderboard.push({
                name: playerName,
                score: balance,
                timestamp: Date.now()
            });

            leaderboard.sort((a, b) => b.score - a.score);
            const top10 = leaderboard.slice(0, 10);

            saveLeaderboard(top10);
            displayLeaderboard();
            
            nameInput.value = '';
            alert('Skor Anda berhasil disimpan! 🎉');
        }

        // ========== INISIALISASI ==========
        function init() {
            document.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.removeEventListener('click', initAudioOnce);
            });

            generateWheel();
            generateAnimalSelection();
            displayLeaderboard();
        }

        init();
    </script>
