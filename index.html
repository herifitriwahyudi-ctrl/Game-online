<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Dragons Hunter - Game</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b6914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dragons Hunter">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Georgia', serif;
            background: url('background-dragon.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #0a1f14;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 31, 20, 0.85);
            z-index: -1;
            pointer-events: none;
        }
        
        /* Header */
        .game-header {
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-bottom: 3px solid #8b6914;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        .game-header h1 {
            color: #ffd700;
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .balance-display {
            background: rgba(0,255,136,0.1);
            border: 2px solid #00ff88;
            border-radius: 50px;
            padding: 8px 15px;
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .logout-btn {
            background: rgba(255,68,68,0.2);
            border: 2px solid #ff4444;
            color: #ff4444;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: rgba(255,68,68,0.4);
        }
        
        /* Game Container */
        .game-container {
            max-width: 1200px;
            width: 95%;
            margin: 20px auto;
        }
        
        /* Game Board */
        .game-board {
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            margin-bottom: 30px;
        }
        
        .game-board h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        
        /* Animals Grid */
        .animals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .animal-card {
            background: rgba(0,0,0,0.3);
            border: 2px solid #8b6914;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .animal-card:hover {
            border-color: #ffd700;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.3);
        }
        
        .animal-card.selected {
            border-color: #00ff88;
            background: rgba(0,255,136,0.1);
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        
        .animal-card .animal-icon {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }
        
        .animal-card .animal-name {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .animal-card .animal-odds {
            color: #aaa;
            font-size: 0.85em;
            margin-bottom: 15px;
        }
        
        .animal-card .bet-info {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 8px;
            margin-top: 10px;
        }
        
        .animal-card .bet-amount {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .animal-card .bet-level {
            color: #aaa;
            font-size: 0.8em;
            margin-top: 5px;
        }
        
        /* Bet Controls */
        .bet-controls {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid rgba(139,105,20,0.3);
        }
        
        .bet-controls h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .bet-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .bet-btn {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            color: #3d1e00;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        }
        
        .bet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,215,0,0.5);
        }
        
        .bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .bet-btn.bet-min {
            background: linear-gradient(145deg, #00ff88, #00cc66);
            color: #1a1a1a;
        }
        
        .bet-btn.bet-max {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            color: #fff;
        }
        
        /* Result Display */
        .result-display {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .result-animation {
            font-size: 3em;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .result-text {
            color: #ffd700;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .result-win {
            color: #00ff88;
        }
        
        .result-lose {
            color: #ff4444;
        }
        
        /* History */
        .history-section {
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 20px;
            border: 2px solid #8b6914;
            padding: 20px;
        }
        
        .history-section h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(139,105,20,0.3);
        }
        
        .history-item .animal-icon {
            font-size: 1.5em;
        }
        
        .history-item .history-bet {
            color: #aaa;
        }
        
        .history-item .history-win {
            color: #00ff88;
            font-weight: bold;
        }
        
        .history-item .history-lose {
            color: #ff4444;
            font-weight: bold;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }
        
        .modal-content h3 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .modal-content button {
            width: 100%;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            color: #3d1e00;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .modal-content button:hover {
            transform: translateY(-2px);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a1f0e;
            border: 2px solid #8b6914;
            border-radius: 10px;
            padding: 15px 25px;
            z-index: 99999;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success {
            border-color: #00ff88;
            color: #00ff88;
        }
        
        .toast.error {
            border-color: #ff4444;
            color: #ff6666;
        }
        
        .toast.info {
            border-color: #ffd700;
            color: #ffd700;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .header-right {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .animals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .bet-buttons {
                flex-direction: column;
            }
        }
        
        @media (max-width: 480px) {
            .animals-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="game-header">
        <h1>🐉 Dragons Hunter</h1>
        <div class="header-right">
            <div class="balance-display" id="balanceDisplay">Rp 0</div>
            <button class="logout-btn" onclick="logout()">🚪 Keluar</button>
        </div>
    </div>

    <!-- Game Container -->
    <div class="game-container">
        <!-- Game Board -->
        <div class="game-board">
            <h2>🎰 Pilih Hewan Taruhan</h2>
            
            <!-- Animals Grid -->
            <div class="animals-grid" id="animalsGrid">
                <!-- Animal cards will be loaded dynamically -->
            </div>

            <!-- Bet Controls -->
            <div class="bet-controls">
                <h3>💰 Kontrol Taruhan</h3>
                <div class="bet-buttons">
                    <button class="bet-btn" onclick="resetBet()">🔄 Reset</button>
                    <button class="bet-btn" onclick="increaseBet()">⬆️ Naik Taruhan</button>
                    <button class="bet-btn bet-min" onclick="setMinBet()">⬇️ Minimum</button>
                    <button class="bet-btn bet-max" onclick="setMaxBet()">💎 Maksimum</button>
                    <button class="bet-btn" onclick="placeBet()" id="placeBetBtn">🎯 Pasang Taruhan</button>
                </div>
            </div>

            <!-- Result Display -->
            <div class="result-display" id="resultDisplay">
                <p style="color: #aaa;">Pilih hewan dan pasang taruhan untuk mulai bermain</p>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-section">
            <h3>📜 Riwayat Permainan</h3>
            <div class="history-list" id="historyList">
                <p style="color: #aaa; text-align: center;">Belum ada riwayat permainan</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h3 id="modalTitle">Hasil</h3>
            <div id="modalContent"></div>
            <button onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <script>
        // ========== STATE ==========
        let currentUser = null;
        let selectedAnimal = null;
        let currentBetLevel = 0;
        let currentBetAmount = 0;
        let isBetting = false;
        let rtpConfig = {
            global: 90,
            hewan: 90,
            naga: 80,
            mode: 'normal',
            maxWin: 1000000
        };
        
        // Animal Definitions
        const animals = [
            { id: 'kelinci', name: 'Kelinci', icon: '🐰', type: 'hewan', odds: 3, baseBet: 100 },
            { id: 'kura', name: 'Kura-kura', icon: '🐢', type: 'hewan', odds: 3, baseBet: 100 },
            { id: 'kuda', name: 'Kuda', icon: '🐴', type: 'hewan', odds: 3, baseBet: 100 },
            { id: 'ayam', name: 'Ayam', icon: '🐔', type: 'hewan', odds: 3, baseBet: 100 },
            { id: 'naga', name: 'Naga', icon: '🐉', type: 'naga', odds: 5, baseBet: 5000 },
            { id: 'harimau', name: 'Harimau', icon: '🐯', type: 'naga', odds: 5, baseBet: 5000 }
        ];
        
        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎮 Game loading...');
            
            // Check session
            const session = await verifySession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = session;
            updateBalanceDisplay();
            
            // Load RTP config
            await loadRTP();
            
            // Load animals
            loadAnimals();
            
            // Load history
            loadHistory();
            
            // Start auto-refresh balance
            setInterval(updateBalanceDisplay, 5000);
        });
        
        // ========== LOAD RTP ==========
        async function loadRTP() {
            try {
                const snapshot = await db.ref('config/rtp').once('value');
                if (snapshot.exists()) {
                    rtpConfig = snapshot.val();
                }
            } catch (error) {
                console.error('Error loading RTP:', error);
            }
        }
        
        // ========== LOAD ANIMALS ==========
        function loadAnimals() {
            const grid = document.getElementById('animalsGrid');
            grid.innerHTML = '';
            
            animals.forEach(animal => {
                const card = document.createElement('div');
                card.className = 'animal-card';
                card.id = 'animal-' + animal.id;
                card.onclick = () => selectAnimal(animal.id);
                
                card.innerHTML = `
                    <span class="animal-icon">${animal.icon}</span>
                    <div class="animal-name">${animal.name}</div>
                    <div class="animal-odds">Odds: ${animal.odds}x</div>
                    <div class="bet-info">
                        <div class="bet-amount">${formatRupiah(animal.baseBet)}</div>
                        <div class="bet-level">Level: 0</div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // ========== SELECT ANIMAL ==========
        function selectAnimal(animalId) {
            // Deselect all
            document.querySelectorAll('.animal-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Select clicked
            const animal = animals.find(a => a.id === animalId);
            if (animal) {
                selectedAnimal = animal;
                currentBetLevel = 0;
                currentBetAmount = animal.baseBet;
                
                const card = document.getElementById('animal-' + animalId);
                card.classList.add('selected');
                
                updateBetDisplay();
                showToast(`✅ ${animal.name} dipilih!`, 'info');
            }
        }
        
        // ========== BETTING FUNCTIONS ==========
        
        // Get bet amount based on animal type and level
        function getBetAmount(animal, level) {
            if (animal.type === 'hewan') {
                return getHewanBetAmount(level);
            } else {
                return getNagaBetAmount(level);
            }
        }
        
        // Hewan bet calculation
        function getHewanBetAmount(level) {
            let total = 100;
            
            for (let i = 1; i <= level; i++) {
                if (i <= 4) total += 100;
                else if (i === 5) total += 500;
                else if (i === 6) total += 1000;
                else total += 5000;
            }
            
            return total;
        }
        
        // Naga/Harimau bet calculation
        function getNagaBetAmount(level) {
            let total = 5000;
            
            for (let i = 1; i <= level; i++) {
                if (i === 1) total += 2000;
                else if (i === 2) total += 3000;
                else if (i === 3) total += 5000;
                else total += 10000;
            }
            
            return total;
        }
        
        // Increase bet
        function increaseBet() {
            if (!selectedAnimal) {
                showToast('❌ Pilih hewan dulu!', 'error');
                return;
            }
            
            currentBetLevel++;
            currentBetAmount = getBetAmount(selectedAnimal, currentBetLevel);
            
            // Check balance
            if (currentBetAmount > currentUser.balance) {
                showToast('❌ Saldo tidak cukup!', 'error');
                currentBetLevel--;
                currentBetAmount = getBetAmount(selectedAnimal, currentBetLevel);
                return;
            }
            
            updateBetDisplay();
        }
        
        // Reset bet
        function resetBet() {
            if (!selectedAnimal) return;
            
            currentBetLevel = 0;
            currentBetAmount = selectedAnimal.baseBet;
            updateBetDisplay();
        }
        
        // Set minimum bet
        function setMinBet() {
            if (!selectedAnimal) return;
            
            currentBetLevel = 0;
            currentBetAmount = selectedAnimal.baseBet;
            updateBetDisplay();
        }
        
        // Set maximum bet
        function setMaxBet() {
            if (!selectedAnimal) return;
            
            let maxLevel = 0;
            let maxAmount = selectedAnimal.baseBet;
            
            while (true) {
                const nextLevel = maxLevel + 1;
                const nextAmount = getBetAmount(selectedAnimal, nextLevel);
                
                if (nextAmount > currentUser.balance) break;
                
                maxLevel = nextLevel;
                maxAmount = nextAmount;
            }
            
            currentBetLevel = maxLevel;
            currentBetAmount = maxAmount;
            updateBetDisplay();
        }
        
        // Update bet display
        function updateBetDisplay() {
            if (!selectedAnimal) return;
            
            const card = document.getElementById('animal-' + selectedAnimal.id);
            const betAmountEl = card.querySelector('.bet-amount');
            const betLevelEl = card.querySelector('.bet-level');
            
            betAmountEl.textContent = formatRupiah(currentBetAmount);
            betLevelEl.textContent = 'Level: ' + currentBetLevel;
        }
        
        // ========== PLACE BET ==========
        async function placeBet() {
            if (!selectedAnimal) {
                showToast('❌ Pilih hewan dulu!', 'error');
                return;
            }
            
            if (isBetting) {
                showToast('⏳ Tunggu proses selesai!', 'error');
                return;
            }
            
            if (currentBetAmount > currentUser.balance) {
                showToast('❌ Saldo tidak cukup!', 'error');
                return;
            }
            
            // Lock button
            isBetting = true;
            lockButton('placeBetBtn');
            
            // Show loading
            document.getElementById('resultDisplay').innerHTML = '<p style="color: #ffd700;">⏳ Memproses taruhan...</p>';
            
            try {
                // Check win based on RTP
                const result = checkWin(selectedAnimal, currentBetAmount);
                
                // Update balance
                const newBalance = currentUser.balance - currentBetAmount + result.winAmount;
                
                // Save to database
                await db.ref('users/' + currentUser.userId + '/balance').set(newBalance);
                
                // Save game result
                const gameId = generateId('game_');
                await db.ref('gameHistory/' + currentUser.userId + '/' + gameId).set({
                    gameId: gameId,
                    animalId: selectedAnimal.id,
                    animalName: selectedAnimal.name,
                    animalIcon: selectedAnimal.icon,
                    betAmount: currentBetAmount,
                    winAmount: result.winAmount,
                    isWin: result.isWin,
                    level: currentBetLevel,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                
                // Update current user balance
                currentUser.balance = newBalance;
                updateBalanceDisplay();
                
                // Show result
                showResult(result);
                
                // Load history
                loadHistory();
                
                // Reset bet
                resetBet();
                
            } catch (error) {
                console.error('Error placing bet:', error);
                showToast('❌ Error: ' + error.message, 'error');
                document.getElementById('resultDisplay').innerHTML = '<p style="color: #ff4444;">❌ Terjadi kesalahan</p>';
            } finally {
                isBetting = false;
                unlockButton('placeBetBtn');
            }
        }
        
        // ========== CHECK WIN ==========
        function checkWin(animal, betAmount) {
            let winChance = 0;
            
            // Get RTP based on animal type
            if (animal.type === 'naga') {
                winChance = rtpConfig.naga / 100;
            } else {
                winChance = rtpConfig.hewan / 100;
            }
            
            // Adjust based on mode
            switch (rtpConfig.mode) {
                case 'loose':
                    winChance = Math.min(winChance * 1.1, 0.95);
                    break;
                case 'tight':
                    winChance = Math.max(winChance * 0.9, 0.1);
                    break;
                case 'jackpot':
                    winChance = Math.min(winChance * 1.2, 0.95);
                    break;
            }
            
            // Random check
            const random = Math.random();
            const isWin = random < winChance;
            
            // Calculate win amount
            let winAmount = 0;
            if (isWin) {
                winAmount = betAmount * animal.odds;
                
                // Cap max win
                if (winAmount > rtpConfig.maxWin) {
                    winAmount = rtpConfig.maxWin;
                }
            }
            
            return {
                isWin: isWin,
                winAmount: winAmount,
                rtp: winChance * 100
            };
        }
        
        // ========== SHOW RESULT ==========
        function showResult(result) {
            const display = document.getElementById('resultDisplay');
            
            if (result.isWin) {
                display.innerHTML = `
                    <div class="result-animation">🎉</div>
                    <div class="result-text result-win">${selectedAnimal.icon} ${selectedAnimal.name}</div>
                    <div style="color: #00ff88; font-size: 1.3em; font-weight: bold; margin-top: 10px;">
                        +${formatRupiah(result.winAmount)}
                    </div>
                `;
                showToast(`🎉 Menang ${formatRupiah(result.winAmount)}!`, 'success');
            } else {
                display.innerHTML = `
                    <div class="result-animation">😔</div>
                    <div class="result-text result-lose">${selectedAnimal.icon} ${selectedAnimal.name}</div>
                    <div style="color: #ff4444; font-size: 1.3em; font-weight: bold; margin-top: 10px;">
                        -${formatRupiah(currentBetAmount)}
                    </div>
                `;
                showToast('😔 Kalah!', 'error');
            }
        }
        
        // ========== LOAD HISTORY ==========
        async function loadHistory() {
            try {
                const snapshot = await db.ref('gameHistory/' + currentUser.userId)
                    .orderByChild('timestamp')
                    .limitToLast(20)
                    .once('value');
                
                const historyList = document.getElementById('historyList');
                
                if (!snapshot.exists()) {
                    historyList.innerHTML = '<p style="color: #aaa; text-align: center;">Belum ada riwayat permainan</p>';
                    return;
                }
                
                let historyHTML = '';
                const games = [];
                
                snapshot.forEach((child) => {
                    games.push(child.val());
                });
                
                // Reverse for latest first
                games.reverse();
                
                games.forEach(game => {
                    const date = formatDateTime(game.timestamp);
                    const winStatus = game.isWin ? 'history-win' : 'history-lose';
                    const winText = game.isWin ? `+${formatRupiah(game.winAmount)}` : `-${formatRupiah(game.betAmount)}`;
                    
                    historyHTML += `
                        <div class="history-item">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="animal-icon">${game.animalIcon}</span>
                                <div>
                                    <div>${game.animalName}</div>
                                    <div style="font-size: 0.8em; color: #666;">${date}</div>
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div class="history-bet">Bet: ${formatRupiah(game.betAmount)}</div>
                                <div class="${winStatus}">${winText}</div>
                            </div>
                        </div>
                    `;
                });
                
                historyList.innerHTML = historyHTML;
                
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }
        
        // ========== UPDATE BALANCE ==========
        function updateBalanceDisplay() {
            document.getElementById('balanceDisplay').textContent = formatRupiah(currentUser.balance || 0);
        }
        
        // ========== LOGOUT ==========
        async function logout() {
            if (!confirm('Yakin ingin keluar?')) return;
            
            try {
                // Update online status
                await db.ref('users/' + currentUser.userId + '/online').set(false);
                
                // Clear session
                clearSession();
                
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.href = 'login.html';
            }
        }
        
        // ========== TOAST ==========
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // ========== BUTTON UTILS ==========
        function lockButton(btnId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.disabled = true;
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '⏳ Proses...';
            }
        }
        
        function unlockButton(btnId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.disabled = false;
                if (btn.dataset.originalText) {
                    btn.innerHTML = btn.dataset.originalText;
                }
            }
        }
        
        // ========== AUTO REFRESH ==========
        setInterval(async () => {
            if (currentUser) {
                const session = await verifySession();
                if (session) {
                    currentUser = session;
                    updateBalanceDisplay();
                }
            }
        }, 10000);
    </script>
</body>
  </html>
