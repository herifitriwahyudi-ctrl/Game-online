<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>🐉 Dragons Hunter</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: url('background-dragon.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #0a1f14;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 31, 20, 0.6);
            z-index: -1;
            pointer-events: none;
        }

        .forest-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            bottom: 0;
            width: 120px; height: 200px;
            background: linear-gradient(180deg, #2d5a27, #1a3d15);
            border-radius: 10px 10px 0 0;
            animation: sway 5s ease-in-out infinite;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: -40px; left: -20px;
            width: 160px; height: 80px;
            background: linear-gradient(135deg, #3a7d30, #2d5a27);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .tree:nth-child(1) { left: 10px; }
        .tree:nth-child(2) { left: 15%; height: 240px; animation-delay: 1s; }
        .tree:nth-child(3) { right: 10%; height: 180px; animation-delay: 2s; }
        .tree:nth-child(4) { right: 20px; height: 260px; animation-delay: 3s; }
        .tree:nth-child(5) { left: 40%; height: 220px; animation-delay: 4s; }
        .tree:nth-child(6) { right: 40%; height: 200px; animation-delay: 5s; }

        .fireflies {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffe066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066;
            animation: fly 8s infinite;
        }

        .fireflies:nth-child(7) { top: 30%; left: 20%; animation-delay: 0s; }
        .fireflies:nth-child(8) { top: 50%; left: 80%; animation-delay: 2s; }
        .fireflies:nth-child(9) { top: 70%; left: 50%; animation-delay: 4s; }
        .fireflies:nth-child(10) { top: 40%; left: 70%; animation-delay: 6s; }
        .fireflies:nth-child(11) { top: 60%; left: 30%; animation-delay: 1s; }
        .fireflies:nth-child(12) { top: 20%; left: 60%; animation-delay: 3s; }
        .fireflies:nth-child(13) { top: 80%; left: 90%; animation-delay: 5s; }
        .fireflies:nth-child(14) { top: 45%; left: 10%; animation-delay: 7s; }

        .moon {
            position: absolute;
            top: 50px; right: 100px;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f, 0 0 80px rgba(241,196,15,0.3);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            25% { transform: translate(15px, -20px); opacity: 1; }
            50% { transform: translate(-10px, -35px); opacity: 0.6; }
            75% { transform: translate(20px, -15px); opacity: 0.8; }
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 40px #f1c40f; }
            to { box-shadow: 0 0 60px #f1c40f, 0 0 100px rgba(241,196,15,0.5); }
        }

        .game-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 30px;
            border: 4px solid #8b6914;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3);
            position: relative;
            z-index: 10;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 0;
            background: transparent;
            border-radius: 0;
            margin-left: -20px;
            margin-right: -20px;
        }

        .game-header img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            border-radius: 26px 26px 0 0;
            border-bottom: 4px solid #8b6914;
            display: block;
            margin: 0 auto;
        }

        .info-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 15px;
            background: linear-gradient(145deg, #3a2a15, #2a1a0e);
            border-radius: 50px;
            border: 2px solid #8b6914;
            margin: 10px auto 20px;
            max-width: 550px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-box {
            text-align: center;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-box label {
            font-size: 0.85em;
            color: #ffd700;
            margin-bottom: 0;
        }

        .info-box span {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        .topup-btn {
            background: linear-gradient(145deg, #00ff88, #00cc66);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,255,136,0.4);
            transition: all 0.3s ease;
            color: #1a1a1a;
        }

        .topup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,136,0.6);
        }

        .withdraw-btn {
            background: linear-gradient(145deg, #00bfff, #0080ff);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,191,255,0.4);
            transition: all 0.3s ease;
            color: #fff;
        }

        .withdraw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,191,255,0.6);
        }

        .logout-btn {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255,68,68,0.4);
            transition: all 0.3s ease;
            color: #fff;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,68,68,0.6);
        }

        .payline-btn {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 8px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
            text-decoration: none;
            display: inline-block;
        }

        .payline-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,215,0,0.6);
        }

        .roll-section {
            margin-bottom: 20px;
        }

        .roll-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            border: 3px solid #8b6914;
        }

        .roll-item {
            aspect-ratio: 1;
            border-radius: 10px;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border: 2px solid #8b6914;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .roll-item img,
        .roll-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .roll-item.new-item {
            animation: slideInFromLeft 0.5s ease;
        }

        @keyframes slideInFromLeft {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .roll-item.removed-item {
            animation: slideOutToRight 0.5s ease;
        }

        @keyframes slideOutToRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(50px); opacity: 0; }
        }

        .main-card-area {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .main-card {
            width: 200px;
            height: 260px;
            margin: 0 auto;
            background: linear-gradient(145deg, #4a3f35, #2a1f15);
            border-radius: 20px;
            border: 4px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .main-card.hidden-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            cursor: pointer;
        }

        .main-card.hidden-card::after {
            content: '?';
            font-size: 80px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            animation: pulseQuestion 1s infinite alternate;
        }

        @keyframes pulseQuestion {
            from { transform: scale(0.9); opacity: 0.7; }
            to { transform: scale(1.1); opacity: 1; }
        }

        .main-card.shuffling {
            animation: cardShuffle 0.8s ease-in-out;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        }

        .main-card.shuffling::after {
            content: '🔄';
            font-size: 60px;
            animation: spinIcon 0.8s linear infinite;
        }

        @keyframes cardShuffle {
            0% { transform: scale(1) rotateY(0deg); opacity: 1; }
            25% { transform: scale(0.8) rotateY(90deg); opacity: 0.5; }
            50% { transform: scale(0.6) rotateY(180deg); opacity: 0.3; }
            75% { transform: scale(0.8) rotateY(270deg); opacity: 0.5; }
            100% { transform: scale(1) rotateY(360deg); opacity: 1; }
        }

        @keyframes spinIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-card.revealing {
            animation: cardReveal 0.5s ease-out;
        }

        @keyframes cardReveal {
            0% { transform: scale(0.5) rotateY(180deg); opacity: 0; }
            50% { transform: scale(1.2) rotateY(90deg); opacity: 0.7; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        .main-card.win {
            border-color: #00ff88;
            box-shadow: 0 0 30px #00ff88, 0 0 60px rgba(0,255,136,0.5);
            animation: winGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes winGlow {
            from { box-shadow: 0 0 30px #00ff88, 0 0 60px rgba(0,255,136,0.3); }
            to { box-shadow: 0 0 50px #00ff88, 0 0 100px rgba(0,255,136,0.7), 0 0 150px rgba(0,255,136,0.3); }
        }

        .main-card.lose {
            border-color: #ff4444;
            box-shadow: 0 0 20px #ff4444, 0 0 40px rgba(255,68,68,0.3);
            animation: losePulse 1s ease-in-out infinite alternate;
        }

        @keyframes losePulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.95); opacity: 0.8; }
        }

        .main-card.revealed-card img,
        .main-card.revealed-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .result-message {
            min-height: 50px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .result-message.win {
            color: #00ff88;
            font-size: 1.4em;
            text-shadow: 0 0 15px rgba(0,255,136,0.6);
        }

        .result-message.lose {
            color: #ff6666;
            font-size: 1.2em;
        }

        .count-up {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            animation: countUpPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes countUpPulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.1); opacity: 0.9; }
        }

        .win-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0,255,136,0.8);
            margin-bottom: 10px;
            animation: titlePulse 0.5s ease-in-out infinite alternate;
        }

        .win-title.big-win { color: #00ff88; text-shadow: 0 0 30px rgba(0,255,136,1); }
        .win-title.super-win { color: #00bfff; text-shadow: 0 0 30px rgba(0,191,255,1); }
        .win-title.epic-win { color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,1); }
        .win-title.ultimate-win {
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255,68,68,1);
            animation: ultimatePulse 0.3s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @keyframes ultimatePulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .open-card-btn {
            display: block;
            margin: 20px auto 0;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            padding: 12px 50px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
            transition: all 0.3s ease;
            color: #3d1e00;
            text-align: center;
        }

        .open-card-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.6);
        }

        .bet-form {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .bet-form h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .bet-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: start;
        }

        .bet-column {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
        }

        .bet-column h4 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .form-row label {
            font-size: 0.85em;
            color: #ffd700;
            min-width: 60px;
        }

        .form-row select {
            flex: 1;
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-size: 0.9em;
        }

        .form-row select:focus {
            outline: none;
            border-color: #ffd700;
        }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        .bet-btn, .bet-btn-large {
            min-width: 45px;
            height: 32px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 8px;
            color: #3d1e00;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 10px;
        }

        .bet-input {
            width: 90px;
            text-align: center;
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 8px;
            padding: 6px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
        }

        .quick-bet-container {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-bet-btn {
            flex: 1;
            padding: 5px;
            background: #8b6914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .quick-bet-btn:hover {
            background: #ffd700;
            color: #3d1e00;
        }

        .max-bet-btn {
            width: 100%;
            margin-top: 5px;
            padding: 5px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .max-bet-btn:hover { background: #ff6666; }

        .fireworks-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explosion 1.5s ease-out forwards;
        }

        @keyframes explosion {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        .topup-modal, .withdraw-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .topup-modal.show, .withdraw-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .topup-content, .withdraw-content {
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 20px;
            border: 3px solid #8b6914;
            padding: 20px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .topup-content h2, .withdraw-content h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .topup-options, .withdraw-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .withdraw-options { grid-template-columns: repeat(2, 1fr); }

        .topup-option, .withdraw-option {
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .topup-option.selected, .withdraw-option.selected {
            border-color: #00ff88;
            background: rgba(0,255,136,0.1);
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .topup-option .amount, .withdraw-option .amount {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
        }

        .custom-amount, .custom-withdraw {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .custom-amount input, .custom-withdraw input {
            flex: 1;
            background: #1a1208;
            border: 2px solid #8b6914;
            border-radius: 10px;
            padding: 10px;
            color: #fff;
        }

        .pay-btn, .submit-withdraw-btn {
            background: linear-gradient(145deg, #00ff88, #00cc66);
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
            transition: all 0.3s ease;
            color: #1a1a1a;
            margin-bottom: 10px;
            width: 100%;
        }

        .submit-withdraw-btn {
            background: linear-gradient(145deg, #00bfff, #0080ff);
            color: #fff;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 10px;
            color: #ff4444;
            cursor: pointer;
            width: 100%;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .loading-overlay.show { display: flex; }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.9em;
            z-index: 99999;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 90%;
            border: 2px solid #ffd700;
        }

        .toast.show {
            display: block;
            animation: slideDown 0.3s ease;

        async function hashPassword(password) {
          try {
            if (window.crypto && window.crypto.subtle) {
              const encoder = new TextEncoder();
              const data = encoder.encode(password + PASSWORD_SALT);
              const hashBuffer = await crypto.subtle.digest('SHA-256', data);
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }
            let hash = 0;
            const saltedPassword = password + PASSWORD_SALT;
            for (let i = 0; i < saltedPassword.length; i++) {
              const char = saltedPassword.charCodeAt(i);
              hash = ((hash << 5) - hash) + char;
              hash = hash & hash;
            }
            return hash.toString(16);
          } catch (error) {
            console.error('Hash error:', error);
            throw error;
          }
        }

          try {
            const session = sessionStorage.getItem('dragonsHunterSession');
            if (session) return JSON.parse(session);
            const localSession = localStorage.getItem('dragonsHunterActiveUser');
            return localSession ? JSON.parse(localSession) : null;
          } catch (error) {
            console.error('Error parsing session:', error);

        }

        async function verifySession() {
          const session = getSession();
          if (!session || !session.userId) return null;
          try {
            const snapshot = await db.ref('users/' + session.userId).once('value');
            if (snapshot.exists()) {
              const userData = snapshot.val();
              if (userData.status === 'banned' || userData.status === 'deleted') {
                clearSession();
                return null;
              }
              session.balance = userData.balance;
              session.role = userData.role || 'user';
              sessionStorage.setItem('dragonsHunterSession', JSON.stringify(session));
              localStorage.setItem('dragonsHunterActiveUser', JSON.stringify(session));

                return;
            }

            const selectedAnimal = document.getElementById('animalSelect').value;
            const selectedBonus = document.getElementById('bonusSelect').value;
            const animalBetAmount = parseInt(document.getElementById('animalBet').value) || 0;
            const bonusBetAmount = parseInt(document.getElementById('bonusBet').value) || 0;

            if (!selectedAnimal && !selectedBonus) {
                showToast('Pilih Hewan atau Naga/Harimau!', 'error');
                return;
            }

            let totalBet = 0;
            let bets = [];

            if (selectedAnimal) {
                if (animalBetAmount < 100) return showToast('Minimal taruhan hewan adalah 100!', 'error');
                bets.push({ type: 'hewan', animalName: selectedAnimal, amount: animalBetAmount });
                totalBet += animalBetAmount;
            }

            if (selectedBonus) {
                if (bonusBetAmount < 2000) return showToast('Minimal taruhan Naga/Harimau adalah 2000!', 'error');
                bets.push({ type: selectedBonus.toLowerCase(), animalName: selectedBonus, amount: bonusBetAmount });
                totalBet += bonusBetAmount;
            }

            if (totalBet > balance) {
                showToast('⚠️ Saldo tidak mencukupi!', 'error');
                openTopUp();
                return;
            }

            balance -= totalBet;
            saveBalance();
            updateBalanceDisplay();

            // Penentuan hasil acak
            const isBonus = Math.random() < 0.05;
            const resultAnimal = isBonus 
                ? bonusAnimals[Math.floor(Math.random() * bonusAnimals.length)]
                : normalAnimals[Math.floor(Math.random() * normalAnimals.length)];

            let totalWinAmount = 0;
            let winningDetails = [];

            // Pengecekan Kemenangan Konsisten
            bets.forEach(bet => {
                if (bet.animalName === resultAnimal.name) {
                    const winAmt = Math.min(bet.amount * resultAnimal.multiplier, rtpConfig.maxWin);
                    totalWinAmount += winAmt;
                    winningDetails.push({ animalName: bet.animalName, winAmount: winAmt });
                }
            });

            if (totalWinAmount > 0) {
                balance += totalWinAmount;
                saveBalance();
                updateBalanceDisplay();
            }

            isAnimating = true;
            runCardAnimation(resultAnimal, totalWinAmount > 0, totalWinAmount, winningDetails);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function logout() {
            stopBgSound();
            clearSession();
            window.location.href = 'login.html';
        }

        async function init() {
            document.addEventListener('click', function initAudioOnce() {
                initAudio();
                startBgSound();
                document.removeEventListener('click', initAudioOnce);
            });

            const session = await verifySession();
            if (session && session.userId) {
                currentUserId = session.userId;
                currentUserData = session;

                db.ref('users/' + currentUserId + '/balance').on('value', (snapshot) => {
                    balance = snapshot.val() || 0;
                    updateBalanceDisplay();
                });
            } else {
                window.location.href = 'login.html';
                return;
            }

            db.ref('history').on('value', (snapshot) => {
                history = snapshot.val() || normalAnimals.slice(0, 20);
                generateBoard();
            });

            generateDropdowns();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
