<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Dragons Hunter</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b6914">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; }
        
        .login-container {
            max-width: 350px; width: 90%; margin: 80px auto; padding: 25px;
            background: #16213e; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-container h2 { color: #e94560; margin-bottom: 20px; }
        .login-container input {
            width: 100%; background: #0f3460; border: 1px solid #e94560;
            border-radius: 8px; padding: 10px; color: #fff; margin-bottom: 15px;
        }
        .login-btn {
            width: 100%; background: #e94560; border: none; padding: 12px;
            border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold;
        }
        .message { margin-top: 10px; padding: 8px; border-radius: 5px; display: none; }
        .message.error { background: rgba(255,68,68,0.2); border: 1px solid #ff4444; color: #ff6666; display: block; }
        .message.success { background: rgba(0,255,136,0.2); border: 1px solid #00ff88; color: #00ff88; display: block; }

        .dashboard-container {
            max-width: 1200px; width: 95%; margin: 20px auto; padding: 15px;
            background: #16213e; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: none;
        }
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .dashboard-header h2 { color: #e94560; }
        .logout-btn {
            background: #ff4444; border: none; padding: 8px 15px;
            border-radius: 8px; cursor: pointer; color: #fff;
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px; margin-bottom: 20px;
        }
        .stat-box {
            background: #0f3460; border-radius: 10px; padding: 15px; text-align: center;
        }
        .stat-box h3 { color: #aaa; font-size: 0.8em; margin-bottom: 5px; }
        .stat-box .value { font-size: 1.4em; font-weight: bold; }

        .tabs {
            display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .tab-btn {
            background: #0f3460; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; color: #fff;
            font-size: 0.9em;
        }
        .tab-btn.active {
            background: #e94560;
        }

        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar input {
            flex: 1; background: #0f3460; border: 1px solid #e94560;
            border-radius: 5px; padding: 10px; color: #fff;
        }
        .refresh-btn {
            background: #0f3460; border: 1px solid #e94560;
            color: #fff; padding: 10px 15px; border-radius: 5px; cursor: pointer;
        }

        .table-wrapper { overflow-x: auto; border-radius: 10px; border: 1px solid #e94560; max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(233,69,96,0.3); font-size: 0.85em; }
        th { background: #0f3460; color: #e94560; position: sticky; top: 0; }
        tr:hover { background: rgba(255,255,255,0.05); }

        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 0.75em; font-weight: bold; }
        .status-pending { background: rgba(255,215,0,0.2); border: 1px solid #ffd700; color: #ffd700; }
        .status-approved { background: rgba(0,255,136,0.2); border: 1px solid #00ff88; color: #00ff88; }
        .status-rejected { background: rgba(255,68,68,0.2); border: 1px solid #ff4444; color: #ff4444; }

        .action-btns { display: flex; gap: 5px; }
        .approve-btn, .reject-btn, .edit-btn, .delete-btn { 
            border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8em; 
        }
        .approve-btn { background: #00ff88; color: #1a1a1a; }
        .reject-btn { background: #ff4444; color: #fff; }
        .edit-btn { background: #e94560; color: #fff; }
        .delete-btn { background: #ff4444; color: #fff; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #16213e; border-radius: 15px;
            padding: 25px; text-align: center; max-width: 350px; width: 90%;
        }
        .modal-content h3 { color: #e94560; margin-bottom: 15px; }
        .modal-content input {
            width: 100%; background: #0f3460; border: 1px solid #e94560;
            border-radius: 5px; padding: 10px; color: #fff; margin-bottom: 15px;
        }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .modal-save { background: #00ff88; color: #1a1a1a; }
        .modal-close { background: #ff4444; color: #fff; }

        .toast {
            position: fixed; top: 20px; right: 20px; background: #16213e;
            border: 1px solid #e94560; border-radius: 8px; padding: 12px 20px;
            z-index: 99999; transform: translateX(350px); transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-color: #00ff88; color: #00ff88; }
        .toast.error { border-color: #ff4444; color: #ff6666; }
        .toast.info { border-color: #e94560; color: #e94560; }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="loginForm">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Password Admin">
        <button class="login-btn" id="loginBtn" onclick="adminLogin()">Masuk</button>
        <div class="message" id="loginMsg"></div>
        <p style="color: #666; margin-top: 10px; font-size: 0.75em;">Default: admin123</p>
    </div>

    <!-- Dashboard -->
    <div class="dashboard-container" id="dashboard">
        <div class="dashboard-header">
            <h2>Dashboard Admin</h2>
            <button class="logout-btn" onclick="adminLogout()">Keluar</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-box"><h3>Pengguna</h3><div class="value" id="totalUsers">0</div></div>
            <div class="stat-box"><h3>Total Saldo</h3><div class="value" id="totalBalance">Rp 0</div></div>
            <div class="stat-box"><h3>Transaksi</h3><div class="value" id="totalTransactions">0</div></div>
            <div class="stat-box"><h3>Pending</h3><div class="value" id="totalPending" style="color:#ffd700;">0</div></div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('transactions')">Transaksi</button>
            <button class="tab-btn" onclick="showTab('users')">Users</button>
        </div>

        <!-- Transactions Section -->
        <div id="transactionsSection">
            <div class="search-bar">
                <input type="text" id="searchTransactions" placeholder="Cari transaksi..." oninput="filterTransactions()">
                <button class="refresh-btn" onclick="refreshData()">Refresh</button>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>User</th><th>Jenis</th><th>Jumlah</th>
                            <th>Status</th><th>Tanggal</th><th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Users Section -->
        <div id="usersSection" style="display:none;">
            <div class="search-bar">
                <input type="text" id="searchUsers" placeholder="Cari username / nama..." oninput="filterUsers()">
                <button class="refresh-btn" onclick="refreshData()">Refresh</button>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No</th><th>Username</th><th>Nama</th>
                            <th>Saldo</th><th>Status</th><th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Edit -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>Edit Saldo</h3>
            <div class="modal-info">
                <p><strong>Username:</strong> <span id="editUsername" style="color:#fff;"></span></p>
                <p><strong>Saldo Saat Ini:</strong> <span id="editCurrentBalance" style="color:#00ff88;"></span></p>
            </div>
            <label>Jumlah (Boleh Negatif)</label>
            <input type="number" id="editAmount" placeholder="Contoh: 50000 / -10000">
            <div class="modal-btns">
                <button class="modal-save" onclick="saveEdit()">Simpan</button>
                <button class="modal-close" onclick="closeModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let editingUserId = null;
        let allUsers = [];
        let allTransactions = [];
        let usersRef = null;
        let transactionsRef = null;
        let currentTab = 'transactions';

        document.addEventListener('DOMContentLoaded', async () => {
            await setupAdminPassword();
            
            const adminSession = sessionStorage.getItem('adminSession');
            if (adminSession && JSON.parse(adminSession).role === 'admin') {
                showDashboard();
            } else {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        async function setupAdminPassword() {
            try {
                const snapshot = await db.ref('adminConfig/passwordHash').once('value');
                if (!snapshot.exists()) {
                    const defaultHash = await hashPassword('admin123');
                    await db.ref('adminConfig/passwordHash').set(defaultHash);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function adminLogin() {
            const pass = document.getElementById('adminPass').value;
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');
            
            msg.className = 'message';
            msg.textContent = '';
            
            if (!pass) {
                msg.textContent = 'Password wajib diisi!';
                msg.className = 'message error';
                return;
            }
            
            btn.disabled = true;
            
            try {
                const hashedPass = await hashPassword(pass);
                const snapshot = await db.ref('adminConfig/passwordHash').once('value');
                const storedHash = snapshot.val();
                
                if (storedHash === hashedPass) {
                    sessionStorage.setItem('adminSession', JSON.stringify({ role: 'admin', loginTime: Date.now() }));
                    msg.textContent = 'Login berhasil!';
                    msg.className = 'message success';
                    setTimeout(showDashboard, 1000);
                } else {
                    throw new Error('Password salah!');
                }
            } catch (error) {
                msg.textContent = error.message;
                msg.className = 'message error';
                btn.disabled = false;
            }
        }

        function adminLogout() {
            if (confirm('Yakin keluar?')) {
                sessionStorage.removeItem('adminSession');
                if (usersRef) usersRef.off();
                if (transactionsRef) transactionsRef.off();
                window.location.reload();
            }
        }

        function showDashboard() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadUsers();
            loadTransactions();
            updateStats();
        }

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'transactions') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('transactionsSection').style.display = 'block';
                document.getElementById('usersSection').style.display = 'none';
                loadTransactions();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('transactionsSection').style.display = 'none';
                document.getElementById('usersSection').style.display = 'block';
                loadUsers();
            }
        }

        function loadUsers() {
            if (usersRef) usersRef.off();
            usersRef = db.ref('users');
            usersRef.on('value', snapshot => {
                allUsers = [];
                snapshot.forEach(child => {
                    allUsers.push({ id: child.key, ...child.val() });
                });
                renderUsersTable();
                updateStats();
            });
        }

        function loadTransactions() {
            if (transactionsRef) transactionsRef.off();
            transactionsRef = db.ref('transactions');
            transactionsRef.on('value', snapshot => {
                allTransactions = [];
                if (snapshot.exists()) {
                    snapshot.forEach(userChild => {
                        const userTrans = userChild.val();
                        if (userTrans) {
                            Object.values(userTrans).forEach(t => {
                                allTransactions.push({ userId: userChild.key, ...t });
                            });
                        }
                    });
                }
                renderTransactionsTable();
                updateStats();
            });
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = allUsers.length;
            const totalBalance = allUsers.reduce((s, u) => s + (u.balance || 0), 0);
            document.getElementById('totalBalance').textContent = formatRupiah(totalBalance);
            document.getElementById('totalTransactions').textContent = allTransactions.length;
            document.getElementById('totalPending').textContent = allTransactions.filter(t => t.status === 'pending').length;
        }

        function formatRupiah(number) {
            return 'Rp ' + number.toLocaleString('id-ID');
        }

        function renderTransactionsTable() {
            const search = document.getElementById('searchTransactions').value.toLowerCase();
            const filtered = allTransactions.filter(t => 
                (t.username || '').toLowerCase().includes(search) ||
                (t.transactionId || '').toLowerCase().includes(search) ||
                (t.type || '').toLowerCase().includes(search)
            );

            const tbody = document.getElementById('transactionsTableBody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#aaa;">Tidak ada transaksi</td></tr>';
                return;
            }

            filtered.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).forEach(t => {
                const statusBadge = getStatusBadge(t.status);
                const actionBtns = getActionButtons(t);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><small>${t.transactionId || '-'}</small></td>
                    <td>${t.username || '-'}</td>
                    <td>${t.type === 'topup' ? '💳 Top Up' : '🏦 Withdraw'}</td>
                    <td style="color:${t.type === 'topup' ? '#00ff88' : '#ff6666'};font-weight:bold;">${formatRupiah(t.amount || 0)}</td>
                    <td>${statusBadge}</td>
                    <td>${formatDate(t.timestamp)}</td>
                    <td>${actionBtns}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function getStatusBadge(status) {
            if (status === 'pending') return '<span class="status-badge status-pending">Pending</span>';
            if (status === 'approved') return '<span class="status-badge status-approved">Approved</span>';
            if (status === 'rejected') return '<span class="status-badge status-rejected">Rejected</span>';
            return '<span class="status-badge">' + status + '</span>';
        }

        function getActionButtons(t) {
            if (t.status === 'pending') {
                return `
                    <div class="action-btns">
                        <button class="approve-btn" onclick="approveTransaction('${t.userId}', '${t.transactionId || t.id}')">Approve</button>
                        <button class="reject-btn" onclick="rejectTransaction('${t.userId}', '${t.transactionId || t.id}')">Reject</button>
                    </div>
                `;
            }
            return '';
        }

        async function approveTransaction(userId, transactionId) {
            if (!confirm('Approve transaksi ini?')) return;
            
            try {
                // Ambil data transaksi
                const transRef = db.ref('transactions/' + userId + '/' + transactionId);
                const snapshot = await transRef.once('value');
                const transaction = snapshot.val();
                
                if (!transaction) {
                    showToast('Transaksi tidak ditemukan', 'error');
                    return;
                }
                
                // Update status transaksi
                await transRef.update({ status: 'approved' });
                
                // Jika top up, tambahkan saldo user
                if (transaction.type === 'topup') {
                    const userRef = db.ref('users/' + userId + '/balance');
                    await userRef.transaction((currentBalance) => {
                        return (currentBalance || 0) + transaction.amount;
                    });
                    
                    showToast('Top up disetujui! Saldo ditambahkan.', 'success');
                } else {
                    // Jika withdraw, kurangi saldo user
                    const userRef = db.ref('users/' + userId + '/balance');
                    const userSnap = await userRef.once('value');
                    const currentBalance = userSnap.val() || 0;
                    
                    if (currentBalance >= transaction.amount) {
                        await userRef.set(currentBalance - transaction.amount);
                        showToast('Withdraw disetujui! Dana dikirim.', 'success');
                    } else {
                        await transRef.update({ status: 'rejected' });
                        showToast('Saldo tidak cukup, transaksi ditolak', 'error');
                    }
                }
                
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        async function rejectTransaction(userId, transactionId) {
            if (!confirm('Tolak transaksi ini?')) return;
            
            try {
                await db.ref('transactions/' + userId + '/' + transactionId).update({ status: 'rejected' });
                showToast('Transaksi ditolak', 'success');
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        function renderUsersTable() {
            const search = document.getElementById('searchUsers').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.username || '').toLowerCase().includes(search) ||
                (u.nama || '').toLowerCase().includes(search)
            );

            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#aaa;">Tidak ada user</td></tr>';
                return;
            }

            filtered.forEach((user, i) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td><strong>${escapeHtml(user.username || '-')}</strong></td>
                    <td>${escapeHtml(user.nama || '-')}</td>
                    <td style="color:#00ff88;font-weight:bold;">${formatRupiah(user.balance || 0)}</td>
                    <td>${user.online ? '<span style="color:#00ff88;">Online</span>' : '<span style="color:#888;">Offline</span>'}</td>
                    <td>
                        <button class="edit-btn" onclick="openEdit('${user.id}')">Edit</button>
                        <button class="delete-btn" onclick="deleteUser('${user.id}')">Hapus</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function filterTransactions() { renderTransactionsTable(); }
        function filterUsers() { renderUsersTable(); }

        function openEdit(userId) {
            editingUserId = userId;
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            document.getElementById('editUsername').textContent = user.username || user.nama;
            document.getElementById('editCurrentBalance').textContent = formatRupiah(user.balance || 0);
            document.getElementById('editAmount').value = '';
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            editingUserId = null;
        }

        async function saveEdit() {
            if (!editingUserId) return;
            const amount = parseInt(document.getElementById('editAmount').value);
            if (isNaN(amount) || amount === 0) return;

            if (!confirm(`Ubah saldo ${formatRupiah(amount)}?`)) return;

            try {
                const snap = await db.ref('users/' + editingUserId + '/balance').once('value');
                const current = snap.val() || 0;
                const newBalance = current + amount;
                if (newBalance < 0) throw new Error('Saldo tidak boleh negatif');

                await db.ref('users/' + editingUserId + '/balance').set(newBalance);
                await db.ref('transactions/' + editingUserId).push({
                    type: 'admin_edit', 
                    amount: amount, 
                    timestamp: firebase.database.ServerValue.TIMESTAMP, 
                    status: 'approved'
                });

                showToast('Saldo diubah!', 'success');
                closeModal();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function deleteUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            if (!confirm(`Hapus akun "${user.username}"?`)) return;

            try {
                await db.ref('users/' + userId).remove();
                await db.ref('transactions/' + userId).remove();
                showToast('Akun dihapus!', 'success');
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        function refreshData() {
            loadUsers();
            loadTransactions();
            showToast('Data di-refresh!', 'success');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        setInterval(() => {
            if (allUsers.length > 0) loadUsers();
            loadTransactions();
        }, 30000);
    </script>
</body>
                                                      </html>
