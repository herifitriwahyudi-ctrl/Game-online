<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Admin Panel - Dragons Hunter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: url('background-dragon.png') no-repeat center center fixed; background-size: cover; background-color: #0a1f14; min-height: 100vh; overflow-x: hidden; color: #fff; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 31, 20, 0.85); z-index: -1; pointer-events: none; }

        .login-container { max-width: 400px; width: 90%; margin: 100px auto; padding: 30px; background: linear-gradient(145deg, #2a1f0e, #1a1208); border-radius: 30px; border: 4px solid #8b6914; box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3); text-align: center; }
        .login-container h2 { color: #ffd700; margin-bottom: 20px; font-size: 2em; }
        .login-container input { width: 100%; background: #1a1208; border: 2px solid #8b6914; border-radius: 10px; padding: 12px; color: #fff; font-size: 1em; margin-bottom: 15px; }
        .login-btn { width: 100%; background: linear-gradient(145deg, #ffd700, #ffaa00); border: none; padding: 15px; font-size: 1.2em; font-weight: bold; border-radius: 50px; cursor: pointer; color: #3d1e00; }
        .message { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 0.9em; display: none; }
        .message.error { background: rgba(255,68,68,0.2); border: 2px solid #ff4444; color: #ff6666; display: block; }

        .dashboard-container { max-width: 1200px; width: 95%; margin: 20px auto; padding: 20px; background: linear-gradient(145deg, #2a1f0e, #1a1208); border-radius: 30px; border: 4px solid #8b6914; box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3); position: relative; z-index: 10; display: none; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .dashboard-header h2 { color: #ffd700; font-size: 1.8em; }
        .logout-btn { background: linear-gradient(145deg, #ff4444, #cc0000); border: none; padding: 10px 20px; font-size: 0.9em; font-weight: bold; border-radius: 50px; cursor: pointer; color: #fff; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: rgba(255,255,255,0.05); border: 2px solid #8b6914; border-radius: 15px; padding: 20px; text-align: center; }
        .stat-box h3 { color: #ffd700; font-size: 0.9em; margin-bottom: 10px; }
        .stat-box .value { font-size: 2em; font-weight: bold; color: #fff; }

        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; background: #1a1208; border: 2px solid #8b6914; border-radius: 10px; padding: 12px; color: #fff; font-size: 1em; }

        .table-wrapper { overflow-x: auto; border-radius: 15px; border: 2px solid #8b6914; max-height: 600px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.3); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(139,105,20,0.3); font-size: 0.9em; white-space: nowrap; }
        th { background: rgba(255,215,0,0.1); color: #ffd700; font-weight: bold; position: sticky; top: 0; z-index: 2; }
        tr:hover { background: rgba(255,255,255,0.05); }

        .method-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        .method-ewallet { background: rgba(0,191,255,0.2); border: 1px solid #00bfff; color: #00bfff; }
        .method-bank { background: rgba(255,215,0,0.2); border: 1px solid #ffd700; color: #ffd700; }
        .copy-btn { background: rgba(255,255,255,0.1); border: 1px solid #aaa; color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8em; margin-left: 5px; }

        .action-btns { display: flex; gap: 5px; }
        .edit-btn, .delete-btn { border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .edit-btn { background: linear-gradient(145deg, #ffd700, #ffaa00); color: #3d1e00; }
        .delete-btn { background: linear-gradient(145deg, #ff4444, #cc0000); color: #fff; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: linear-gradient(145deg, #2a1f0e, #1a1208); border-radius: 30px; border: 4px solid #8b6914; padding: 30px; text-align: center; max-width: 400px; width: 90%; }
        .modal-content h3 { color: #ffd700; margin-bottom: 20px; font-size: 1.5em; }
        .modal-content input { width: 100%; background: #1a1208; border: 2px solid #8b6914; border-radius: 10px; padding: 12px; color: #fff; font-size: 1em; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; border: none; padding: 12px; border-radius: 50px; cursor: pointer; font-size: 1em; font-weight: bold; }
        .modal-save { background: linear-gradient(145deg, #00ff88, #00cc66); color: #1a1a1a; }
        .modal-close { background: rgba(255,255,255,0.1); border: 2px solid #ff4444 !important; color: #ff4444; }
    </style>
</head>
<body>
    <div class="login-container" id="loginForm">
        <h2>🛡️ Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Masukkan Password Admin">
        <button class="login-btn" onclick="adminLogin()">Masuk</button>
        <div class="message" id="loginMsg"></div>
    </div>

    <div class="dashboard-container" id="dashboard">
        <div class="dashboard-header">
            <h2>🛡️ Dashboard Admin</h2>
            <button class="logout-btn" onclick="adminLogout()">🚪 Keluar</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><h3>Total Pengguna</h3><div class="value" id="totalUsers">0</div></div>
            <div class="stat-box"><h3>Total Saldo</h3><div class="value" id="totalBalance">Rp 0</div></div>
            <div class="stat-box"><h3>Pengguna E-Wallet</h3><div class="value" id="totalEwallet">0</div></div>
            <div class="stat-box"><h3>Pengguna Bank</h3><div class="value" id="totalBank">0</div></div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Cari username atau nama..." oninput="renderTable()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>No</th><th>Username (Email)</th><th>Nama</th><th>No WhatsApp</th><th>Metode WD</th>
                        <th>Nomor Tujuan</th><th>Nama Pemilik</th><th>Saldo</th><th>Terdaftar</th><th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>✏️ Edit Saldo</h3>
            <label>Username: <span id="editUsername" style="color: #fff;"></span></label><br><br>
            <label>Masukkan Jumlah (Boleh Negatif)</label>
            <input type="number" id="editAmount" placeholder="Contoh: 50000 atau -10000">
            <div class="modal-btns">
                <button class="modal-save" onclick="saveEdit()">💾 Simpan</button>
                <button class="modal-close" onclick="closeModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let editingUserId = null;

        // Login Admin (Password hardcoded)
        function adminLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                showDashboard();
            } else {
                document.getElementById('loginMsg').textContent = '❌ Password admin salah!';
                document.getElementById('loginMsg').className = 'message error';
            }
        }

        function adminLogout() { localStorage.removeItem('adminLoggedIn'); window.location.reload(); }

        function showDashboard() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadUsers();
        }

        // Load Users dari Firestore
        function loadUsers() {
            db.collection('users').get().then((querySnapshot) => {
                let users = [];
                querySnapshot.forEach((doc) => { users.push({ id: doc.id, ...doc.data() }); });
                window.allUsers = users;
                renderTable();
            });
        }

        // Render Tabel & Statistik
        function renderTable() {
            let users = window.allUsers || [];
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = users.filter(user => (user.email || '').toLowerCase().includes(searchTerm) || (user.nama || '').toLowerCase().includes(searchTerm));

            document.getElementById('totalUsers').textContent = users.length;
            const totalBalance = users.reduce((sum, user) => sum + (user.balance || 0), 0);
            document.getElementById('totalBalance').textContent = 'Rp ' + totalBalance.toLocaleString('id-ID');
            document.getElementById('totalEwallet').textContent = users.filter(user => user.withdrawMethod === 'E-Wallet').length;
            document.getElementById('totalBank').textContent = users.filter(user => user.withdrawMethod === 'Rekening Bank').length;

            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            if (filteredUsers.length === 0) { tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 20px;">Tidak ada user ditemukan</td></tr>'; return; }

            filteredUsers.forEach((user, index) => {
                const date = user.createdAt ? new Date(user.createdAt.seconds * 1000).toLocaleDateString('id-ID') : '-';
                let methodBadge = '-';
                if (user.withdrawMethod === 'E-Wallet') methodBadge = '<span class="method-badge method-ewallet">📱 E-Wallet</span>';
                else if (user.withdrawMethod === 'Rekening Bank') methodBadge = '<span class="method-badge method-bank">🏦 Bank</span>';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.email || '-'}</td>
                    <td>${user.nama || '-'}</td>
                    <td>${user.noWhatsapp || '-'}</td>
                    <td>${methodBadge}</td>
                    <td>${user.withdrawAccount || '-'} ${user.withdrawAccount ? `<button class="copy-btn" onclick="copyText('${user.withdrawAccount}')">📋</button>` : ''}</td>
                    <td>${user.withdrawName || '-'}</td>
                    <td>Rp ${(user.balance || 0).toLocaleString('id-ID')}</td>
                    <td>${date}</td>
                    <td>
                        <div class="action-btns">
                            <button class="edit-btn" onclick="openEdit('${user.id}')">✏️ Edit</button>
                            <button class="delete-btn" onclick="deleteUser('${user.id}')">🗑️ Hapus</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function copyText(text) { navigator.clipboard.writeText(text).then(() => alert('✅ Nomor disalin: ' + text)); }

        // Edit Saldo
        function openEdit(userId) {
            editingUserId = userId;
            const user = window.allUsers.find(u => u.id === userId);
            document.getElementById('editUsername').textContent = user.email;
            document.getElementById('editAmount').value = '';
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() { document.getElementById('editModal').classList.remove('show'); editingUserId = null; }

        function saveEdit() {
            if (!editingUserId) return;
            const amount = parseInt(document.getElementById('editAmount').value);
            if (isNaN(amount)) return;

            const userRef = db.collection('users').doc(editingUserId);
            userRef.get().then((doc) => {
                const currentBalance = doc.data().balance || 0;
                let newBalance = currentBalance + amount;
                if (newBalance < 0) newBalance = 0;
                userRef.update({ balance: newBalance }).then(() => {
                    alert('✅ Saldo berhasil diubah!');
                    closeModal();
                    loadUsers();
                });
            });
        }

        // Hapus User
        function deleteUser(userId) {
            if (!confirm('Yakin ingin menghapus akun ini?')) return;
            db.collection('users').doc(userId).delete().then(() => {
                alert('🗑️ Akun dihapus!');
                loadUsers();
            });
        }

        // Init
        function init() {
            if (localStorage.getItem('adminLoggedIn') === 'true') showDashboard();
            else { document.getElementById('loginForm').style.display = 'block'; document.getElementById('dashboard').style.display = 'none'; }
        }
        init();
    </script>
</body>
</html>
