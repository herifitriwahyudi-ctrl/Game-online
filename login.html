<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Login - Dragons Hunter</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b6914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dragons Hunter">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Georgia', serif; 
            background: url('background-dragon.png') no-repeat center center fixed; 
            background-size: cover;
            background-position: center center;
            background-color: #0a1f14; 
            min-height: 100vh; 
            overflow-x: hidden; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        body::before { 
            content: ''; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(10, 31, 20, 0.7); 
            z-index: -1; 
            pointer-events: none; 
        }
        
        /* Audio Element */
        .audio-intro {
            display: none;
        }
        
        /* Intro Video */
        .intro-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #000; 
            z-index: 99999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 1.5s ease, visibility 1.5s ease; 
        }
        
        .intro-overlay.hidden { 
            opacity: 0; 
            visibility: hidden;
            pointer-events: none; 
        }
        
        .intro-video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .intro-overlay video { 
            max-height: 100vh;
            max-width: 100vw;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 0;
        }
        
        .intro-overlay .skip-btn { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(255,255,255,0.2); 
            border: 2px solid #fff; 
            color: #fff; 
            padding: 12px 30px; 
            font-size: 1em; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            z-index: 2;
            backdrop-filter: blur(10px);
        }
        
        .intro-overlay .skip-btn:hover { 
            background: rgba(255,255,255,0.4); 
            transform: scale(1.05); 
        }
        
        /* Progress Bar Intro */
        .intro-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            width: 0%;
            transition: width 0.1s linear;
        }
        
        /* Login Container */
        .login-container { 
            max-width: 400px; 
            width: 90%; 
            margin: 20px; 
            padding: 30px; 
            background: linear-gradient(145deg, #2a1f0e, #1a1208); 
            border-radius: 30px; 
            border: 4px solid #8b6914; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3); 
            text-align: center; 
            position: relative; 
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }
        
        .login-container.visible { 
            opacity: 1;
            transform: translateY(0);
        }
        
        .login-container h2 { 
            color: #ffd700; 
            margin-bottom: 10px; 
            font-size: 2em; 
            text-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .login-container p { 
            color: #aaa; 
            margin-bottom: 25px; 
            font-size: 0.9em; 
        }
        
        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        
        .input-group label { 
            display: block; 
            color: #ffd700; 
            margin-bottom: 5px; 
            font-size: 0.85em; 
        }
        
        .input-group input { 
            width: 100%; 
            background: #1a1208; 
            border: 2px solid #8b6914; 
            border-radius: 10px; 
            padding: 12px; 
            color: #fff; 
            font-size: 1em; 
            transition: all 0.3s ease; 
        }
        
        .input-group input:focus { 
            outline: none; 
            border-color: #ffd700; 
            box-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .login-btn { 
            width: 100%; 
            background: linear-gradient(145deg, #ffd700, #ffaa00); 
            border: none; 
            padding: 15px; 
            font-size: 1.2em; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(255,215,0,0.4); 
            transition: all 0.3s ease; 
            color: #3d1e00; 
            margin-top: 10px; 
        }
        
        .login-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(255,215,0,0.6); 
        }
        
        .login-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none; 
        }
        
        .register-link { 
            display: block; 
            margin-top: 20px; 
            color: #ffd700; 
            text-decoration: none; 
            font-size: 0.9em; 
        }
        
        .register-link:hover { text-decoration: underline; }
        
        .message { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.9em; 
            display: none; 
        }
        
        .message.error { 
            background: rgba(255,68,68,0.2); 
            border: 2px solid #ff4444; 
            color: #ff6666; 
            display: block; 
        }
        
        .message.success { 
            background: rgba(0,255,136,0.2); 
            border: 2px solid #00ff88; 
            color: #00ff88; 
            display: block; 
        }
        
        .caps-lock-warning { 
            display: none; 
            color: #ffaa00; 
            font-size: 0.8em; 
            margin-top: 5px; 
        }
        
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .login-container { margin: 10px; padding: 20px; }
            .login-container h2 { font-size: 1.5em; }
            .intro-overlay .skip-btn { 
                bottom: 15px; 
                right: 15px; 
                padding: 8px 20px; 
                font-size: 0.85em; 
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Audio Intro (dragon.wav) -->
    <audio id="introAudio" src="dragon.wav" preload="auto"></audio>

    <!-- Video Intro Overlay -->
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-video-container">
            <video id="introVideo" autoplay muted playsinline preload="auto">
                <source src="intro-dragon.mp4" type="video/mp4">
            </video>
            <button class="skip-btn" onclick="skipIntro()">⏭️ Lewati Intro</button>
            <div class="intro-progress" id="introProgress"></div>
        </div>
    </div>

    <div class="login-container" id="loginContainer">
        <h2>🐉 Login</h2>
        <p>Masuk untuk melanjutkan perburuan naga!</p>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
                <div class="caps-lock-warning" id="capsLockWarning">⚠️ Caps Lock aktif!</div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                <div class="caps-lock-warning" id="capsLockWarning2">⚠️ Caps Lock aktif!</div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
        </form>

        <div class="message" id="message"></div>

        <a href="register.html" class="register-link">Belum punya akun? Daftar di sini</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script>
        // ==================== FIREBASE CONFIG (EMBED) ====================
        const firebaseConfig = {
          apiKey: "AIzaSyDyn8s6NtJqOnN_hvWEqoRYbvYbq7TQqO8",
          authDomain: "dragonhunter-2fdb7.firebaseapp.com",
          databaseURL: "https://dragonhunter-2fdb7-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "dragonhunter-2fdb7",
          storageBucket: "dragonhunter-2fdb7.firebasestorage.app",
          messagingSenderId: "138293020401",
          appId: "1:138293020401:web:90502b724d0c30aabf4b50"
        };

        // Inisialisasi Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ========== UTILITAS ==========
        const PASSWORD_SALT = 'dragons_hunter_salt_2024';

        async function hashPassword(password) {
          try {
            if (window.crypto && window.crypto.subtle) {
              const encoder = new TextEncoder();
              const data = encoder.encode(password + PASSWORD_SALT);
              const hashBuffer = await crypto.subtle.digest('SHA-256', data);
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }
            
            let hash = 0;
            const saltedPassword = password + PASSWORD_SALT;
            for (let i = 0; i < saltedPassword.length; i++) {
              const char = saltedPassword.charCodeAt(i);
              hash = ((hash << 5) - hash) + char;
              hash = hash & hash;
            }
            return hash.toString(16);
          } catch (error) {
            console.error('Hash error:', error);
            throw error;
          }
        }

        function generateId(prefix = '') {
          return prefix + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // ========== FORMAT RUPIAH ==========
        function formatRupiah(amount) {
          return 'Rp ' + (amount || 0).toLocaleString('id-ID', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          });
        }

        // ========== SESSION MANAGEMENT ==========
        function saveSession(sessionData) {
          const session = {
            userId: sessionData.userId,
            username: sessionData.username,
            nama: sessionData.nama,
            balance: sessionData.balance,
            role: sessionData.role || 'user',
            loginTime: Date.now(),
            sessionId: generateId('sess_')
          };
          sessionStorage.setItem('dragonsHunterSession', JSON.stringify(session));
          localStorage.setItem('dragonsHunterActiveUser', JSON.stringify(session));
          return session;
        }

        function getSession() {
          try {
            const session = sessionStorage.getItem('dragonsHunterSession');
            if (session) return JSON.parse(session);
            const localSession = localStorage.getItem('dragonsHunterActiveUser');
            return localSession ? JSON.parse(localSession) : null;
          } catch (error) {
            console.error('Error parsing session:', error);
            return null;
          }
        }

        function clearSession() {
          sessionStorage.removeItem('dragonsHunterSession');
          localStorage.removeItem('dragonsHunterActiveUser');
          localStorage.removeItem('dragonsHunterSession');
          sessionStorage.removeItem('dragonsHunterActiveUser');
        }

        async function verifySession() {
          const session = getSession();
          if (!session || !session.userId) return null;
          try {
            const snapshot = await db.ref('users/' + session.userId).once('value');
            if (snapshot.exists()) {
              const userData = snapshot.val();
              if (userData.status === 'banned' || userData.status === 'deleted') {
                clearSession();
                return null;
              }
              session.balance = userData.balance;
              session.role = userData.role || 'user';
              sessionStorage.setItem('dragonsHunterSession', JSON.stringify(session));
              localStorage.setItem('dragonsHunterActiveUser', JSON.stringify(session));
              return session;
            }
            return null;
          } catch (error) {
            console.error('Error verifying session:', error);
            return null;
          }
        }

        // ========== SETUP DEFAULT CONFIG ==========
        async function setupDefaultConfig() {
          try {
            const rtpConfig = { global: 50, hewan: 50, naga: 50, harimau: 50, mode: 'normal', maxWin: 500000 };
            await db.ref('config/rtp').set(rtpConfig);
            const serverConfig = { maintenance: false, announcement: 'Selamat datang di Dragons Hunter!' };
            await db.ref('config/server').set(serverConfig);
            const adminConfigRef = db.ref('adminConfig');
            const adminSnapshot = await adminConfigRef.once('value');
            if (!adminSnapshot.exists() || !adminSnapshot.val().passwordHash) {
              const defaultHash = await hashPassword('admin123');
              await adminConfigRef.child('passwordHash').set(defaultHash);
              console.log('✅ Password admin default dibuat: admin123');
            }
            console.log('✅ Konfigurasi default berhasil dibuat!');
            return true;
          } catch (error) {
            console.error('❌ Gagal setup config:', error);
            return false;
          }
        }

        db.ref('config').once('value').then(snapshot => {
          if (!snapshot.exists()) {
            setupDefaultConfig();
          }
        });
        // ==================== AKHIR FIREBASE CONFIG ====================

        // State untuk mencegah double submit
        let isSubmitting = false;
        let loginAttempts = 0;
        const MAX_LOGIN_ATTEMPTS = 5;
        let lockoutTime = 0;
        let introSkipped = false;
        let audioPlayed = false;

        // ========== VIDEO INTRO ==========
        let introVideo = document.getElementById('introVideo');
        let introOverlay = document.getElementById('introOverlay');
        let introProgress = document.getElementById('introProgress');
        let introPlayed = sessionStorage.getItem('introPlayed');
        let introAudio = document.getElementById('introAudio');
        const INTRO_DURATION = 10;

        function updateProgress() {
            if (introVideo.duration > 0) {
                const progress = (introVideo.currentTime / introVideo.duration) * 100;
                introProgress.style.width = progress + '%';
            }
        }

        function playIntroAudio() {
            if (!audioPlayed && introAudio) {
                introAudio.volume = 0.5; // Volume 50%
                introAudio.play().catch(() => {
                    console.log('Audio intro tidak bisa diputar otomatis');
                });
                audioPlayed = true;
                
                // Batasi audio 10 detik
                setTimeout(() => {
                    introAudio.pause();
                    introAudio.currentTime = 0;
                }, 10000);
            }
        }

        function initIntro() {
            if (introPlayed) {
                introOverlay.style.display = 'none';
                introOverlay.classList.add('hidden');
                showLoginForm();
            } else {
                introOverlay.style.display = 'flex';
                
                // Putar video intro
                introVideo.play().catch(() => {
                    introVideo.muted = false;
                    introVideo.play().catch(() => {
                        showLoginForm();
                    });
                });
                
                // Putar audio intro (dragon.wav)
                playIntroAudio();

                setInterval(updateProgress, 100);

                setTimeout(() => {
                    if (!introSkipped) {
                        skipIntro();
                    }
                }, INTRO_DURATION * 1000);

                introVideo.addEventListener('ended', () => {
                    if (!introSkipped) {
                        skipIntro();
                    }
                });
            }
        }

        function skipIntro() {
            if (introSkipped) return;
            introSkipped = true;
            
            // Hentikan audio jika masih diputar
            if (introAudio) {
                introAudio.pause();
                introAudio.currentTime = 0;
            }
            
            introOverlay.classList.add('hidden');
            sessionStorage.setItem('introPlayed', 'true');
            
            setTimeout(() => {
                introOverlay.style.display = 'none';
                showLoginForm();
            }, 1500);
        }

        function showLoginForm() {
            const loginContainer = document.getElementById('loginContainer');
            loginContainer.classList.add('visible');
            
            setTimeout(() => {
                document.getElementById('username').focus();
            }, 500);
        }

        // ========== CAPS LOCK DETECTION ==========
        function detectCapsLock(event, warningId) {
            const warning = document.getElementById(warningId);
            if (event.getModifierState) {
                if (event.getModifierState('CapsLock')) {
                    warning.style.display = 'block';
                } else {
                    warning.style.display = 'none';
                }
            }
        }

        document.getElementById('username').addEventListener('keyup', (e) => detectCapsLock(e, 'capsLockWarning'));
        document.getElementById('password').addEventListener('keyup', (e) => detectCapsLock(e, 'capsLockWarning2'));

        // ========== LOCK/UNLOCK BUTTON ==========
        function lockButton(btn) {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        }

        function unlockButton(btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
        }

        // ========== LOGIN ==========
        async function handleLogin(event) {
            event.preventDefault();
            
            if (isSubmitting) return;
            
            if (Date.now() < lockoutTime) {
                const waitTime = Math.ceil((lockoutTime - Date.now()) / 1000);
                const messageEl = document.getElementById('message');
                messageEl.textContent = `⏱️ Terlalu banyak percobaan. Tunggu ${waitTime} detik.`;
                messageEl.className = 'message error';
                return;
            }

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');

            messageEl.className = 'message';
            messageEl.textContent = '';

            if (!username || !password) {
                messageEl.textContent = '❌ Username dan password wajib diisi!';
                messageEl.className = 'message error';
                return;
            }

            isSubmitting = true;
            lockButton(loginBtn);
            document.getElementById('loadingOverlay').classList.add('show');
            messageEl.textContent = '⏳ Memproses login...';
            messageEl.className = 'message';

            try {
                // Gunakan hashPassword yang sudah di-embed
                const hashedPassword = await hashPassword(password);

                const snapshot = await db.ref('users').orderByChild('username').equalTo(username).once('value');
                
                if (!snapshot.exists()) {
                    throw new Error('Username tidak ditemukan!');
                }

                let userData = null;
                let userId = null;
                snapshot.forEach((child) => {
                    userId = child.key;
                    userData = child.val();
                });

                // Cek status user
                if (userData.status === 'banned') {
                    throw new Error('Akun Anda telah diblokir! Hubungi admin.');
                }

                if (userData.passwordHash !== hashedPassword) {
                    loginAttempts++;
                    if (loginAttempts >= MAX_LOGIN_ATTEMPTS) {
                        lockoutTime = Date.now() + 300000; // 5 menit
                        throw new Error('Terlalu banyak percobaan gagal. Akun dikunci 5 menit.');
                    }
                    throw new Error(`Password salah! (Percobaan ${loginAttempts}/${MAX_LOGIN_ATTEMPTS})`);
                }

                loginAttempts = 0;

                // Update lastLogin dan online status
                await db.ref('users/' + userId + '/lastLogin').set(firebase.database.ServerValue.TIMESTAMP);
                await db.ref('users/' + userId + '/online').set(true);

                // Simpan session
                const sessionData = {
                    userId: userId,
                    username: userData.username,
                    nama: userData.nama,
                    balance: userData.balance,
                    role: userData.role || 'user'
                };
                
                saveSession(sessionData);

                messageEl.textContent = '✅ Login berhasil! Mengalihkan...';
                messageEl.className = 'message success';
                
                // Redirect ke game
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                messageEl.textContent = '❌ ' + error.message;
                messageEl.className = 'message error';
                unlockButton(loginBtn);
                isSubmitting = false;
                document.getElementById('loadingOverlay').classList.remove('show');
            }
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);

            // Inisialisasi intro
            initIntro();

            // Tampilkan pesan jika diarahkan dari register
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                const messageEl = document.getElementById('message');
                setTimeout(() => {
                    messageEl.textContent = '✅ Registrasi berhasil! Silakan login.';
                    messageEl.className = 'message success';
                }, 1800);
            }

            // Auto-redirect jika sudah login
            const session = getSession();
            if (session && session.userId) {
                verifySession().then((validSession) => {
                    if (validSession) {
                        window.location.href = 'index.html';
                    } else {
                        clearSession();
                        showLoginForm();
                    }
                });
            }
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker terdaftar:', registration.scope);
                        
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('Registrasi Service Worker gagal:', error);
                    });
            });
        }
    </script>
</body>
</html>
