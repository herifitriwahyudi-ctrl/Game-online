<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Login - Dragons Hunter</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b6914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dragons Hunter">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Georgia', serif; 
            background: url('background-dragon.png') no-repeat center center fixed; 
            background-size: cover; 
            background-color: #0a1f14; 
            min-height: 100vh; 
            overflow-x: hidden; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        body::before { 
            content: ''; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(10, 31, 20, 0.7); 
            z-index: -1; 
            pointer-events: none; 
        }
        
        /* Intro Video */
        .intro-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #000; 
            z-index: 99999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 0.8s ease; 
        }
        
        .intro-overlay.hidden { 
            opacity: 0; 
            pointer-events: none; 
        }
        
        .intro-overlay video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .intro-overlay .skip-btn { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            background: rgba(255,255,255,0.2); 
            border: 2px solid #fff; 
            color: #fff; 
            padding: 10px 25px; 
            font-size: 0.9em; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            z-index: 2; 
        }
        
        .intro-overlay .skip-btn:hover { 
            background: rgba(255,255,255,0.4); 
            transform: scale(1.05); 
        }
        
        .login-container { 
            max-width: 400px; 
            width: 90%; 
            margin: 20px; 
            padding: 30px; 
            background: linear-gradient(145deg, #2a1f0e, #1a1208); 
            border-radius: 30px; 
            border: 4px solid #8b6914; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3); 
            text-align: center; 
            position: relative; 
            z-index: 10; 
        }
        
        .login-container h2 { 
            color: #ffd700; 
            margin-bottom: 10px; 
            font-size: 2em; 
            text-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .login-container p { 
            color: #aaa; 
            margin-bottom: 25px; 
            font-size: 0.9em; 
        }
        
        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        
        .input-group label { 
            display: block; 
            color: #ffd700; 
            margin-bottom: 5px; 
            font-size: 0.85em; 
        }
        
        .input-group input { 
            width: 100%; 
            background: #1a1208; 
            border: 2px solid #8b6914; 
            border-radius: 10px; 
            padding: 12px; 
            color: #fff; 
            font-size: 1em; 
            transition: all 0.3s ease; 
        }
        
        .input-group input:focus { 
            outline: none; 
            border-color: #ffd700; 
            box-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .login-btn { 
            width: 100%; 
            background: linear-gradient(145deg, #ffd700, #ffaa00); 
            border: none; 
            padding: 15px; 
            font-size: 1.2em; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(255,215,0,0.4); 
            transition: all 0.3s ease; 
            color: #3d1e00; 
            margin-top: 10px; 
        }
        
        .login-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(255,215,0,0.6); 
        }
        
        .login-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none; 
        }
        
        .register-link { 
            display: block; 
            margin-top: 20px; 
            color: #ffd700; 
            text-decoration: none; 
            font-size: 0.9em; 
        }
        
        .register-link:hover { text-decoration: underline; }
        
        .message { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.9em; 
            display: none; 
        }
        
        .message.error { 
            background: rgba(255,68,68,0.2); 
            border: 2px solid #ff4444; 
            color: #ff6666; 
            display: block; 
        }
        
        .message.success { 
            background: rgba(0,255,136,0.2); 
            border: 2px solid #00ff88; 
            color: #00ff88; 
            display: block; 
        }
        
        .caps-lock-warning { 
            display: none; 
            color: #ffaa00; 
            font-size: 0.8em; 
            margin-top: 5px; 
        }
        
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .login-container { margin: 10px; padding: 20px; }
            .login-container h2 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Video Intro Overlay -->
    <div class="intro-overlay" id="introOverlay">
        <video id="introVideo" autoplay muted playsinline>
            <source src="intro-dragon.mp4" type="video/mp4">
            <img src="header-dragon.png" alt="Dragons Hunter" style="width: 100%; height: 100%; object-fit: cover;">
        </video>
        <button class="skip-btn" onclick="skipIntro()">⏭️ Lewati</button>
    </div>

    <div class="login-container">
        <h2>🐉 Login</h2>
        <p>Masuk untuk melanjutkan perburuan naga!</p>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
                <div class="caps-lock-warning" id="capsLockWarning">⚠️ Caps Lock aktif!</div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                <div class="caps-lock-warning" id="capsLockWarning2">⚠️ Caps Lock aktif!</div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
        </form>

        <div class="message" id="message"></div>

        <a href="register.html" class="register-link">Belum punya akun? Daftar di sini</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <script>
        // State untuk mencegah double submit
        let isSubmitting = false;
        let loginAttempts = 0;
        const MAX_LOGIN_ATTEMPTS = 5;
        let lockoutTime = 0;

        // ========== VIDEO INTRO ==========
        let introVideo = document.getElementById('introVideo');
        let introOverlay = document.getElementById('introOverlay');
        let introPlayed = sessionStorage.getItem('introPlayed');

        if (introPlayed) {
            introOverlay.classList.add('hidden');
            introOverlay.style.display = 'none';
        } else {
            introVideo.play().catch(() => {
                introVideo.muted = false;
                introVideo.play();
            });

            introVideo.addEventListener('ended', () => {
                skipIntro();
            });

            setTimeout(() => {
                if (!introVideo.ended && !introVideo.paused) {
                    // Video masih diputar
                } else if (introVideo.readyState === 0) {
                    skipIntro();
                }
            }, 5000);
        }

        function skipIntro() {
            introOverlay.classList.add('hidden');
            sessionStorage.setItem('introPlayed', 'true');
            
            setTimeout(() => {
                introOverlay.style.display = 'none';
            }, 800);
            
            document.getElementById('username').focus();
        }

        // ========== CAPS LOCK DETECTION ==========
        function detectCapsLock(event, warningId) {
            const warning = document.getElementById(warningId);
            if (event.getModifierState) {
                if (event.getModifierState('CapsLock')) {
                    warning.style.display = 'block';
                } else {
                    warning.style.display = 'none';
                }
            }
        }

        document.getElementById('username').addEventListener('keyup', (e) => detectCapsLock(e, 'capsLockWarning'));
        document.getElementById('password').addEventListener('keyup', (e) => detectCapsLock(e, 'capsLockWarning2'));

        // ========== LOGIN ==========
        async function handleLogin(event) {
            event.preventDefault();
            
            // Prevent double submit
            if (isSubmitting) return;
            
            // Check lockout
            if (Date.now() < lockoutTime) {
                const waitTime = Math.ceil((lockoutTime - Date.now()) / 1000);
                const messageEl = document.getElementById('message');
                messageEl.textContent = `⏱️ Terlalu banyak percobaan. Tunggu ${waitTime} detik.`;
                messageEl.className = 'message error';
                return;
            }

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');

            // Reset message
            messageEl.className = 'message';
            messageEl.textContent = '';

            // Validasi input
            if (!username || !password) {
                messageEl.textContent = '❌ Username dan password wajib diisi!';
                messageEl.className = 'message error';
                return;
            }

            // Lock button
            isSubmitting = true;
            lockButton(loginBtn);
            document.getElementById('loadingOverlay').classList.add('show');
            messageEl.textContent = '⏳ Memproses login...';
            messageEl.className = 'message';

            try {
                // Hash password
                const hashedPassword = await hashPassword(password);

                // Cari user berdasarkan username
                const snapshot = await db.ref('users').orderByChild('username').equalTo(username).once('value');
                
                if (!snapshot.exists()) {
                    throw new Error('Username tidak ditemukan!');
                }

                // Ambil data user
                let userData = null;
                let userId = null;
                snapshot.forEach((child) => {
                    userId = child.key;
                    userData = child.val();
                });

                // Verifikasi password
                if (userData.passwordHash !== hashedPassword) {
                    loginAttempts++;
                    if (loginAttempts >= MAX_LOGIN_ATTEMPTS) {
                        lockoutTime = Date.now() + 300000; // 5 menit
                        throw new Error('Terlalu banyak percobaan gagal. Akun dikunci 5 menit.');
                    }
                    throw new Error(`Password salah! (Percobaan ${loginAttempts}/${MAX_LOGIN_ATTEMPTS})`);
                }

                // Reset login attempts
                loginAttempts = 0;

                // Update last login
                await db.ref('users/' + userId + '/lastLogin').set(firebase.database.ServerValue.TIMESTAMP);

                // Update status online
                await db.ref('users/' + userId + '/online').set(true);

                // Simpan session
                const sessionData = await saveSession({
                    userId: userId,
                    username: userData.username,
                    nama: userData.nama,
                    balance: userData.balance,
                    role: userData.role || 'user'
                });

                messageEl.textContent = '✅ Login berhasil! Mengalihkan...';
                messageEl.className = 'message success';
                
                // Redirect sesuai role
                setTimeout(() => {
                    if (userData.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);

            } catch (error) {
                messageEl.textContent = '❌ ' + error.message;
                messageEl.className = 'message error';
                unlockButton(loginBtn);
                isSubmitting = false;
                document.getElementById('loadingOverlay').classList.remove('show');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);

            // Auto-redirect jika sudah login
            const session = getSession();
            if (session && session.userId) {
                verifySession().then((validSession) => {
                    if (validSession) {
                        if (validSession.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }
                });
            }
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker terdaftar:', registration.scope);
                        
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('Registrasi Service Worker gagal:', error);
                    });
            });
        }
    </script>
</body>
</html>
