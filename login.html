<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐉 Dragons Hunter - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1f14, #1a2f1f, #0d2818);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 20px;
            border: 3px solid #ffd700;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h1 {
            font-size: 2em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #aaa;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 12px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff6b6b;
            text-align: center;
            margin: 10px 0;
            font-size: 0.9em;
            display: none;
            background: rgba(255, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9em;
        }

        .register-link a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🐉 Login</h1>
            <p>Masuk untuk melanjutkan perburuan naga!</p>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password">
        </div>

        <button class="btn-login" onclick="login()">🔑 Masuk</button>

        <div class="error-msg" id="errorMsg"></div>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Daftar di sini</a>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // ========== FUNGSI LOGIN ==========
        async function login() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Reset pesan
            errorMsg.style.display = 'none';

            // Validasi input
            if (username.length < 3) {
                showError('Username minimal 3 karakter!');
                return;
            }

            if (password.length < 6) {
                showError('Password minimal 6 karakter!');
                return;
            }

            // Tampilkan loading
            document.getElementById('loadingOverlay').classList.add('show');

            try {
                // Cek user di database berdasarkan username
                const snapshot = await db.ref('users').orderByChild('username').equalTo(username).once('value');
                
                if (snapshot.exists()) {
                    let userData = null;
                    let userId = null;
                    
                    snapshot.forEach(child => {
                        userData = child.val();
                        userId = child.key;
                    });
                    
                    // Cek password
                    if (userData.password === password) {
                        // Login berhasil
                        sessionStorage.setItem('dragonsHunterSession', JSON.stringify({
                            userId: userId,
                            username: username,
                            balance: userData.balance
                        }));
                        
                        localStorage.setItem('dragonsHunterSession', JSON.stringify({
                            userId: userId,
                            username: username,
                            balance: userData.balance
                        }));
                        
                        // Redirect ke index.html
                        window.location.href = 'index.html';
                        
                    } else {
                        document.getElementById('loadingOverlay').classList.remove('show');
                        showError('Password salah!');
                    }
                } else {
                    document.getElementById('loadingOverlay').classList.remove('show');
                    showError('Username tidak ditemukan!');
                }

            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('loadingOverlay').classList.remove('show');
                showError('Terjadi kesalahan: ' + error.message);
            }
        }

        // ========== FUNGSI TAMPILKAN ERROR ==========
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '❌ ' + message;
            errorMsg.style.display = 'block';
        }

        // ========== ENTER KEY UNTUK LOGIN ==========
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
