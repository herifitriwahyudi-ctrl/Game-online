<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐉 Dragons Hunter - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1f14, #1a2f1f, #0d2818);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .register-container {
            max-width: 400px;
            width: 100%;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            border-radius: 20px;
            border: 3px solid #ffd700;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-header h1 {
            font-size: 2em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .register-header p {
            color: #aaa;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 12px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff6b6b;
            text-align: center;
            margin: 10px 0;
            font-size: 0.9em;
            display: none;
            background: rgba(255, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .success-msg {
            color: #00ff88;
            text-align: center;
            margin: 10px 0;
            font-size: 0.9em;
            display: none;
            background: rgba(0, 255, 136, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9em;
        }

        .login-link a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>🐉 Register</h1>
            <p>Buat akun baru untuk berburu naga!</p>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username (min. 3 karakter)" minlength="3" maxlength="20">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password (min. 6 karakter)" minlength="6">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Konfirmasi Password</label>
            <input type="password" id="confirmPassword" placeholder="Ulangi password">
        </div>

        <button class="btn-register" onclick="register()">📝 Daftar</button>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // ========== FUNGSI REGISTER ==========
        async function register() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Reset pesan
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Validasi input
            if (username.length < 3) {
                showError('Username minimal 3 karakter!');
                return;
            }

            if (password.length < 6) {
                showError('Password minimal 6 karakter!');
                return;
            }

            if (password !== confirmPassword) {
                showError('Konfirmasi password tidak cocok!');
                return;
            }

            // Tampilkan loading
            document.getElementById('loadingOverlay').classList.add('show');

            try {
                // Cek apakah username sudah digunakan
                const snapshot = await db.ref('users').orderByChild('username').equalTo(username).once('value');
                
                if (snapshot.exists()) {
                    document.getElementById('loadingOverlay').classList.remove('show');
                    showError('Username sudah digunakan!');
                    return;
                }

                // Buat user baru
                const newUserRef = db.ref('users').push();
                const userId = newUserRef.key;
                
                await newUserRef.set({
                    userId: userId,
                    username: username,
                    password: password,
                    balance: 10000, // Saldo awal
                    role: 'user',
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });

                // Simpan ke usernameIndex untuk pencarian cepat
                await db.ref('usernameIndex/' + username.toLowerCase()).set(userId);

                // Tampilkan pesan sukses
                document.getElementById('loadingOverlay').classList.remove('show');
                successMsg.textContent = '✅ Registrasi berhasil! Silakan login.';
                successMsg.style.display = 'block';

                // Redirect ke login setelah 2 detik
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Register error:', error);
                document.getElementById('loadingOverlay').classList.remove('show');
                showError('Terjadi kesalahan: ' + error.message);
            }
        }

        // ========== FUNGSI TAMPILKAN ERROR ==========
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '❌ ' + message;
            errorMsg.style.display = 'block';
        }

        // ========== ENTER KEY UNTUK REGISTER ==========
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                register();
            }
        });
    </script>
</body>
</html>
