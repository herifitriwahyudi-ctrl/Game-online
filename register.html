<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Daftar Akun - Dragons Hunter</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b6914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dragons Hunter">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Georgia', serif; 
            background: url('background-dragon.png') no-repeat center center fixed; 
            background-size: cover; 
            background-color: #0a1f14; 
            min-height: 100vh; 
            overflow-x: hidden; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        body::before { 
            content: ''; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(10, 31, 20, 0.7); 
            z-index: -1; 
            pointer-events: none; 
        }
        
        .register-container { 
            max-width: 450px; 
            width: 90%; 
            margin: 20px; 
            padding: 30px; 
            background: linear-gradient(145deg, #2a1f0e, #1a1208); 
            border-radius: 30px; 
            border: 4px solid #8b6914; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3); 
            text-align: center; 
            position: relative; 
            z-index: 10; 
        }
        
        .register-container h2 { 
            color: #ffd700; 
            margin-bottom: 10px; 
            font-size: 2em; 
            text-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .register-container p { 
            color: #aaa; 
            margin-bottom: 25px; 
            font-size: 0.9em; 
        }
        
        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        
        .input-group label { 
            display: block; 
            color: #ffd700; 
            margin-bottom: 5px; 
            font-size: 0.85em; 
        }
        
        .input-group input, .input-group select { 
            width: 100%; 
            background: #1a1208; 
            border: 2px solid #8b6914; 
            border-radius: 10px; 
            padding: 12px; 
            color: #fff; 
            font-size: 1em; 
            transition: all 0.3s ease; 
        }
        
        .input-group select { cursor: pointer; }
        .input-group select option { background: #1a1208; color: #fff; }
        
        .input-group input:focus, .input-group select:focus { 
            outline: none; 
            border-color: #ffd700; 
            box-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .register-btn { 
            width: 100%; 
            background: linear-gradient(145deg, #ffd700, #ffaa00); 
            border: none; 
            padding: 15px; 
            font-size: 1.2em; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(255,215,0,0.4); 
            transition: all 0.3s ease; 
            color: #3d1e00; 
            margin-top: 10px; 
        }
        
        .register-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(255,215,0,0.6); 
        }
        
        .register-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none; 
        }
        
        .login-link { 
            display: block; 
            margin-top: 20px; 
            color: #ffd700; 
            text-decoration: none; 
            font-size: 0.9em; 
        }
        
        .login-link:hover { text-decoration: underline; }
        
        .message { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.9em; 
            display: none; 
        }
        
        .message.error { 
            background: rgba(255,68,68,0.2); 
            border: 2px solid #ff4444; 
            color: #ff6666; 
            display: block; 
        }
        
        .message.success { 
            background: rgba(0,255,136,0.2); 
            border: 2px solid #00ff88; 
            color: #00ff88; 
            display: block; 
        }
        
        .strength-bar { 
            height: 4px; 
            background: #333; 
            border-radius: 2px; 
            margin-top: 5px; 
            overflow: hidden; 
        }
        
        .strength-fill { 
            height: 100%; 
            width: 0%; 
            background: #ff4444; 
            transition: all 0.3s ease; 
        }
        
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99999;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .register-container { margin: 10px; padding: 20px; }
            .register-container h2 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <div class="register-container">
        <h2>🐉 Daftar Akun</h2>
        <p>Buat akun baru untuk mulai berburu naga!</p>

        <form id="registerForm" novalidate>
            <div class="input-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" required minlength="3">
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
                <div style="color: #aaa; font-size: 0.8em; margin-top: 3px;">Minimal 3 karakter, hanya huruf/angka/underscore</div>
            </div>

            <div class="input-group">
                <label for="noWhatsapp">Nomor WhatsApp</label>
                <input type="tel" id="noWhatsapp" placeholder="Contoh: 08123456789" required pattern="[0-9+]{10,15}">
            </div>

            <div class="input-group">
                <label for="withdrawMethod">Metode Penarikan</label>
                <select id="withdrawMethod" required>
                    <option value="">-- Pilih Metode --</option>
                    <option value="E-Wallet">📱 E-Wallet (DANA, OVO, GoPay, dll)</option>
                    <option value="Rekening Bank">🏦 Rekening Bank (BCA, BRI, dll)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="withdrawAccount">Nomor / Rekening Tujuan</label>
                <input type="text" id="withdrawAccount" placeholder="Masukkan nomor e-wallet / rekening" required minlength="5">
            </div>

            <div class="input-group">
                <label for="withdrawName">Nama Pemilik Akun Tujuan</label>
                <input type="text" id="withdrawName" placeholder="Masukkan nama pemilik akun" required minlength="3">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password" required minlength="6">
            </div>

            <button type="submit" class="register-btn" id="registerBtn">Daftar Sekarang</button>
        </form>

        <div class="message" id="message"></div>

        <a href="login.html" class="login-link">Sudah punya akun? Login di sini</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script>
        // ==================== FIREBASE CONFIG (LANGSUNG DITEMPEL) ====================
        const firebaseConfig = {
          apiKey: "AIzaSyDyn8s6NtJqOnN_hvWEqoRYbvYbq7TQqO8",
          authDomain: "dragonhunter-2fdb7.firebaseapp.com",
          databaseURL: "https://dragonhunter-2fdb7-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "dragonhunter-2fdb7",
          storageBucket: "dragonhunter-2fdb7.firebasestorage.app",
          messagingSenderId: "138293020401",
          appId: "1:138293020401:web:90502b724d0c30aabf4b50"
        };

        // Inisialisasi Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ========== UTILITAS KONSISTEN ==========
        const PASSWORD_SALT = 'dragons_hunter_salt_2024';

        async function hashPassword(password) {
          try {
            if (window.crypto && window.crypto.subtle) {
              const encoder = new TextEncoder();
              const data = encoder.encode(password + PASSWORD_SALT);
              const hashBuffer = await crypto.subtle.digest('SHA-256', data);
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }
            
            let hash = 0;
            const saltedPassword = password + PASSWORD_SALT;
            for (let i = 0; i < saltedPassword.length; i++) {
              const char = saltedPassword.charCodeAt(i);
              hash = ((hash << 5) - hash) + char;
              hash = hash & hash;
            }
            return hash.toString(16);
          } catch (error) {
            console.error('Hash error:', error);
            throw error;
          }
        }

        function generateId(prefix = '') {
          return prefix + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function validateUsername(username) {
          return /^[a-zA-Z0-9_]{3,20}$/.test(username);
        }

        function validatePhone(phone) {
          return /^[0-9+]{10,15}$/.test(phone);
        }

        function formatRupiah(amount) {
          return 'Rp ' + (amount || 0).toLocaleString('id-ID', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          });
        }

        function formatDateTime(timestamp) {
          if (!timestamp) return '-';
          const date = new Date(timestamp);
          return date.toLocaleString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        }

        async function isTransactionProcessed(userId, transactionId) {
          try {
            const snapshot = await db.ref('transactions/' + userId + '/' + transactionId + '/status').once('value');
            const status = snapshot.val();
            return status === 'approved' || status === 'rejected';
          } catch (error) {
            console.error('Error checking transaction status:', error);
            return false;
          }
        }

        async function processTopUpApproval(userId, transactionId, amount) {
          try {
            const alreadyProcessed = await isTransactionProcessed(userId, transactionId);
            if (alreadyProcessed) {
              return { success: false, message: 'Transaksi sudah diproses sebelumnya!' };
            }
            await db.ref('transactions/' + userId + '/' + transactionId + '/status').set('approved');
            const result = await db.ref('users/' + userId + '/balance').transaction((currentBalance) => {
              return (currentBalance || 0) + amount;
            });
            if (result.committed) {
              return { success: true, message: 'Top up berhasil diproses!' };
            } else {
              await db.ref('transactions/' + userId + '/' + transactionId + '/status').set('pending');
              return { success: false, message: 'Gagal memproses transaksi!' };
            }
          } catch (error) {
            console.error('Error processing top up:', error);
            return { success: false, message: error.message };
          }
        }

        async function processWithdrawApproval(userId, transactionId, amount) {
          try {
            const alreadyProcessed = await isTransactionProcessed(userId, transactionId);
            if (alreadyProcessed) {
              return { success: false, message: 'Transaksi sudah diproses sebelumnya!' };
            }
            const balanceSnapshot = await db.ref('users/' + userId + '/balance').once('value');
            const currentBalance = balanceSnapshot.val() || 0;
            if (currentBalance < amount) {
              await db.ref('transactions/' + userId + '/' + transactionId + '/status').set('rejected');
              return { success: false, message: 'Saldo tidak mencukupi!' };
            }
            await db.ref('transactions/' + userId + '/' + transactionId + '/status').set('approved');
            const result = await db.ref('users/' + userId + '/balance').transaction((currentBalance) => {
              return (currentBalance || 0) - amount;
            });
            if (result.committed) {
              return { success: true, message: 'Withdraw berhasil diproses!' };
            } else {
              await db.ref('transactions/' + userId + '/' + transactionId + '/status').set('pending');
              return { success: false, message: 'Gagal memproses transaksi!' };
            }
          } catch (error) {
            console.error('Error processing withdraw:', error);
            return { success: false, message: error.message };
          }
        }

        function saveSession(sessionData) {
          const session = {
            userId: sessionData.userId,
            username: sessionData.username,
            nama: sessionData.nama,
            balance: sessionData.balance,
            role: sessionData.role || 'user',
            loginTime: Date.now(),
            sessionId: generateId('sess_')
          };
          sessionStorage.setItem('dragonsHunterSession', JSON.stringify(session));
          localStorage.setItem('dragonsHunterActiveUser', JSON.stringify(session));
          return session;
        }

        function getSession() {
          try {
            const session = sessionStorage.getItem('dragonsHunterSession');
            if (session) return JSON.parse(session);
            const localSession = localStorage.getItem('dragonsHunterActiveUser');
            return localSession ? JSON.parse(localSession) : null;
          } catch (error) {
            console.error('Error parsing session:', error);
            return null;
          }
        }

        function clearSession() {
          sessionStorage.removeItem('dragonsHunterSession');
          localStorage.removeItem('dragonsHunterActiveUser');
          localStorage.removeItem('dragonsHunterSession');
          sessionStorage.removeItem('dragonsHunterActiveUser');
        }

        async function verifySession() {
          const session = getSession();
          if (!session || !session.userId) return null;
          try {
            const snapshot = await db.ref('users/' + session.userId).once('value');
            if (snapshot.exists()) {
              const userData = snapshot.val();
              if (userData.status === 'banned' || userData.status === 'deleted') {
                clearSession();
                return null;
              }
              session.balance = userData.balance;
              session.role = userData.role || 'user';
              sessionStorage.setItem('dragonsHunterSession', JSON.stringify(session));
              localStorage.setItem('dragonsHunterActiveUser', JSON.stringify(session));
              return session;
            }
            return null;
          } catch (error) {
            console.error('Error verifying session:', error);
            return null;
          }
        }

        async function setupDefaultConfig() {
          try {
            const rtpConfig = { global: 50, hewan: 50, naga: 50, harimau: 50, mode: 'normal', maxWin: 500000 };
            await db.ref('config/rtp').set(rtpConfig);
            const serverConfig = { maintenance: false, announcement: 'Selamat datang di Dragons Hunter!' };
            await db.ref('config/server').set(serverConfig);
            const adminConfigRef = db.ref('adminConfig');
            const adminSnapshot = await adminConfigRef.once('value');
            if (!adminSnapshot.exists() || !adminSnapshot.val().passwordHash) {
              const defaultHash = await hashPassword('admin123');
              await adminConfigRef.child('passwordHash').set(defaultHash);
              console.log('✅ Password admin default dibuat: admin123');
            }
            console.log('✅ Konfigurasi default berhasil dibuat!');
            return true;
          } catch (error) {
            console.error('❌ Gagal setup config:', error);
            return false;
          }
        }

        db.ref('config').once('value').then(snapshot => {
          if (!snapshot.exists()) {
            setupDefaultConfig();
          }
        });
        // ==================== AKHIR FIREBASE CONFIG ====================

        // State untuk mencegah double submit
        let isSubmitting = false;

        function lockButton(btn) {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        }

        function unlockButton(btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
        }

        function showLoading() {
            document.getElementById('loadingSpinner').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        const usernameCache = new Map();
        async function checkUsernameUnique(username) {
            if (usernameCache.has(username)) {
                return usernameCache.get(username);
            }
            const result = await new Promise((resolve) => {
                db.ref('usernameIndex/' + username).once('value')
                    .then(snapshot => {
                        resolve(!snapshot.exists());
                    })
                    .catch(() => resolve(false));
            });
            usernameCache.set(username, result);
            return result;
        }

        async function checkWhatsappUnique(noWhatsapp) {
            const result = await new Promise((resolve) => {
                db.ref('users').orderByChild('noWhatsapp').equalTo(noWhatsapp).once('value')
                    .then(snapshot => {
                        resolve(!snapshot.exists());
                    })
                    .catch(() => resolve(false));
            });
            return result;
        }

        let usernameCheckTimeout;
        document.getElementById('username').addEventListener('input', function() {
            clearTimeout(usernameCheckTimeout);
            const username = this.value.toLowerCase();
            usernameCheckTimeout = setTimeout(async () => {
                if (username.length >= 3) {
                    const isUnique = await checkUsernameUnique(username);
                    if (!isUnique) {
                        this.style.borderColor = '#ff4444';
                        this.title = 'Username sudah digunakan';
                    } else {
                        this.style.borderColor = '#8b6914';
                        this.title = '';
                    }
                }
            }, 500);
        });

        async function handleRegister(event) {
            event.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;

            const nama = document.getElementById('nama').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const noWhatsapp = document.getElementById('noWhatsapp').value.trim();
            const withdrawMethod = document.getElementById('withdrawMethod').value;
            const withdrawAccount = document.getElementById('withdrawAccount').value.trim();
            const withdrawName = document.getElementById('withdrawName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');
            const registerBtn = document.getElementById('registerBtn');

            messageEl.className = 'message';
            messageEl.textContent = '';

            if (nama.length < 3) { 
                messageEl.textContent = '❌ Nama minimal 3 karakter!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (!validateUsername(username)) { 
                messageEl.textContent = '❌ Username harus 3-20 karakter, hanya huruf/angka/underscore!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (!validatePhone(noWhatsapp)) { 
                messageEl.textContent = '❌ Nomor WhatsApp tidak valid!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (!withdrawMethod) { 
                messageEl.textContent = '❌ Pilih metode penarikan!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (withdrawAccount.length < 5) { 
                messageEl.textContent = '❌ Nomor tujuan tidak valid!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (withdrawName.length < 3) { 
                messageEl.textContent = '❌ Nama pemilik akun tujuan tidak valid!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (password.length < 6) { 
                messageEl.textContent = '❌ Password minimal 6 karakter!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }
            
            if (password !== confirmPassword) { 
                messageEl.textContent = '❌ Konfirmasi password tidak cocok!'; 
                messageEl.className = 'message error'; 
                isSubmitting = false;
                return; 
            }

            lockButton(registerBtn);
            showLoading();
            messageEl.textContent = '⏳ Memeriksa ketersediaan...';
            messageEl.className = 'message';

            try {
                if (typeof db === 'undefined') {
                    throw new Error('Firebase belum terinisialisasi!');
                }

                const isUsernameUnique = await checkUsernameUnique(username);
                if (!isUsernameUnique) {
                    throw new Error('Username sudah digunakan!');
                }

                const isWhatsappUnique = await checkWhatsappUnique(noWhatsapp);
                if (!isWhatsappUnique) {
                    throw new Error('Nomor WhatsApp sudah terdaftar!');
                }

                const hashedPassword = await hashPassword(password);
                const userId = generateId('user_');

                await db.ref('users/' + userId).set({
                    userId: userId,
                    nama: nama,
                    username: username,
                    noWhatsapp: noWhatsapp,
                    withdrawMethod: withdrawMethod,
                    withdrawAccount: withdrawAccount,
                    withdrawName: withdrawName,
                    passwordHash: hashedPassword,
                    balance: 10000,
                    role: 'user',
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    lastLogin: null,
                    online: false,
                    status: 'active',
                    gameStats: {
                        totalBets: 0,
                        totalWins: 0,
                        totalLosses: 0,
                        totalProfit: 0
                    }
                });

                await db.ref('usernameIndex/' + username).set({
                    userId: userId,
                    username: username
                });

                messageEl.textContent = '✅ Akun berhasil dibuat! Mengalihkan ke login...';
                messageEl.className = 'message success';
                
                setTimeout(() => {
                    window.location.href = 'login.html?registered=true';
                }, 1500);

            } catch (error) {
                console.error('Error saat register:', error);
                messageEl.textContent = '❌ ' + error.message;
                messageEl.className = 'message error';
                unlockButton(registerBtn);
                isSubmitting = false;
            } finally {
                hideLoading();
            }
        }

        document.getElementById('password').addEventListener('input', function() {
            const strength = this.value.length;
            const fill = document.getElementById('strengthFill');
            
            if (strength === 0) {
                fill.style.width = '0%';
            } else if (strength < 6) {
                fill.style.width = '25%';
                fill.style.background = '#ff4444';
            } else if (strength < 8) {
                fill.style.width = '50%';
                fill.style.background = '#ffaa00';
            } else if (strength < 12) {
                fill.style.width = '75%';
                fill.style.background = '#00ff88';
            } else {
                fill.style.width = '100%';
                fill.style.background = '#00ff88';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirm = this.value;
            
            if (confirm.length > 0) {
                if (password === confirm) {
                    this.style.borderColor = '#00ff88';
                } else {
                    this.style.borderColor = '#ff4444';
                }
            } else {
                this.style.borderColor = '#8b6914';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM Loaded!');
            document.getElementById('registerForm').addEventListener('submit', handleRegister);
            
            const session = getSession();
            if (session && session.userId) {
                window.location.href = 'index.html';
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                const messageEl = document.getElementById('message');
                messageEl.textContent = '✅ Registrasi berhasil! Silakan login.';
                messageEl.className = 'message success';
            }
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker terdaftar:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Registrasi Service Worker gagal:', error);
                    });
            });
        }
    </script>
</body>
