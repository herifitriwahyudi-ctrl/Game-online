<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Daftar Akun - Dragons Hunter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: url('background-dragon.png') no-repeat center center fixed; background-size: cover; background-color: #0a1f14; min-height: 100vh; overflow-x: hidden; color: #fff; display: flex; align-items: center; justify-content: center; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 31, 20, 0.7); z-index: -1; pointer-events: none; }
        .register-container { max-width: 450px; width: 90%; margin: 20px; padding: 30px; background: linear-gradient(145deg, #2a1f0e, #1a1208); border-radius: 30px; border: 4px solid #8b6914; box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,105,20,0.3); text-align: center; position: relative; z-index: 10; }
        .register-container h2 { color: #ffd700; margin-bottom: 10px; font-size: 2em; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .register-container p { color: #aaa; margin-bottom: 25px; font-size: 0.9em; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; color: #ffd700; margin-bottom: 5px; font-size: 0.85em; }
        .input-group input, .input-group select { width: 100%; background: #1a1208; border: 2px solid #8b6914; border-radius: 10px; padding: 12px; color: #fff; font-size: 1em; transition: all 0.3s ease; }
        .input-group select { cursor: pointer; }
        .input-group select option { background: #1a1208; color: #fff; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .register-btn { width: 100%; background: linear-gradient(145deg, #ffd700, #ffaa00); border: none; padding: 15px; font-size: 1.2em; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255,215,0,0.4); transition: all 0.3s ease; color: #3d1e00; margin-top: 10px; }
        .register-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,215,0,0.6); }
        .register-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .login-link { display: block; margin-top: 20px; color: #ffd700; text-decoration: none; font-size: 0.9em; }
        .login-link:hover { text-decoration: underline; }
        .message { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 0.9em; display: none; }
        .message.error { background: rgba(255,68,68,0.2); border: 2px solid #ff4444; color: #ff6666; display: block; }
        .message.success { background: rgba(0,255,136,0.2); border: 2px solid #00ff88; color: #00ff88; display: block; }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>🐉 Daftar Akun</h2>
        <p>Buat akun baru untuk mulai berburu naga!</p>

        <form id="registerForm">
            <div class="input-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="input-group">
                <label for="username">Username (Email)</label>
                <input type="email" id="username" placeholder="Masukkan email (contoh: user@gmail.com)" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="noWhatsapp">Nomor WhatsApp</label>
                <input type="tel" id="noWhatsapp" placeholder="Contoh: 08123456789" required pattern="[0-9+]{10,15}">
            </div>

            <div class="input-group">
                <label for="withdrawMethod">Metode Penarikan</label>
                <select id="withdrawMethod" required>
                    <option value="">-- Pilih Metode --</option>
                    <option value="E-Wallet">📱 E-Wallet (DANA, OVO, GoPay, dll)</option>
                    <option value="Rekening Bank">🏦 Rekening Bank (BCA, BRI, dll)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="withdrawAccount">Nomor / Rekening Tujuan</label>
                <input type="text" id="withdrawAccount" placeholder="Masukkan nomor e-wallet / rekening" required>
            </div>

            <div class="input-group">
                <label for="withdrawName">Nama Pemilik Akun Tujuan</label>
                <input type="text" id="withdrawName" placeholder="Masukkan nama pemilik akun" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password" required autocomplete="new-password">
            </div>

            <button type="submit" class="register-btn" id="registerBtn">Daftar Sekarang</button>
        </form>

        <div class="message" id="message"></div>

        <a href="login.html" class="login-link">Sudah punya akun? Login di sini</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <script>
        function handleRegister(event) {
            event.preventDefault();

            const nama = document.getElementById('nama').value.trim();
            const email = document.getElementById('username').value.trim();
            const noWhatsapp = document.getElementById('noWhatsapp').value.trim();
            const withdrawMethod = document.getElementById('withdrawMethod').value;
            const withdrawAccount = document.getElementById('withdrawAccount').value.trim();
            const withdrawName = document.getElementById('withdrawName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');

            messageEl.className = 'message';
            messageEl.textContent = '';

            if (nama.length < 3) { messageEl.textContent = '❌ Nama minimal 3 karakter!'; messageEl.className = 'message error'; return; }
            if (email.length < 4) { messageEl.textContent = '❌ Email tidak valid!'; messageEl.className = 'message error'; return; }
            if (!/^[0-9+]{10,15}$/.test(noWhatsapp)) { messageEl.textContent = '❌ Nomor WhatsApp tidak valid!'; messageEl.className = 'message error'; return; }
            if (!withdrawMethod) { messageEl.textContent = '❌ Pilih metode penarikan!'; messageEl.className = 'message error'; return; }
            if (withdrawAccount.length < 5) { messageEl.textContent = '❌ Nomor tujuan tidak valid!'; messageEl.className = 'message error'; return; }
            if (withdrawName.length < 3) { messageEl.textContent = '❌ Nama pemilik akun tujuan tidak valid!'; messageEl.className = 'message error'; return; }
            if (password.length < 6) { messageEl.textContent = '❌ Password minimal 6 karakter!'; messageEl.className = 'message error'; return; }
            if (password !== confirmPassword) { messageEl.textContent = '❌ Konfirmasi password tidak cocok!'; messageEl.className = 'message error'; return; }

            document.getElementById('registerBtn').disabled = true;
            messageEl.textContent = '⏳ Membuat akun...';
            messageEl.className = 'message';

            // Firebase Authentication
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    // Simpan data ke Realtime Database
                    return db.ref('users/' + user.uid).set({
                        nama: nama,
                        email: email,
                        noWhatsapp: noWhatsapp,
                        withdrawMethod: withdrawMethod,
                        withdrawAccount: withdrawAccount,
                        withdrawName: withdrawName,
                        balance: 10000,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    });
                })
                .then(() => {
                    messageEl.textContent = '✅ Akun berhasil dibuat! Mengalihkan ke login...';
                    messageEl.className = 'message success';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                })
                .catch((error) => {
                    messageEl.textContent = '❌ ' + error.message;
                    messageEl.className = 'message error';
                    document.getElementById('registerBtn').disabled = false;
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('registerForm').addEventListener('submit', handleRegister);
        });
    </script>
</body>
</html>
